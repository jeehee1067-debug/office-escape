<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>칼퇴 픽셀 로드 : 신입사원의 탈출기 v3.0</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #1a1a24;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #fff;
    }

    /* 게임 메인 프레임 */
    #game-container {
      width: 640px;
      height: 520px;
      background-color: #2b2b36;
      border: 6px solid #4a4a5a;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
    }

    /* 클릭 감지 테스트용 상단 상태 로그 바 */
    #status-bar {
      background: #111;
      color: #00ffcc;
      font-size: 12px;
      padding: 8px 12px;
      border-bottom: 2px solid #4a4a5a;
      font-family: monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      z-index: 100;
    }

    /* 사무실 배경 화면 */
    #screen {
      width: 100%;
      height: 300px;
      position: relative;
      background-color: #3a3d52;
      background-image: 
        radial-gradient(#4a4d66 15%, transparent 16%),
        radial-gradient(#4a4d66 15%, transparent 16%);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
    }

    .office-bg-2 {
      background-color: #4d3a52 !important;
      background-image: 
        radial-gradient(#664a66 15%, transparent 16%),
        radial-gradient(#664a66 15%, transparent 16%) !important;
    }

    #room-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #ffd700;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 13px;
      color: #ffd700;
      z-index: 10;
      font-weight: bold;
    }

    /* 클릭 가능 오브젝트 (영역 명확화 및 터치 보장) */
    .pixel-object {
      position: absolute;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px dashed rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      z-index: 50;
      transition: all 0.15s ease;
    }

    .pixel-object:hover {
      background: rgba(255, 215, 0, 0.25);
      border-color: #ffd700;
      border-style: solid;
      transform: scale(1.1);
    }

    .pixel-object:active {
      transform: scale(0.95);
    }

    /* 자식 요소가 클릭 이벤트를 방해하지 않도록 처리 */
    .pixel-object * {
      pointer-events: none;
    }

    .pixel-sprite {
      font-size: 36px;
      line-height: 1;
    }

    .obj-label {
      background: #000;
      color: #fff;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 3px;
      margin-top: 4px;
      border: 1px solid #888;
      white-space: nowrap;
    }

    /* 오브젝트 배치 위치 */
    #boss-npc { top: 40px; left: 250px; }
    #memo-obj { top: 150px; left: 50px; }
    #phone-obj { top: 150px; right: 50px; }
    #door-obj { top: 20px; right: 20px; }

    /* 대사창 영역 */
    #dialogue-box {
      width: 100%;
      height: 160px;
      background: #f8f9fa;
      border-top: 4px solid #2b2b36;
      padding: 12px 16px;
      position: relative;
      color: #111;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    #speaker-name {
      font-size: 13px;
      color: #d32f2f;
      font-weight: bold;
      margin-bottom: 4px;
    }

    #dialogue-text {
      font-size: 14px;
      line-height: 1.4;
      color: #222;
      height: 50px;
      white-space: pre-line;
    }

    #options-container {
      display: flex;
      gap: 8px;
    }

    .opt-btn {
      flex: 1;
      background: #007bff;
      color: #fff;
      border: none;
      padding: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      text-align: center;
    }

    .opt-btn:hover {
      background: #0056b3;
    }

    /* 퀴즈 모달 팝업 */
    #quiz-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
    }

    .quiz-card {
      background: #ffffff;
      border: 3px solid #333;
      border-radius: 8px;
      width: 100%;
      max-width: 480px;
      padding: 18px;
      color: #111;
    }

    .quiz-title {
      font-size: 15px;
      color: #1976d2;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .quiz-q {
      font-size: 14px;
      margin-bottom: 12px;
      line-height: 1.4;
      color: #333;
    }

    .quiz-choice {
      background: #f1f3f5;
      border: 1.5px solid #ced4da;
      padding: 10px;
      margin-bottom: 6px;
      cursor: pointer;
      font-size: 13px;
      border-radius: 4px;
      color: #212529;
      transition: all 0.1s;
    }

    .quiz-choice:hover {
      background: #e7f5ff;
      border-color: #1c7ed6;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- 실시간 동작 확인용 로그 바 -->
    <div id="status-bar">▶ [SYSTEM LOG] 게임 준비 완료. 각 오브젝트를 클릭하세요.</div>

    <div id="screen">
      <div id="room-badge">📍 1관: 영업부 사무실</div>

      <!-- 클릭 가능 대상 (점선 상자로 강조) -->
      <div class="pixel-object" id="boss-npc">
        <div class="pixel-sprite">👨‍💼</div>
        <div class="obj-label">김부장님</div>
      </div>

      <div class="pixel-object" id="memo-obj">
        <div class="pixel-sprite">📝</div>
        <div class="obj-label">책상 메모 [퀴즈1]</div>
      </div>

      <div class="pixel-object" id="phone-obj">
        <div class="pixel-sprite">☎️</div>
        <div class="obj-label">사무실 전화 [퀴즈2]</div>
      </div>

      <div class="pixel-object" id="door-obj" style="opacity: 0.5;">
        <div class="pixel-sprite">🚪</div>
        <div class="obj-label" id="door-label">🔒 다음 사무실</div>
      </div>
    </div>

    <!-- 대사창 영역 -->
    <div id="dialogue-box">
      <div>
        <div id="speaker-name">신입사원 (나)</div>
        <div id="dialogue-text">오늘도 무사히 칼퇴할 수 있을까...? 책상 메모와 전화기를 클릭해 보자.</div>
      </div>
      <div id="options-container"></div>
    </div>

    <!-- 퀴즈 팝업 창 -->
    <div id="quiz-modal">
      <div class="quiz-card">
        <div class="quiz-title" id="qz-title">📋 사무실 퀴즈</div>
        <div class="quiz-q" id="qz-question">질문 내용</div>
        <div id="qz-choices"></div>
      </div>
    </div>
  </div>

  <script>
    // 페이지 로드 상태 관리
    let currentRoom = 1;
    let room1Solved = { memo: false, phone: false };
    let room2Solved = { memo: false, phone: false };

    const quizzes = {
      r1_memo: {
        title: "📝 책상 위 이메일 양식 퀴즈",
        question: "김부장님이 올바른 이메일 제목 양식을 물어보셨다. 가장 바른 제목은?",
        choices: [
          "안녕하세요 부장님 메일 드립니다",
          "[ABC상사] 2026년 3분기 프로젝트 정기보고서 제출건",
          "급함!!! 확인 부탁드립니다!!",
          "제출합니다."
        ],
        answer: 1,
        successMsg: "정답이다! 비즈니스 이메일 작성법을 완벽히 해결했다."
      },
      r1_phone: {
        title: "☎️ 외부 전화 응대 퀴즈",
        question: "부장님이 부재중일 때 외부 거래처 전화를 받았다. 가장 적절한 응대는?",
        choices: [
          "부장님 지금 담배 피우러 나가셨는데요?",
          "지금 자리에 안 계셔서 나중에 다시 걸어주세요.",
          "현재 잠시 자리를 비우셨습니다. 메모나 연락처를 남겨드릴까요?",
          "모르겠습니다. 다른 분한테 전화해보세요."
        ],
        answer: 2,
        successMsg: "깔끔한 전화 응대! 부장님의 신뢰도가 상승했다."
      },
      r2_memo: {
        title: "📊 보고서 결재 퀴즈",
        question: "임원실 보고서 작성 중이다. 상사 보고 시 '두괄식 작성'의 올바른 의미는?",
        choices: [
          "결론과 핵심 요약을 맨 앞에 먼저 작성한다.",
          "보고서 배경과 과정을 10페이지 이상 길게 작성한다.",
          "결론은 맨 마지막장에만 적는다.",
          "구두로만 대충 설명한다."
        ],
        answer: 0,
        successMsg: "완벽하다! 이사님이 만족스러운 표정으로 결재 도장을 찍으셨다."
      },
      r2_phone: {
        title: "🔐 퇴근 보안 점검 퀴즈",
        question: "사무실 퇴근 전 확인해야 할 '보안 가이드' 중 틀린 것은?",
        choices: [
          "중요 서류는 캐비닛에 넣고 잠근다.",
          "PC 화면을 잠그거나 전원을 끈다.",
          "마지막 퇴근자는 창문과 문을 잠근다.",
          "퇴근 전 메인 서버 전원 코드를 뽑아둔다."
        ],
        answer: 3,
        successMsg: "보안 점검 완료! 이제 야근 없이 무사히 출입문이 열린다!"
      }
    };

    // 상태 로그 출력 전용 함수
    function logStatus(msg) {
      const statusBar = document.getElementById('status-bar');
      if (statusBar) {
        statusBar.innerText = "▶ " + msg;
      }
    }

    // 대사 변경 함수
    function setDialogue(speaker, text, options = []) {
      document.getElementById('speaker-name').innerText = speaker;
      document.getElementById('dialogue-text').innerText = text;
      
      const optContainer = document.getElementById('options-container');
      optContainer.innerHTML = '';
      
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt.label;
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          opt.action();
        });
        optContainer.appendChild(btn);
      });
    }

    function checkDoorStatus() {
      const door = document.getElementById('door-obj');
      const doorLabel = document.getElementById('door-label');
      
      let isUnlocked = false;
      if (currentRoom === 1 && room1Solved.memo && room1Solved.phone) isUnlocked = true;
      if (currentRoom === 2 && room2Solved.memo && room2Solved.phone) isUnlocked = true;

      if (isUnlocked) {
        door.style.opacity = '1';
        doorLabel.innerText = currentRoom === 1 ? "🚪 2관 이동 가능!" : "🚪 퇴근문 열림!";
        doorLabel.style.background = '#28a745';
      }
    }

    // 퀴즈 창 열기
    function openQuiz(quizKey) {
      const qData = quizzes[quizKey];
      document.getElementById('qz-title').innerText = qData.title;
      document.getElementById('qz-question').innerText = qData.question;
      
      const choicesDiv = document.getElementById('qz-choices');
      choicesDiv.innerHTML = '';

      qData.choices.forEach((choice, idx) => {
        const div = document.createElement('div');
        div.className = 'quiz-choice';
        div.innerText = `${idx + 1}. ${choice}`;
        div.addEventListener('click', (e) => {
          e.stopPropagation();
          submitAnswer(quizKey, idx);
        });
        choicesDiv.appendChild(div);
      });

      document.getElementById('quiz-modal').style.display = 'flex';
    }

    // 퀴즈 정답 확인
    function submitAnswer(quizKey, chosenIdx) {
      const qData = quizzes[quizKey];
      document.getElementById('quiz-modal').style.display = 'none';

      if (chosenIdx === qData.answer) {
        logStatus("정답입니다! 퀴즈를 해결했습니다.");
        setDialogue("정답 성공!", qData.successMsg);

        if (quizKey === 'r1_memo') room1Solved.memo = true;
        if (quizKey === 'r1_phone') room1Solved.phone = true;
        if (quizKey === 'r2_memo') room2Solved.memo = true;
        if (quizKey === 'r2_phone') room2Solved.phone = true;

        checkDoorStatus();
      } else {
        logStatus("오답입니다. 다시 시도해 보세요.");
        setDialogue("오답!", "틀렸다... 부장님의 따가운 시선이 느껴진다. 다시 시도해보자.", [
          { label: "다시 도전하기", action: () => openQuiz(quizKey) }
        ]);
      }
    }

    // 방 이동
    function triggerRoomChange(toRoom) {
      currentRoom = toRoom;
      const screen = document.getElementById('screen');
      const badge = document.getElementById('room-badge');
      
      if (toRoom === 2) {
        screen.classList.add('office-bg-2');
        badge.innerText = "📍 2관: 임원실 (최종관문)";
        document.getElementById('boss-npc').querySelector('.obj-label').innerText = "박이사님";
        document.getElementById('boss-npc').querySelector('.pixel-sprite').innerText = "👨‍🦳";
        document.getElementById('door-label').innerText = "🔒 최종 퇴근문";
        document.getElementById('door-obj').style.opacity = "0.5";
        
        logStatus("2관 [임원실]로 이동했습니다.");
        setDialogue("시스템", "2관 [임원실]에 진입했다! 박이사님의 서류와 전화기를 조사하라.");
      }
    }

    // 엔딩
    function showEnding() {
      const screen = document.getElementById('screen');
      screen.innerHTML = `
        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:#ffd700; text-align:center;">
          <div style="font-size:60px; margin-bottom:10px;">🎉</div>
          <h2 style="font-size:22px;">칼퇴 성공! 탈출 완료!</h2>
          <p style="color:#fff; font-size:14px; margin-top:10px;">당신은 무사히 야근을 피하고 칼퇴근에 성공했습니다!</p>
        </div>
      `;
      logStatus("🎉 축하합니다! 모든 미션을 완료했습니다.");
      setDialogue("엔딩", "축하합니다! 포켓몬 스타일 픽셀 방탈출을 모두 클리어하셨습니다!", [
        { label: "처음부터 다시하기", action: () => location.reload() }
      ]);
    }

    // 자바스크립트 표준 이벤트 바인딩 (CSP 보안 정책 완전 준수)
    function initGame() {
      logStatus("이벤트 바인딩 완료. 오브젝트를 클릭해 보세요.");

      // 김부장님 클릭
      document.getElementById('boss-npc').addEventListener('click', function(e) {
        e.stopPropagation();
        logStatus("[클릭] 김부장님을 클릭했습니다.");
        if (currentRoom === 1) {
          setDialogue("김부장님", "어이 신입~ 오늘 칼퇴하고 싶나?\n책상의 이메일 메모랑 전화 응대 퀴즈부터 완료하게나!");
        } else {
          setDialogue("박이사님", "오~ 여기까지 왔군! 결재 서류와 퇴근 보안 점검을 마치면 보내주지!");
        }
      });

      // 책상 메모 클릭
      document.getElementById('memo-obj').addEventListener('click', function(e) {
        e.stopPropagation();
        logStatus("[클릭] 책상 메모를 클릭했습니다.");
        const key = currentRoom === 1 ? 'r1_memo' : 'r2_memo';
        const isSolved = currentRoom === 1 ? room1Solved.memo : room2Solved.memo;

        if (isSolved) {
          setDialogue("신입사원 (나)", "이 퀴즈는 이미 풀어냈다!");
          return;
        }
        openQuiz(key);
      });

      // 전화기 클릭
      document.getElementById('phone-obj').addEventListener('click', function(e) {
        e.stopPropagation();
        logStatus("[클릭] 전화기를 클릭했습니다.");
        const key = currentRoom === 1 ? 'r1_phone' : 'r2_phone';
        const isSolved = currentRoom === 1 ? room1Solved.phone : room2Solved.phone;

        if (isSolved) {
          setDialogue("신입사원 (나)", "전화기 관련 문제는 해결 완료했다!");
          return;
        }
        openQuiz(key);
      });

      // 문 클릭
      document.getElementById('door-obj').addEventListener('click', function(e) {
        e.stopPropagation();
        logStatus("[클릭] 출입문을 클릭했습니다.");
        if (currentRoom === 1) {
          if (room1Solved.memo && room1Solved.phone) {
            triggerRoomChange(2);
          } else {
            setDialogue("경고", "사무실의 2가지 문제(메모, 전화기)를 모두 풀어야 다음 방으로 갈 수 있습니다!");
          }
        } else {
          if (room2Solved.memo && room2Solved.phone) {
            showEnding();
          } else {
            setDialogue("경고", "모든 보안 및 결재 퀴즈를 마쳐야 정문 열쇠를 얻을 수 있습니다!");
          }
        }
      });
    }

    // DOM 준비 완료 시 실행
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initGame);
    } else {
      initGame();
    }
  </script>
</body>
</html>
