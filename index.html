    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Galmuri9', monospace;
    }

    body {
      background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #fff;
    }

    /* 게임 메인 프레임 (레트로 아케이드 게임기 스타일) */
    #game-container {
      width: 700px;
      height: 640px;
      background-color: #0f172a;
      border: 5px solid #38bdf8;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.4), inset 0 0 15px rgba(0,0,0,0.8);
    }

    /* 상단 내비게이션 및 정보바 */
    #top-nav {
      height: 54px;
      background: #1e293b;
      border-bottom: 4px solid #38bdf8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 14px;
      z-index: 100;
    }

    #room-title {
      font-size: 13px;
      font-weight: bold;
      color: #38bdf8;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
    }

    #user-stats {
      font-size: 12px;
      font-weight: bold;
      color: #facc15;
      background: #020617;
      padding: 5px 10px;
      border: 2px solid #facc15;
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(250, 204, 21, 0.3);
    }

    .nav-btn-group {
      display: flex;
      gap: 5px;
    }

    .nav-btn {
      background: #0f172a;
      color: #fff;
      border: 2px solid #38bdf8;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s ease;
    }

    .nav-btn:hover {
      background: #38bdf8;
      color: #0f172a;
      box-shadow: 0 0 10px #38bdf8;
    }

    .nav-btn:active {
      transform: scale(0.95);
    }

    /* 메인 픽셀 화면 */
    #screen {
      width: 100%;
      height: 410px;
      position: relative;
      background-color: #020617;
      overflow: hidden;
    }

    .pixel-render {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #bg-svg {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
    }

    /* 인터랙티브 픽셀 오브젝트 */
    .pixel-object {
      position: absolute;
      cursor: pointer;
      z-index: 50;
      transition: transform 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pixel-object:hover {
      transform: scale(1.12);
      filter: drop-shadow(0px 0px 8px #facc15);
    }

    .pixel-object:active {
      transform: scale(0.95);
    }

    .pixel-object * {
      pointer-events: none;
    }

    .obj-tag {
      background: rgba(15, 23, 42, 0.9);
      color: #f8fafc;
      font-size: 10px;
      padding: 3px 7px;
      border-radius: 4px;
      border: 1px solid #38bdf8;
      margin-top: 3px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }

    #boss-npc { top: 180px; left: 360px; }
    #player-npc { top: 180px; left: 210px; }
    #memo-obj { top: 145px; left: 105px; }
    #phone-obj { top: 145px; right: 105px; }
    #door-obj { top: 20px; right: 25px; }

    /* 하단 대사창 */
    #dialogue-box {
      width: 100%;
      height: 176px;
      background: #090d16;
      border-top: 4px solid #38bdf8;
      padding: 16px 20px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      z-index: 100;
    }

    #dialogue-text {
      font-size: 14px;
      line-height: 1.6;
      color: #f1f5f9;
      white-space: pre-line;
      font-weight: bold;
    }

    #next-arrow {
      position: absolute;
      bottom: 14px;
      right: 18px;
      width: 0; height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 10px solid #facc15;
      animation: bounce 0.8s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(6px); }
    }

    /* 모달 팝업 디자인 (주관식 입력 모달) */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 6, 23, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-card {
      background: #0f172a;
      border: 3px solid #38bdf8;
      border-radius: 10px;
      width: 100%;
      max-width: 520px;
      padding: 24px;
      color: #fff;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
    }

    .quiz-title {
      font-size: 15px;
      color: #38bdf8;
      margin-bottom: 12px;
      font-weight: bold;
    }

    .quiz-q {
      font-size: 14px;
      margin-bottom: 10px;
      line-height: 1.5;
      color: #f8fafc;
      font-weight: bold;
    }

    .quiz-hint {
      display: inline-block;
      background: #1e293b;
      color: #facc15;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #facc15;
      margin-bottom: 16px;
    }

    .quiz-input-group {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .quiz-input {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      background: #020617;
      border: 2px solid #38bdf8;
      border-radius: 6px;
      color: #fff;
      outline: none;
      font-weight: bold;
    }

    .quiz-input:focus {
      border-color: #facc15;
      box-shadow: 0 0 10px rgba(250, 204, 21, 0.4);
    }

    .quiz-submit-btn {
      background: #2563eb;
      color: #fff;
      border: 2px solid #60a5fa;
      padding: 0 18px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.15s ease;
    }

    .quiz-submit-btn:hover {
      background: #1d4ed8;
      box-shadow: 0 0 12px #2563eb;
    }

    /* 닉네임 입력 폼 */
    .start-input {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      background: #020617;
      border: 2px solid #38bdf8;
      border-radius: 6px;
      color: #fff;
      margin: 16px 0;
      font-weight: bold;
    }

      width: 100%;
      background: #2563eb;
      color: #fff;
      border: 2px solid #60a5fa;

      font-size: 15px;

      padding: 8px;
      text-align: center;
    }

    .leaderboard-table th {

      color: #38bdf8;
    }

      background: #020617;

    /* ==========================================
       IP 주소 기반 실시간 자동저장 & 로드 시스템
    ========================================== */
    async function fetchUserIp() {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2000);
        const res = await fetch('https://api.ipify.org?format=json', { signal: controller.signal });
        clearTimeout(timeoutId);
        const data = await res.json();
        if (data && data.ip) {
          userIp = data.ip.replace(/[^a-zA-Z0-9]/g, "_");
        }
      } catch (e) {
        userIp = "local_browser_session";
      }
    }

    function saveGameState() {
      const state = {
        userIp,
        playerNickname,
        currentRoom,
        totalScore,
        gameStartTime,
        roomSolved,
        lastUpdated: Date.now()
      };
      localStorage.setItem('s1fa_state_' + userIp, JSON.stringify(state));
      localStorage.setItem('s1fa_latest_session', JSON.stringify(state));
    }

    function loadGameState() {
      let saved = localStorage.getItem('s1fa_state_' + userIp);
      if (!saved) {
        saved = localStorage.getItem('s1fa_latest_session');
      }
      if (saved) {
        try {
          return JSON.parse(saved);
        } catch (e) {
          return null;
        }
      }
      return null;
    }

    function resetGameProgress() {
      if (confirm("정말로 모든 진행 상황을 초기화하고 첫 화면부터 다시 시작하시겠습니까?")) {
        localStorage.removeItem('s1fa_state_' + userIp);
        localStorage.removeItem('s1fa_latest_session');
        location.reload();
      }
    }

    /* ==========================================
       게임 시작 및 복구 제어
    ========================================== */
    function startGame() {
      const input = document.getElementById('nickname-input').value.trim();
      if (!input) {
        alert("참여자 닉네임이나 사번을 입력해 주세요!");
        return;
      }
      playerNickname = input;
      gameStartTime = Date.now();

      document.getElementById('player-tag').innerText = playerNickname;
      document.getElementById('start-modal').style.display = 'none';

      saveGameState();
      updateScoreUI();
      renderRoomBackground(1);
      setDialogue(roomData[1].welcomeMsg);
    }

    function restoreGame(savedState) {
      playerNickname = savedState.playerNickname || "신입사원";
      currentRoom = savedState.currentRoom || 1;
      totalScore = savedState.totalScore || 0;
      gameStartTime = savedState.gameStartTime || Date.now();
      roomSolved = savedState.roomSolved || roomSolved;

      document.getElementById('player-tag').innerText = playerNickname;
      document.getElementById('start-modal').style.display = 'none';

      updateScoreUI();
      triggerRoomChange(currentRoom);
      setDialogue(`[진행 상황 복구 완료]\n${playerNickname} 님, 이전 접속 위치(${currentRoom}관)에서 게임을 이어서 진행합니다!`);
    }

    /* ==========================================
       점수 계산 및 UI 실시간 렌더링
    ========================================== */
    function calculateQuizScore(timeTakenMs) {
      const timeInSec = timeTakenMs / 1000;
      let score = Math.max(200, Math.round(10000 - (timeInSec * 145)));
      return score;
    }

      document.getElementById('user-stats').innerText = `점수: ${totalScore.toLocaleString()}점 | ${playerNickname}`;

    function setDialogue(text) {
      document.getElementById('dialogue-text').innerText = text;

    function checkDoorStatus() {
      const door = document.getElementById('door-obj');
      const doorLabel = document.getElementById('door-label');
      
      const currentSolved = roomSolved[currentRoom];
      if (currentSolved.memo && currentSolved.phone) {
        door.style.opacity = '1';
        doorLabel.innerText = currentRoom === 4 ? "🚪 최종 탈출!" : `🚪 ${currentRoom + 1}관 이동!`;
        doorLabel.style.background = '#22c55e';
      }
    }

    /* ==========================================
       주관식 퀴즈 제어 및 정답 판정
    ========================================== */
    function openQuiz(quizKey) {
      activeQuizKey = quizKey;
      quizStartTime = Date.now();

      const qData = quizzes[quizKey];
      document.getElementById('qz-title').innerText = qData.title;
      document.getElementById('qz-question').innerText = qData.question;
      document.getElementById('qz-hint').innerText = qData.hint;
      
      const input = document.getElementById('qz-input');
      input.value = '';
      
      document.getElementById('quiz-modal').style.display = 'flex';
      setTimeout(() => input.focus(), 100);
    }

    function submitAnswer() {
      if (!activeQuizKey) return;

      const qData = quizzes[activeQuizKey];
      const input = document.getElementById('qz-input');
      const userAns = input.value.trim().toLowerCase().replace(/\s+/g, '');

      if (!userAns) {
        alert("정답을 입력해 주세요!");
        return;
      }

      // 정답 매칭 알고리즘 (공백 및 대소문자 무시)
      const isCorrect = qData.answers.some(ans => ans.toLowerCase().replace(/\s+/g, '') === userAns);

      if (isCorrect) {
        const timeTakenMs = Date.now() - quizStartTime;
        const earnedScore = calculateQuizScore(timeTakenMs);
        totalScore += earnedScore;
        updateScoreUI();

        document.getElementById('quiz-modal').style.display = 'none';
        setDialogue(`${qData.successMsg}\n(+${earnedScore.toLocaleString()}점 획득! 현재 총점: ${totalScore.toLocaleString()}점)`);

        if (activeQuizKey.includes('memo')) roomSolved[currentRoom].memo = true;
        if (activeQuizKey.includes('phone')) roomSolved[currentRoom].phone = true;

        saveGameState();
        checkDoorStatus();
      } else {
        const penalty = 500;
        totalScore = Math.max(0, totalScore - penalty);
        updateScoreUI();
        saveGameState();
        alert(`❌ 오답입니다! 500점이 감점되었습니다. (현재 점수: ${totalScore.toLocaleString()}점)\n다시 입력해 보세요!`);
        input.value = '';
        input.focus();
      }
    }

    function nextRoom() {
      const currentSolved = roomSolved[currentRoom];
      if (!currentSolved.memo || !currentSolved.phone) {
        alert("현재 관의 메모와 전화기 주관식 퀴즈 2개를 모두 해결해야 다음 방으로 넘어갈 수 있습니다!");
        return;
      }

      if (currentRoom < 4) {
        triggerRoomChange(currentRoom + 1);
      } else {
        showEnding();
      }
    }

    function prevRoom() {
      if (currentRoom > 1) {
        triggerRoomChange(currentRoom - 1);
      }
    }

    function triggerRoomChange(toRoom) {
      currentRoom = toRoom;
      document.getElementById('room-title').innerText = roomData[toRoom].title;
      renderRoomBackground(toRoom);
      checkDoorStatus();
      setDialogue(roomData[toRoom].welcomeMsg);
      saveGameState();
    }

    function showEnding() {
      const totalTimeSec = Math.round((Date.now() - gameStartTime) / 1000);
      const minutes = Math.floor(totalTimeSec / 60);
      const seconds = totalTimeSec % 60;
      const timeStr = `${minutes}분 ${seconds}초`;

      document.getElementById('final-summary').innerHTML = `
        참여자: <b>${playerNickname}</b> 님<br>
        최종 점수: <span style="color:#facc15; font-size:18px;">${totalScore.toLocaleString()}점</span><br>
        총 소요시간: <b>${timeStr}</b>
      `;

      saveScoreRecord(playerNickname, totalScore, timeStr);
      renderLeaderboard();
      document.getElementById('ending-modal').style.display = 'flex';
    }

    function saveScoreRecord(name, score, timeStr) {
      let records = JSON.parse(localStorage.getItem('s1fa_leaderboard') || '[]');
      records.push({ name, score, timeStr, timestamp: Date.now() });
      records.sort((a, b) => b.score - a.score);
      localStorage.setItem('s1fa_leaderboard', JSON.stringify(records));
    }

    function renderLeaderboard() {
      let records = JSON.parse(localStorage.getItem('s1fa_leaderboard') || '[]');
      const tbody = document.getElementById('leaderboard-body');
      tbody.innerHTML = '';

      records.forEach((rec, idx) => {
        const tr = document.createElement('tr');
        if (rec.name === playerNickname && rec.score === totalScore) {
          tr.style.background = '#1e3a8a';
        }
        tr.innerHTML = `
          <td><b>${idx + 1}위</b></td>
          <td>${rec.name}</td>
          <td><b style="color:#facc15;">${rec.score.toLocaleString()}</b></td>
          <td>${rec.timeStr}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    /* ==========================================
       초기화 및 자동 로드 실행
    ========================================== */
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. IP 주소 가져오기
      await fetchUserIp();

      // 2. 버튼 및 키보드 이벤트 바인딩
      const startBtn = document.getElementById('start-btn');
      const nicknameInput = document.getElementById('nickname-input');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      const resetBtn = document.getElementById('reset-btn');
      const restartBtn = document.getElementById('restart-btn');
      const qzSubmitBtn = document.getElementById('qz-submit-btn');
      const qzInput = document.getElementById('qz-input');

      if (startBtn) startBtn.addEventListener('click', startGame);
      if (nicknameInput) {
        nicknameInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') startGame();
        });
      }
      if (prevBtn) prevBtn.addEventListener('click', prevRoom);
      if (nextBtn) nextBtn.addEventListener('click', nextRoom);
      if (resetBtn) resetBtn.addEventListener('click', resetGameProgress);
      if (restartBtn) {
        restartBtn.addEventListener('click', () => {
          localStorage.removeItem('s1fa_state_' + userIp);
          localStorage.removeItem('s1fa_latest_session');
          location.reload();
        });
      }
      if (qzSubmitBtn) qzSubmitBtn.addEventListener('click', submitAnswer);
      if (qzInput) {
        qzInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') submitAnswer();
        });
      }

      // 3. 오브젝트 클릭 이벤트
      document.getElementById('boss-npc').addEventListener('click', () => {
        setDialogue(roomData[currentRoom].welcomeMsg);
      });

      document.getElementById('memo-obj').addEventListener('click', () => {
        const key = `r${currentRoom}_memo`;
        if (roomSolved[currentRoom].memo) {
          setDialogue("신입사원: 이 메모 퀴즈는 이미 완료했습니다!");
          return;
        }
        openQuiz(key);
      });

      document.getElementById('phone-obj').addEventListener('click', () => {
        const key = `r${currentRoom}_phone`;
        if (roomSolved[currentRoom].phone) {
          setDialogue("신입사원: 이 전화기 퀴즈는 이미 완료했습니다!");
          return;
        }
        openQuiz(key);
      });

      document.getElementById('door-obj').addEventListener('click', () => {
        nextRoom();
      });

      // 4. IP 세션에 따른 자동 진행상황 복구 체크
      const savedState = loadGameState();
      if (savedState && savedState.playerNickname) {
        restoreGame(savedState);
      }
    });
  </script>
</body>
</html>
