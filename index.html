    .pixel-object:active {

    }

      color: #fff;

    /* ==========================================
       IP 주소 기반 실시간 자동저장 & 로드 시스템
    ========================================== */
    async function fetchUserIp() {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2000);
        const res = await fetch('https://api.ipify.org?format=json', { signal: controller.signal });
        clearTimeout(timeoutId);
        const data = await res.json();
        if (data && data.ip) {
          userIp = data.ip.replace(/[^a-zA-Z0-9]/g, "_");
        }
      } catch (e) {
        userIp = "local_browser_session";
      }
    }

    function saveGameState() {
      const state = {
        userIp,
        playerNickname,
        currentRoom,
        totalScore,
        gameStartTime,
        roomSolved,
        lastUpdated: Date.now()
      };
      localStorage.setItem('s1fa_state_' + userIp, JSON.stringify(state));
      localStorage.setItem('s1fa_latest_session', JSON.stringify(state));
    }

    function loadGameState() {
      let saved = localStorage.getItem('s1fa_state_' + userIp);
      if (!saved) {
        saved = localStorage.getItem('s1fa_latest_session');
      }
      if (saved) {
        try {
          return JSON.parse(saved);
        } catch (e) {
          return null;
        }
      }
      return null;
    }

    /* ==========================================
       게임 시작 및 복구 제어
    ========================================== */
    function startGame() {
      const input = document.getElementById('nickname-input').value.trim();
      if (!input) {
        alert("참여자 닉네임이나 사번을 입력해 주세요!");
        return;
      }
      playerNickname = input;
      gameStartTime = Date.now();

      document.getElementById('player-tag').innerText = playerNickname;
      document.getElementById('start-modal').style.display = 'none';

      saveGameState();
      updateScoreUI();
      renderRoomBackground(1);
      setDialogue(roomData[1].welcomeMsg);
    }

    function restoreGame(savedState) {
      playerNickname = savedState.playerNickname || "신입사원";
      currentRoom = savedState.currentRoom || 1;
      totalScore = savedState.totalScore || 0;
      gameStartTime = savedState.gameStartTime || Date.now();
      roomSolved = savedState.roomSolved || roomSolved;

      document.getElementById('player-tag').innerText = playerNickname;
      document.getElementById('start-modal').style.display = 'none';

      updateScoreUI();
      triggerRoomChange(currentRoom);
      setDialogue(`[진행 상황 복구 완료]\n${playerNickname} 님, 이전 접속 위치(${currentRoom}관)에서 게임을 이어서 진행합니다!`);
    }

    /* ==========================================
       점수 계산 및 UI 실시간 렌더링
    ========================================== */
    function calculateQuizScore(timeTakenMs, wrongCount) {
      const timeInSec = timeTakenMs / 1000;
      let score = Math.max(100, Math.round(10000 - (timeInSec * 145)));
      return score;
    }

    function updateScoreUI() {
      document.getElementById('user-stats').innerText = `점수: ${totalScore.toLocaleString()}점 | ${playerNickname}`;
    }

    function setDialogue(text) {
      document.getElementById('dialogue-text').innerText = text;
    }

    function checkDoorStatus() {
      const door = document.getElementById('door-obj');
      const doorLabel = document.getElementById('door-label');
      
      const currentSolved = roomSolved[currentRoom];
      if (currentSolved.memo && currentSolved.phone) {
        door.style.opacity = '1';
        doorLabel.innerText = currentRoom === 4 ? "🚪 최종 탈출!" : `🚪 ${currentRoom + 1}관 이동!`;
        doorLabel.style.background = '#22c55e';
      }
    }

    function openQuiz(quizKey) {
      wrongAttempts = 0;
      quizStartTime = Date.now();

      const qData = quizzes[quizKey];
      document.getElementById('qz-title').innerText = qData.title;
      document.getElementById('qz-question').innerText = qData.question;
      
      const choicesDiv = document.getElementById('qz-choices');
      choicesDiv.innerHTML = '';

      qData.choices.forEach((choice, idx) => {
        const div = document.createElement('div');
        div.className = 'quiz-choice';
        div.innerText = `${idx + 1}. ${choice}`;
        div.addEventListener('click', (e) => {
          e.stopPropagation();
          submitAnswer(quizKey, idx);
        });
        choicesDiv.appendChild(div);
      });

      document.getElementById('quiz-modal').style.display = 'flex';
    }

    function submitAnswer(quizKey, chosenIdx) {
      const qData = quizzes[quizKey];

      if (chosenIdx === qData.answer) {
        const timeTakenMs = Date.now() - quizStartTime;
        const earnedScore = calculateQuizScore(timeTakenMs, wrongAttempts);
        totalScore += earnedScore;
        updateScoreUI();

        document.getElementById('quiz-modal').style.display = 'none';
        setDialogue(`${qData.successMsg}\n(+${earnedScore.toLocaleString()}점 획득! 현재 총점: ${totalScore.toLocaleString()}점)`);

        if (quizKey.includes('memo')) roomSolved[currentRoom].memo = true;
        if (quizKey.includes('phone')) roomSolved[currentRoom].phone = true;

        saveGameState();
        checkDoorStatus();
      } else {
        wrongAttempts++;
        const penalty = 500;
        totalScore = Math.max(0, totalScore - penalty);
        updateScoreUI();
        saveGameState();
        alert(`❌ 오답입니다! 500점이 즉시 감점되었습니다. (현재 점수: ${totalScore.toLocaleString()}점) 다시 선택하세요.`);
      }
    }

    function nextRoom() {
      const currentSolved = roomSolved[currentRoom];
      if (!currentSolved.memo || !currentSolved.phone) {
        alert("현재 관의 메모와 전화기 퀴즈 2개를 모두 해결해야 다음 방으로 넘어갈 수 있습니다!");
        return;
      }

      if (currentRoom < 4) {
        triggerRoomChange(currentRoom + 1);
      } else {
        showEnding();
      }
    }

    function prevRoom() {
      if (currentRoom > 1) {
        triggerRoomChange(currentRoom - 1);
      }
    }

    function triggerRoomChange(toRoom) {
      currentRoom = toRoom;
      document.getElementById('room-title').innerText = roomData[toRoom].title;
      renderRoomBackground(toRoom);
      checkDoorStatus();
      setDialogue(roomData[toRoom].welcomeMsg);
      saveGameState();
    }

    function showEnding() {
      const totalTimeSec = Math.round((Date.now() - gameStartTime) / 1000);
      const minutes = Math.floor(totalTimeSec / 60);
      const seconds = totalTimeSec % 60;
      const timeStr = `${minutes}분 ${seconds}초`;

      document.getElementById('final-summary').innerHTML = `
        참여자: <b>${playerNickname}</b> 님<br>
        최종 점수: <span style="color:#dc2626; font-size:18px;">${totalScore.toLocaleString()}점</span><br>
        총 소요시간: <b>${timeStr}</b>
      `;

      saveScoreRecord(playerNickname, totalScore, timeStr);
      renderLeaderboard();
      document.getElementById('ending-modal').style.display = 'flex';
    }

    function saveScoreRecord(name, score, timeStr) {
      let records = JSON.parse(localStorage.getItem('s1fa_leaderboard') || '[]');
      records.push({ name, score, timeStr, timestamp: Date.now() });
      records.sort((a, b) => b.score - a.score);
      localStorage.setItem('s1fa_leaderboard', JSON.stringify(records));
    }

    function renderLeaderboard() {
      let records = JSON.parse(localStorage.getItem('s1fa_leaderboard') || '[]');
      const tbody = document.getElementById('leaderboard-body');
      tbody.innerHTML = '';

      records.forEach((rec, idx) => {
        const tr = document.createElement('tr');
        if (rec.name === playerNickname && rec.score === totalScore) {
          tr.style.background = '#fef08a';
        }
        tr.innerHTML = `
          <td><b>${idx + 1}위</b></td>
          <td>${rec.name}</td>
          <td><b>${rec.score.toLocaleString()}</b></td>
          <td>${rec.timeStr}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    /* ==========================================
       초기화 및 자동 로드 실행
    ========================================== */
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. IP 주소 가져오기
      await fetchUserIp();

      // 2. 버튼 이벤트 바인딩
      const startBtn = document.getElementById('start-btn');
      const nicknameInput = document.getElementById('nickname-input');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      const restartBtn = document.getElementById('restart-btn');

      if (startBtn) startBtn.addEventListener('click', startGame);
      if (nicknameInput) {
        nicknameInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') startGame();
        });
      }
      if (prevBtn) prevBtn.addEventListener('click', prevRoom);
      if (nextBtn) nextBtn.addEventListener('click', nextRoom);
      if (restartBtn) {
        restartBtn.addEventListener('click', () => {
          localStorage.removeItem('s1fa_state_' + userIp);
          localStorage.removeItem('s1fa_latest_session');
          location.reload();
        });
      }

      // 3. 오브젝트 클릭 이벤트
      document.getElementById('boss-npc').addEventListener('click', () => {
        setDialogue(roomData[currentRoom].welcomeMsg);
      });

      document.getElementById('memo-obj').addEventListener('click', () => {
        const key = `r${currentRoom}_memo`;
        if (roomSolved[currentRoom].memo) {
          setDialogue("신입사원: 이 메모 퀴즈는 이미 완료했습니다!");
          return;
        }
        openQuiz(key);
      });

      document.getElementById('phone-obj').addEventListener('click', () => {
        const key = `r${currentRoom}_phone`;
        if (roomSolved[currentRoom].phone) {
          setDialogue("신입사원: 이 전화기 퀴즈는 이미 완료했습니다!");
          return;
        }
        openQuiz(key);
      });

      document.getElementById('door-obj').addEventListener('click', () => {
        nextRoom();
      });

      // 4. IP 세션에 따른 자동 진행상황 복구 체크
      const savedState = loadGameState();
      if (savedState && savedState.playerNickname) {
        restoreGame(savedState);
      }
    });
  </script>
</body>
</html>
