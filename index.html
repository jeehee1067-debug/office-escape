  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Galmuri9', monospace;
    }

    body {
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #000;
    }

    /* 게임 메인 프레임 */
    #game-container {
      width: 680px;
      height: 620px;
      background-color: #e2e8f0;
      border: 6px solid #1e293b;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 50px rgba(0,0,0,0.8);
    }

    /* 상단 내비게이션 및 정보바 */
    #top-nav {
      height: 52px;
      background: #cbd5e1;
      border-bottom: 4px solid #000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
      z-index: 100;
    }

    #room-title {
      font-size: 15px;
      font-weight: bold;
      color: #000;
    }

    #user-stats {
      font-size: 13px;
      font-weight: bold;
      color: #1e3a8a;
      background: #fff;
      padding: 4px 8px;
      border: 2px solid #000;
      border-radius: 4px;
    }

    .nav-btn-group {
      display: flex;
      gap: 6px;
    }

    .nav-btn {
      background: #fff;
      border: 3px solid #000;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 2px 2px 0px #000;
    }

    .nav-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px #000;
    }

    /* 화면 영역 */
    #screen {
      width: 100%;
      height: 400px;
      position: relative;
      background-color: #94a3b8;
      overflow: hidden;
    }

    .pixel-render {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #bg-svg {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
    }

    /* 인터랙티브 픽셀 오브젝트 */
    .pixel-object {
      position: absolute;
      cursor: pointer;
      z-index: 50;
      transition: transform 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pixel-object:hover {
      transform: scale(1.1);
      filter: drop-shadow(0px 0px 6px #ffd700);
    }

    .pixel-object:active {
      transform: scale(0.95);
    }

    .pixel-object * {
      pointer-events: none;
    }

    .obj-tag {
      background: #000;
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid #fff;
      margin-top: 2px;
      white-space: nowrap;
    }

    /* 위치 좌표 */
    #boss-npc { top: 175px; left: 350px; }
    #player-npc { top: 175px; left: 210px; }
    #memo-obj { top: 140px; left: 100px; }
    #phone-obj { top: 140px; right: 100px; }
    #door-obj { top: 15px; right: 20px; }

    /* 하단 대사창 */
    #dialogue-box {
      width: 100%;
      height: 168px;
      background: #ffffff;
      border-top: 5px solid #000;
      padding: 16px 20px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      z-index: 100;
    }

    #dialogue-text {
      font-size: 15px;
      line-height: 1.5;
      color: #000;
      white-space: pre-line;
      font-weight: bold;
    }

    #next-arrow {
      position: absolute;
      bottom: 12px;
      right: 16px;
      width: 0; height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 10px solid #000;
      animation: bounce 0.8s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(5px); }
    }

    /* 모달 팝업 공통 */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-card {
      background: #ffffff;
      border: 4px solid #000;
      border-radius: 6px;
      width: 100%;
      max-width: 500px;
      padding: 22px;
      color: #000;
      box-shadow: 6px 6px 0px rgba(0,0,0,0.5);
    }

    .quiz-title {
      font-size: 16px;
      color: #dc2626;
      margin-bottom: 10px;
      font-weight: bold;
    }

      font-size: 14px;
      margin-bottom: 14px;
      line-height: 1.4;
      font-weight: bold;
    }

    .quiz-choice {
      background: #f1f5f9;
      border: 2px solid #000;
      padding: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      border-radius: 4px;
    }

    .quiz-choice:hover {
      background: #fde047;
    }

    /* 닉네임 입력 폼 */
    .start-input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 3px solid #000;
      border-radius: 4px;
      margin: 15px 0;
      font-weight: bold;

    .start-btn {
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: 3px solid #000;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 3px 3px 0px #000;

    .leaderboard-table {

      border-collapse: collapse;
      margin-top: 10px;
      font-size: 12px;

      border: 1px solid #000;
      padding: 6px;
      text-align: center;
    }

      background: #cbd5e1;
    }
  </style>

      r4_phone: {
        title: "☎️ 4관: 최종 퇴근 보안점검 퀴즈",
        question: "퇴근 전 사무실 보안 점검 사항 중 틀린 것은?",
        choices: [
          "중요 보안 서류는 캐비닛에 넣고 잠근다.",
          "PC 화면을 잠그거나 전원을 끈다.",
          "마지막 퇴근자는 창문과 문을 잠근다.",
          "퇴근 전 메인 서버 전원 코드를 뽑아둔다."
        ],
        answer: 3,
        successMsg: "손승준 PL님: 좋습니다! 모든 보안 통과, 최종 탈출!"
      }
    };

    /* ==========================================
       게임 시작 및 닉네임 처리
    ========================================== */
    function startGame() {
      const input = document.getElementById('nickname-input').value.trim();
      if (!input) {
        alert("참여자 닉네임이나 사번을 입력해 주세요!");
        return;
      }
      playerNickname = input;
      document.getElementById('player-tag').innerText = playerNickname;
      document.getElementById('start-modal').style.display = 'none';
      
      gameStartTime = Date.now();
      updateScoreUI();
      renderRoomBackground(1);
      setDialogue(roomData[1].welcomeMsg);
    }

    /* ==========================================
       정밀 타임어택 점수 산출 로직
    ========================================== */
    function calculateQuizScore(timeTakenMs, wrongCount) {
      const timeInSec = timeTakenMs / 1000;
      // 기본 10,000점에서 초당 차감 + 오답시 800점 차감 (밀리초 단위 계산으로 40명 변별력 100% 보장)
      let score = Math.max(100, Math.round(10000 - (timeInSec * 145) - (wrongCount * 800)));
      return score;
    }

    function updateScoreUI() {
      document.getElementById('user-stats').innerText = `점수: ${totalScore.toLocaleString()}점 | ${playerNickname}`;
    }

    /* ==========================================
       방별 픽셀 오피스 배경 드로잉 (4개관 테마)
    ========================================== */
    function renderRoomBackground(roomNum) {
      const svg = document.getElementById('bg-svg');
      let content = `
        <rect x="0" y="0" width="320" height="130" fill="${roomNum === 4 ? '#1e1b4b' : (roomNum === 3 ? '#312e81' : (roomNum === 2 ? '#064e3b' : '#334155'))}"/>
        <rect x="0" y="130" width="320" height="70" fill="#cbd5e1"/>
        <path d="M 0,130 L 320,130" stroke="#475569" stroke-width="2"/>
        <path d="M 40,130 L 40,200 M 80,130 L 80,200 M 120,130 L 120,200 M 160,130 L 160,200 M 200,130 L 200,200 M 240,130 L 240,200 M 280,130 L 280,200" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
        
        <!-- 삼성 S1FA PJT 화이트보드 -->
        <rect x="80" y="10" width="160" height="60" fill="#ffffff" stroke="#000" stroke-width="3"/>
        <rect x="185" y="15" width="48" height="10" fill="#1d4ed8" rx="2"/>
        <text x="188" y="22" fill="#ffffff" font-size="5" font-weight="bold">SAMSUNG</text>
        <text x="90" y="24" fill="#000" font-size="9" font-weight="bold">S1FA PJT : ${roomNum}관</text>
        <path d="M 90,32 L 230,32 M 90,45 L 210,45" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,2"/>
      `;

      if (roomNum === 1) { // 서버 랙 테마
        content += `
          <rect x="10" y="20" width="55" height="90" fill="#1e293b" stroke="#000" stroke-width="2"/>
          <circle cx="20" cy="30" r="2" fill="#22c55e"/><circle cx="28" cy="30" r="2" fill="#ef4444"/>
          <rect x="20" y="40" width="35" height="10" fill="#334155"/>
          <rect x="20" y="60" width="35" height="10" fill="#334155"/>
        `;
      } else if (roomNum === 2) { // 매트릭스 개발 모니터 테마
        content += `
          <rect x="10" y="20" width="60" height="80" fill="#022c22" stroke="#000" stroke-width="2"/>
          <path d="M 15,30 L 60,30 M 15,45 L 50,45 M 15,60 L 55,60" stroke="#10b981" stroke-width="1.5"/>
        `;
      } else if (roomNum === 3) { // UI/UX 디자인 보드 테마
        content += `
          <rect x="10" y="20" width="55" height="75" fill="#fbcfe8" stroke="#000" stroke-width="2"/>
          <rect x="15" y="25" width="15" height="15" fill="#f43f5e"/>
          <rect x="35" y="25" width="15" height="15" fill="#0ea5e9"/>
          <rect x="15" y="45" width="35" height="15" fill="#eab308"/>
        `;
      } else if (roomNum === 4) { // 손승준 PL실 프레임
        content += `
          <rect x="10" y="15" width="60" height="90" fill="#312e81" stroke="#000" stroke-width="2"/>
          <circle cx="40" cy="40" r="12" fill="#fbbf24" stroke="#000" stroke-width="1.5"/>
          <text x="35" y="44" fill="#000" font-size="10" font-weight="bold">PL</text>
        `;
      }

      // 공통 U자형 책상 & 컴퓨터 3대
      content += `
        <path d="M 70,100 L 250,100 L 250,145 L 225,145 L 225,118 L 95,118 L 95,145 L 70,145 Z" fill="#e2e8f0" stroke="#000" stroke-width="2"/>
        <rect x="85" y="75" width="35" height="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
        <rect x="130" y="70" width="50" height="28" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
        <rect x="190" y="75" width="35" height="22" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
      `;

      svg.innerHTML = content;
      renderBossNPC(roomNum);
    }

    /* ==========================================
       방별 파트장님/PL님 SVG 도트 캐릭터 생성
    ========================================== */
    function renderBossNPC(roomNum) {
      const bossSvg = document.getElementById('boss-svg');
      const bossTag = document.getElementById('boss-tag');
      bossTag.innerText = roomData[roomNum].bossName;

      let hairColor = "#1e293b";
      let glasses = true;
      let suitColor = "#0f172a";

      if (roomNum === 2) { suitColor = "#064e3b"; glasses = false; }
      else if (roomNum === 3) { suitColor = "#831843"; hairColor = "#451a03"; }
      else if (roomNum === 4) { suitColor = "#312e81"; }

      let content = `
        <rect x="8" y="2" width="14" height="6" fill="${hairColor}"/>
        <rect x="6" y="4" width="18" height="5" fill="${hairColor}"/>
        <rect x="7" y="8" width="16" height="12" fill="#fde047"/>
        <path d="M 9,10 L 13,12 M 21,10 L 17,12" stroke="#0f172a" stroke-width="1.2"/>
      `;

      if (glasses) {
        content += `
          <rect x="8" y="11" width="6" height="4" fill="#e2e8f0" stroke="#0f172a" stroke-width="1"/>
          <rect x="16" y="11" width="6" height="4" fill="#e2e8f0" stroke="#0f172a" stroke-width="1"/>
          <line x1="14" y1="12" x2="16" y2="12" stroke="#0f172a" stroke-width="1"/>
        `;
      } else {
        content += `
          <rect x="10" y="12" width="3" height="3" fill="#000"/>
          <rect x="17" y="12" width="3" height="3" fill="#000"/>
        `;
      }

      content += `
        <line x1="12" y1="17" x2="18" y2="17" stroke="#0f172a" stroke-width="1"/>
        <rect x="5" y="20" width="20" height="12" fill="${suitColor}"/>
        <polygon points="13,20 17,20 16,28 14,28" fill="#dc2626"/>
        <polygon points="10,20 13,20 12,27" fill="#ffffff"/>
        <polygon points="20,20 17,20 18,27" fill="#ffffff"/>
        <rect x="7" y="32" width="6" height="7" fill="#1e293b"/>
        <rect x="17" y="32" width="6" height="7" fill="#1e293b"/>
        <rect x="6" y="37" width="7" height="3" fill="#000"/>
        <rect x="17" y="37" width="7" height="3" fill="#000"/>
      `;

      bossSvg.innerHTML = content;
    }

    /* ==========================================
       UI 및 대사 제어
    ========================================== */
    function setDialogue(text) {
      document.getElementById('dialogue-text').innerText = text;
    }

    function checkDoorStatus() {
      const door = document.getElementById('door-obj');
      const doorLabel = document.getElementById('door-label');
      
      const currentSolved = roomSolved[currentRoom];
      if (currentSolved.memo && currentSolved.phone) {
        door.style.opacity = '1';
        doorLabel.innerText = currentRoom === 4 ? "🚪 최종 탈출!" : `🚪 ${currentRoom + 1}관 이동!`;
        doorLabel.style.background = '#22c55e';
      }
    }

    /* ==========================================
       퀴즈 시스템 및 점수 계산
    ========================================== */
    function openQuiz(quizKey) {
      wrongAttempts = 0;
      quizStartTime = Date.now();

      const qData = quizzes[quizKey];
      document.getElementById('qz-title').innerText = qData.title;
      document.getElementById('qz-question').innerText = qData.question;
      
      const choicesDiv = document.getElementById('qz-choices');
      choicesDiv.innerHTML = '';

      qData.choices.forEach((choice, idx) => {
        const div = document.createElement('div');
        div.className = 'quiz-choice';
        div.innerText = `${idx + 1}. ${choice}`;
        div.addEventListener('click', (e) => {
          e.stopPropagation();
          submitAnswer(quizKey, idx);
        });
        choicesDiv.appendChild(div);
      });

      document.getElementById('quiz-modal').style.display = 'flex';
    }

    function submitAnswer(quizKey, chosenIdx) {
      const qData = quizzes[quizKey];

      if (chosenIdx === qData.answer) {
        const timeTakenMs = Date.now() - quizStartTime;
        const earnedScore = calculateQuizScore(timeTakenMs, wrongAttempts);
        totalScore += earnedScore;
        updateScoreUI();

        document.getElementById('quiz-modal').style.display = 'none';
        setDialogue(`${qData.successMsg}\n(+${earnedScore.toLocaleString()}점 획득!)`);

        if (quizKey.includes('memo')) roomSolved[currentRoom].memo = true;
        if (quizKey.includes('phone')) roomSolved[currentRoom].phone = true;

        checkDoorStatus();
      } else {
        wrongAttempts++;
        alert(`❌ 오답입니다! (감점 누적: -${wrongAttempts * 800}점) 다시 선택하세요.`);
      }
    }

    /* ==========================================
       방 이동 및 씬 전환
    ========================================== */
    function nextRoom() {
      const currentSolved = roomSolved[currentRoom];
      if (!currentSolved.memo || !currentSolved.phone) {
        alert("현재 관의 메모와 전화기 퀴즈 2개를 모두 해결해야 다음 방으로 넘어갈 수 있습니다!");
        return;
      }

      if (currentRoom < 4) {
        triggerRoomChange(currentRoom + 1);
      } else {
        showEnding();
      }
    }

    function prevRoom() {
      if (currentRoom > 1) {
        triggerRoomChange(currentRoom - 1);
      }
    }

    function triggerRoomChange(toRoom) {
      currentRoom = toRoom;
      document.getElementById('room-title').innerText = roomData[toRoom].title;
      renderRoomBackground(toRoom);
      checkDoorStatus();
      setDialogue(roomData[toRoom].welcomeMsg);
    }

    /* ==========================================
       엔딩 & 점수 서버/로컬 저장 시스템
    ========================================== */
    function showEnding() {
      const totalTimeSec = Math.round((Date.now() - gameStartTime) / 1000);
      const minutes = Math.floor(totalTimeSec / 60);
      const seconds = totalTimeSec % 60;
      const timeStr = `${minutes}분 ${seconds}초`;

      document.getElementById('final-summary').innerHTML = `
        참여자: <b>${playerNickname}</b> 님<br>
        최종 점수: <span style="color:#dc2626; font-size:18px;">${totalScore.toLocaleString()}점</span><br>
        총 소요시간: <b>${timeStr}</b>
      `;

      // 로컬 스토리지 점수 저장
      saveScoreRecord(playerNickname, totalScore, timeStr);
      // 서버 연동 전송 (Google Sheets / REST API 확장 가능)
      sendScoreToServer(playerNickname, totalScore, timeStr);

      renderLeaderboard();
      document.getElementById('ending-modal').style.display = 'flex';
    }

    function saveScoreRecord(name, score, timeStr) {
      let records = JSON.parse(localStorage.getItem('s1fa_leaderboard') || '[]');
      records.push({ name, score, timeStr, timestamp: Date.now() });
      records.sort((a, b) => b.score - a.score);
      localStorage.setItem('s1fa_leaderboard', JSON.stringify(records));
    }

    function renderLeaderboard() {
      let records = JSON.parse(localStorage.getItem('s1fa_leaderboard') || '[]');
      const tbody = document.getElementById('leaderboard-body');
      tbody.innerHTML = '';

      records.forEach((rec, idx) => {
        const tr = document.createElement('tr');
        if (rec.name === playerNickname && rec.score === totalScore) {
          tr.style.background = '#fef08a'; // 현재 플레이어 강조
        }
        tr.innerHTML = `
          <td><b>${idx + 1}위</b></td>
          <td>${rec.name}</td>
          <td><b>${rec.score.toLocaleString()}</b></td>
          <td>${rec.timeStr}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 서버 전송 Webhook / API 확장용 함수
    function sendScoreToServer(name, score, timeStr) {
      console.log("서버 점수 저장 전송:", { name, score, timeStr });
      /* 
        [서버 연동 시 사용 가능 예시]
        fetch('https://your-api-server.com/api/score', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, score, timeStr })
        });
      */
    }

    /* ==========================================
       클릭 이벤트 리스너 바인딩
    ========================================== */
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('boss-npc').addEventListener('click', () => {
        setDialogue(roomData[currentRoom].welcomeMsg);
      });

      document.getElementById('memo-obj').addEventListener('click', () => {
        const key = `r${currentRoom}_memo`;
        if (roomSolved[currentRoom].memo) {
          setDialogue("신입사원: 이 메모 퀴즈는 이미 완료했습니다!");
          return;
        }
        openQuiz(key);
      });

      document.getElementById('phone-obj').addEventListener('click', () => {
        const key = `r${currentRoom}_phone`;
        if (roomSolved[currentRoom].phone) {
          setDialogue("신입사원: 이 전화기 퀴즈는 이미 완료했습니다!");
          return;
        }
        openQuiz(key);
      });

      document.getElementById('door-obj').addEventListener('click', () => {
        nextRoom();
      });
    });
  </script>
</body>
</html>
