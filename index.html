<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>S1FA PJT 방탈출 : 분석기술팀 신입사원의 칼퇴기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0; padding: 0;
      user-select: none;
      font-family: 'Galmuri9', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #333;
      padding: 10px;
    }

    #game-container {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 4 / 3;
      background-color: #f8fafc;
      border: 12px solid #334155;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    #top-nav {
      height: 10%;
      min-height: 44px;
      background: #e2e8f0;
      border-bottom: 4px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      z-index: 100;
    }

    #room-title { font-size: clamp(11px, 1.8vw, 15px); font-weight: bold; color: #0f172a; }
    #user-stats { font-size: clamp(10px, 1.4vw, 13px); font-weight: bold; color: #0f172a; background: #fff; padding: 5px 10px; border: 2px solid #334155; border-radius: 6px; }

    .nav-btn-group { display: flex; gap: 6px; }
    .nav-btn { background: #fff; color: #0f172a; border: 2px solid #334155; padding: 5px 10px; font-size: 12px; font-weight: bold; cursor: pointer; border-radius: 6px; box-shadow: 2px 2px 0px #334155; transition: transform 0.1s; }
    .nav-btn:active { transform: translate(2px, 2px); box-shadow: none; }

    /* 포켓몬 스타일 일러스트 배경 적용 화면 */
    #screen { 
      width: 100%; height: 68%; 
      position: relative; 
      background-color: #f1f5f9;
      overflow: hidden; 
      image-rendering: pixelated;
    }
    
    #interactive-layer { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 40; }

    .interactive-zone { position: absolute; cursor: pointer; display: flex; justify-content: center; align-items: center; border-radius: 8px; transition: all 0.2s ease-in-out; border: 2px dashed #64748b; background: rgba(255,255,255,0.4); }
    .interactive-zone::before { content: '🔍'; font-size: 20px; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5)); }
    .interactive-zone:hover { background-color: rgba(56, 189, 248, 0.4); border: 2px solid #0284c7; }

    .art-item { position: absolute; cursor: grab; display: flex; justify-content: center; align-items: center; transform-origin: bottom center; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.3)); }
    .art-item:active { cursor: grabbing; }
    .draggable-item { z-index: 60 !important; touch-action: none; }

    .pixel-npc { position: absolute; z-index: 50; display: flex; flex-direction: column; align-items: center; transition: all 0.3s ease; }
    #boss-npc { cursor: pointer; }
    #player-npc { pointer-events: none; }

    .door-tag { background: #fff; color: #0f172a; font-size: clamp(9px, 1.2vw, 11px); padding: 4px 10px; border-radius: 6px; border: 2px solid #0f172a; margin-top: 6px; white-space: nowrap; font-weight: bold; box-shadow: 2px 2px 0px #0f172a; }

    #dialogue-box {
      background: #fff; border: 4px solid #334155;
      padding: 12px 20px; position: relative; display: flex; flex-direction: column; justify-content: space-between; z-index: 100;
      border-radius: 8px;
      margin: 8px;
      height: 20%;
      width: calc(100% - 16px);
      box-shadow: inset 0 0 0 2px #cbd5e1;
    }
    #dialogue-text { font-size: clamp(11px, 1.8vw, 14px); line-height: 1.6; color: #0f172a; font-weight: bold; white-space: pre-line; }

    .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 15px; z-index: 1000; }
    .modal-card { background: #fff; border: 4px solid #0f172a; border-radius: 12px; width: 100%; max-width: 520px; padding: 22px; color: #0f172a; position: relative; box-shadow: 4px 4px 0px #0f172a; }
    .modal-close-btn { position: absolute; top: -12px; right: -12px; background: #fff; color: #ef4444; border: 4px solid #0f172a; border-radius: 50%; width: 36px; height: 36px; cursor: pointer; font-weight: bold; font-size: 16px; box-shadow: 2px 2px 0px #0f172a; }

    .quiz-title { font-size: 16px; color: #0f172a; margin-bottom: 12px; font-weight: bold; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
    .quiz-q { font-size: 14px; margin-bottom: 12px; line-height: 1.5; color: #0f172a; font-weight: bold; }
    .quiz-hint { display: inline-block; background: #fef08a; color: #854d0e; font-size: 11px; padding: 4px 8px; border-radius: 4px; border: 1px solid #ca8a04; margin-bottom: 12px; font-weight: bold; }
    .quiz-choice-list { display: flex; flex-direction: column; gap: 8px; }
    .quiz-choice-item { background: #f8fafc; border: 2px solid #94a3b8; padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; color: #0f172a; }
    .quiz-choice-item:hover { background: #e0f2fe; border-color: #0284c7; }
    .quiz-input-group { display: flex; gap: 8px; }
    .quiz-input { flex: 1; padding: 10px; font-size: 13px; background: #f8fafc; border: 2px solid #94a3b8; border-radius: 6px; color: #0f172a; font-weight: bold; }
    .quiz-submit-btn { background: #ef4444; color: #fff; border: 2px solid #7f1d1d; padding: 0 18px; font-size: 13px; font-weight: bold; cursor: pointer; border-radius: 6px; box-shadow: 2px 2px 0px #7f1d1d; }
    .start-input { width: 100%; padding: 12px; font-size: 13px; background: #f8fafc; border: 2px solid #94a3b8; border-radius: 6px; color: #0f172a; margin: 16px 0; font-weight: bold; }
    .start-btn { width: 100%; background: #3b82f6; color: #fff; border: 2px solid #1e3a8a; padding: 12px; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 6px; box-shadow: 2px 2px 0px #1e3a8a; }

    .wire-port { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #000; cursor: pointer; display: inline-block; }
    .wire-red { background: #ef4444; } .wire-blue { background: #3b82f6; } .wire-yellow { background: #eab308; }
    .stain-spot { width: 44px; height: 44px; background: rgba(180, 83, 9, 0.85); border-radius: 50%; position: absolute; cursor: pointer; display: flex; justify-content: center; align-items: center; border: 2px dashed #facc15; }
  </style>
</head>

    function makeElementDraggable(elem, onMoved) {
      if (!elem) return;
      let isDragging = false, startX, startY, initLeft, initTop;

      const down = (e) => {
        isDragging = true;
        const evt = e.touches ? e.touches[0] : e;
        startX = evt.clientX; startY = evt.clientY;
        initLeft = elem.offsetLeft; initTop = elem.offsetTop;
      };

      const move = (e) => {
        if (!isDragging) return;
        const evt = e.touches ? e.touches[0] : e;
        const dx = evt.clientX - startX, dy = evt.clientY - startY;
        elem.style.left = (initLeft + dx) + 'px';
        elem.style.top = (initTop + dy) + 'px';
        if (Math.abs(dx) > 30 || Math.abs(dy) > 30) { if (onMoved) { onMoved(); onMoved = null; } }
      };

      const up = () => { isDragging = false; };
      elem.addEventListener('mousedown', down); elem.addEventListener('touchstart', down);
      window.addEventListener('mousemove', move); window.addEventListener('touchmove', move);
      window.addEventListener('mouseup', up); window.addEventListener('touchend', up);
    }

    function updateDoorStatusUI() {
      const door = document.getElementById('door-obj');
      const doorLabel = document.getElementById('door-label');

      if (solved.q1 && solved.q2 && solved.q3) {
        door.style.opacity = '1';
        doorLabel.innerText = currentRoom === 4 ? "🚪 탈출하기!" : `🚪 ${currentRoom + 1}관 입장`;
        doorLabel.style.background = '#22c55e';
      } else {
        door.style.opacity = '0.6';
        doorLabel.innerText = "🔒 다음 방";
        doorLabel.style.background = '#fff';
      }
    }

    function openWireMiniGame(slotKey) {
      if (roomSolved[currentRoom][slotKey]) return alert("✅ 이미 해결한 미션입니다!");
      const mgTitle = document.getElementById('mg-title'), mgBody = document.getElementById('mg-body');
      mgTitle.innerText = "🔌 2관 미션: 케이블 선 연결";
      mgBody.innerHTML = `
        <p style="font-size:12px; color:#475569; margin-bottom:12px; font-weight:bold;">같은 색 단자를 클릭해 연결하세요!</p>
        <div style="display:flex; justify-content:space-around; align-items:center; background:#f8fafc; padding:15px; border:2px solid #cbd5e1; border-radius:8px;">
          <div class="wire-port wire-red" data-color="red"></div>
          <div class="wire-port wire-blue" data-color="blue"></div>
          <div style="font-size:12px; color:#854d0e; font-weight:bold;">선택 대기...</div>
          <div class="wire-port wire-blue" data-color="blue"></div>
          <div class="wire-port wire-red" data-color="red"></div>
        </div>
      `;
      document.getElementById('minigame-modal').style.display = 'flex';

      let sel = null, count = 0;
      mgBody.querySelectorAll('.wire-port').forEach(p => {
        p.addEventListener('click', () => {
          const c = p.getAttribute('data-color');
          if (!sel) { sel = { c, elem: p }; p.style.transform = 'scale(1.2)'; }
          else {
            if (sel.elem !== p && sel.c === c) {
              p.style.opacity = '0.3'; sel.elem.style.opacity = '0.3';
              count++; sel = null;
              if (count >= 2) {
                setTimeout(() => { document.getElementById('minigame-modal').style.display = 'none'; openQuizObj(assignedQuizzes[2][slotKey], slotKey); }, 300);
              }
            } else { sel.elem.style.transform = 'scale(1)'; sel = null; }
          }
        });
      });
    }

    function openStainMiniGame(slotKey) {
      if (roomSolved[currentRoom][slotKey]) return alert("✅ 이미 해결한 미션입니다!");
      const mgTitle = document.getElementById('mg-title'), mgBody = document.getElementById('mg-body');
      mgTitle.innerText = "🔍 3관 미션: 모니터 얼룩 닦기";
      mgBody.innerHTML = `
        <p style="font-size:12px; color:#475569; margin-bottom:12px; font-weight:bold;">화면 얼룩을 클릭해 정밀 단위를 확인하세요!</p>
        <div style="position:relative; width:100%; height:140px; background:#1e293b; border:4px solid #0f172a; border-radius:8px; display:flex; justify-content:center; align-items:center;">
          <div style="font-size:13px; color:#38bdf8; font-weight:bold;">[ VSEM 정밀 단위 : nm ]</div>
          <div class="stain-spot" style="top:20px; left:50px;">🧹</div>
          <div class="stain-spot" style="top:70px; left:220px;">🧹</div>
        </div>
      `;
      document.getElementById('minigame-modal').style.display = 'flex';

      let count = 0;
      mgBody.querySelectorAll('.stain-spot').forEach(s => {
        s.addEventListener('click', () => {
          s.style.display = 'none'; count++;
          if (count >= 2) {
            setTimeout(() => { document.getElementById('minigame-modal').style.display = 'none'; openQuizObj(assignedQuizzes[3][slotKey], slotKey); }, 300);
          }
        });
      });
    }

    function openQuizObj(qData, slotKey) {
      if (roomSolved[currentRoom][slotKey]) return alert("✅ 이미 해결한 미션입니다!");
      activeQuizObj = qData; currentSlotKey = slotKey;
      document.getElementById('qz-title').innerText = qData.title;
      document.getElementById('qz-question').innerText = qData.question;

      const hintElem = document.getElementById('qz-hint');
      const choicesContainer = document.getElementById('qz-choices-container');
      const inputContainer = document.getElementById('qz-input-container');

      choicesContainer.innerHTML = ''; document.getElementById('qz-input').value = '';

      if (qData.answers) {
        hintElem.style.display = 'inline-block'; hintElem.innerText = qData.hint;
        choicesContainer.style.display = 'none'; inputContainer.style.display = 'flex';
        setTimeout(() => document.getElementById('qz-input').focus(), 100);
      } else {
        hintElem.style.display = 'none'; inputContainer.style.display = 'none';
        choicesContainer.style.display = 'flex';
        qData.choices.forEach((c, idx) => {
          const btn = document.createElement('div');
          btn.className = 'quiz-choice-item'; btn.innerText = c;
          btn.addEventListener('click', () => checkAnswer(idx));
          choicesContainer.appendChild(btn);
        });
      }
      document.getElementById('quiz-modal').style.display = 'flex';
    }

    function checkAnswer(chosenIdx) {
      if (chosenIdx === activeQuizObj.answerIdx) handleSuccess();
      else handleFail();
    }

    function checkSubjective() {
      const val = document.getElementById('qz-input').value.trim().toLowerCase().replace(/\s+/g, '');
      const ok = activeQuizObj.answers.some(a => a.toLowerCase().replace(/\s+/g, '') === val);
      if (ok) handleSuccess();
      else handleFail();
    }

    function handleSuccess() {
      const acquiredScore = activeQuizObj.score || 6000;
      totalScore += acquiredScore;
      updateScoreUI();
      if (currentSlotKey) roomSolved[currentRoom][currentSlotKey] = true;
      setDialogue(`${activeQuizObj.successMsg}\n(+${acquiredScore.toLocaleString()}점 획득! 현재 총점: ${totalScore.toLocaleString()}점)`);
      updateDoorStatusUI();
      document.getElementById('quiz-modal').style.display = 'none';
    }

    function handleFail() {
      totalScore = Math.max(0, totalScore - 2000);
      updateScoreUI();
      alert(`❌ 오답입니다! -2,000점 감점되었습니다. (현재 점수: ${totalScore.toLocaleString()}점)`);
    }

    function updateScoreUI() {
      document.getElementById('user-stats').innerText = `점수: ${totalScore.toLocaleString()}점 | ${playerNickname}`;
    }

    function setDialogue(txt) { document.getElementById('dialogue-text').innerText = txt; }

    function triggerRoomChange(toRoom) {
      currentRoom = toRoom;
      document.getElementById('room-title').innerText = roomData[toRoom].title;
      renderRoomBackground(toRoom);
      renderInteractiveElements(toRoom);
      setDialogue(roomData[toRoom].welcomeMsg);
    }

    document.addEventListener('DOMContentLoaded', () => {
      generateQuizzes();
      document.getElementById('start-btn').addEventListener('click', () => {
        const name = document.getElementById('nickname-input').value.trim();
        if (!name) return alert("이름을 입력하세요!");
        
        const bgm = document.getElementById('bgm');
        if (bgm) {
          bgm.volume = 0.3;
          bgm.play().catch(e => console.log('BGM Play Error:', e));
        }

        playerNickname = name;
        document.getElementById('start-modal').style.display = 'none';
        updateScoreUI();
        triggerRoomChange(1);
      });

      document.getElementById('prev-btn').addEventListener('click', () => { if (currentRoom > 1) triggerRoomChange(currentRoom - 1); });
      document.getElementById('next-btn').addEventListener('click', () => {
        const solved = roomSolved[currentRoom];
        if (!solved.q1 || !solved.q2 || !solved.q3) return alert("현재 방의 모든 미션을 완수해야 문이 열립니다!");
        if (currentRoom < 4) {
          triggerRoomChange(currentRoom + 1);
        } else {
          alert(`🎉 모든 미션을 완수했습니다! 최종 점수: ${totalScore.toLocaleString()}점`);
        }
      });

      document.getElementById('door-obj').addEventListener('click', () => {
        const solved = roomSolved[currentRoom];
        if (!solved.q1 || !solved.q2 || !solved.q3) return alert("현재 방의 3개 미션을 모두 완수해야 문이 열립니다!");
        if (currentRoom < 4) {
          triggerRoomChange(currentRoom + 1);
        } else {
          alert(`🎉 탈출 성공! 고생하셨습니다! 최종 점수: ${totalScore.toLocaleString()}점`);
        }
      });

      document.getElementById('qz-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          checkSubjective();
        }
      });
      document.getElementById('nickname-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          document.getElementById('start-btn').click();
        }
      });

      document.getElementById('qz-submit-btn').addEventListener('click', checkSubjective);
      document.getElementById('quiz-close-btn').addEventListener('click', () => document.getElementById('quiz-modal').style.display = 'none');
      document.getElementById('minigame-close-btn').addEventListener('click', () => document.getElementById('minigame-modal').style.display = 'none');
    });
  </script>
</body>
</html>
