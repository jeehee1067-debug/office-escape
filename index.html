<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S1FA PJT 방탈출 : 신입사원의 칼퇴기</title>
  <!-- 갈무리 레트로 픽셀 폰트 로드 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Galmuri9', monospace;
    }

    body {
      background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #fff;
    }

    /* 확장된 메인 프레임 (1000px * 720px) */
    #game-container {
      width: 1000px;
      height: 720px;
      background-color: #0f172a;
      border: 5px solid #38bdf8;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 45px rgba(56, 189, 248, 0.4), inset 0 0 20px rgba(0,0,0,0.8);
    }

    /* 상단 내비게이션 바 */
    #top-nav {
      height: 58px;
      background: #1e293b;
      border-bottom: 4px solid #38bdf8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 18px;
      z-index: 100;
    }

    #room-title {
      font-size: 15px;
      font-weight: bold;
      color: #38bdf8;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }

    #user-stats {
      font-size: 12px;
      font-weight: bold;
      color: #facc15;
      background: #020617;
      padding: 6px 12px;
      border: 2px solid #facc15;
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(250, 204, 21, 0.3);
    }

    .nav-btn-group {
      display: flex;
      gap: 6px;
    }

    .nav-btn {
      background: #0f172a;
      color: #fff;
      border: 2px solid #38bdf8;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s ease;
    }

    .nav-btn:hover {
      background: #38bdf8;
      color: #0f172a;
      box-shadow: 0 0 12px #38bdf8;
    }

    .nav-btn:active {
      transform: scale(0.95);
    }

    /* 메인 픽셀 화면 */
    #screen {
      width: 100%;
      height: 480px;
      position: relative;
      background-color: #020617;
      overflow: hidden;
    }

    .pixel-render {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #bg-svg {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
    }

    /* NPC 및 숨겨진 인터랙티브 사물 요소들 */
    .pixel-object {
      position: absolute;
      cursor: pointer;
      z-index: 50;
      transition: transform 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pixel-object:hover {
      filter: drop-shadow(0px 0px 8px #facc15);
    }

    /* 드래그 가능한 오브젝트 클래스 */
    .draggable-obj {
      cursor: grab;
      z-index: 60 !important;
      touch-action: none;
    }

    .draggable-obj:active {
      cursor: grabbing;
    }

    /* 위치 좌표 설정 */
    #boss-npc { top: 220px; left: 520px; }
    #player-npc { top: 220px; left: 320px; }

    /* 출입문 */
    #door-obj { top: 25px; right: 35px; }
    .door-tag {
      background: rgba(15, 23, 42, 0.9);
      color: #f8fafc;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #38bdf8;
      margin-top: 4px;
      white-space: nowrap;
    }

    /* 하단 대사창 */
    #dialogue-box {
      width: 100%;
      height: 182px;
      background: #090d16;
      border-top: 4px solid #38bdf8;
      padding: 18px 24px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      z-index: 100;
    }

    #dialogue-text {
      font-size: 15px;
      line-height: 1.6;
      color: #f1f5f9;
      white-space: pre-line;
      font-weight: bold;
    }

    #next-arrow {
      position: absolute;
      bottom: 16px;
      right: 20px;
      width: 0; height: 0;
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      border-top: 11px solid #facc15;
      animation: bounce 0.8s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(6px); }
    }

    /* 모달 팝업 디자인 공통 */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 6, 23, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-card {
      background: #0f172a;
      border: 3px solid #38bdf8;
      border-radius: 10px;
      width: 100%;
      max-width: 580px;
      padding: 26px;
      color: #fff;
      position: relative;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
    }

    .modal-close-btn {
      position: absolute;
      top: 14px;
      right: 16px;
      background: #1e293b;
      color: #f87171;
      border: 2px solid #ef4444;
      border-radius: 6px;
      width: 34px;
      height: 34px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.15s ease;
    }

    .modal-close-btn:hover {
      background: #ef4444;
      color: #fff;
      box-shadow: 0 0 10px #ef4444;
    }

    .quiz-title {
      font-size: 16px;
      color: #38bdf8;
      margin-bottom: 12px;
      font-weight: bold;
      padding-right: 40px;
    }

    .quiz-q {
      font-size: 14px;
      margin-bottom: 14px;
      line-height: 1.5;
      color: #f8fafc;
      font-weight: bold;
    }

    .quiz-hint {
      display: inline-block;
      background: #1e293b;
      color: #facc15;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #facc15;
      margin-bottom: 14px;
    }

    /* 객관식 선택지 */
    .quiz-choice-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .quiz-choice-item {
      background: #1e293b;
      border: 2px solid #334155;
      padding: 12px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      color: #f1f5f9;
      transition: all 0.15s ease;
    }

    .quiz-choice-item:hover {
      background: #2563eb;
      border-color: #60a5fa;
      color: #fff;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.4);
    }

    /* 주관식 입력 그룹 */
    .quiz-input-group {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .quiz-input {
      flex: 1;
      padding: 12px;
      font-size: 14px;
      background: #020617;
      border: 2px solid #38bdf8;
      border-radius: 6px;
      color: #fff;
      outline: none;
      font-weight: bold;
    }

    .quiz-input:focus {
      border-color: #facc15;
      box-shadow: 0 0 10px rgba(250, 204, 21, 0.4);
    }

    .quiz-submit-btn {
      background: #2563eb;
      color: #fff;
      border: 2px solid #60a5fa;
      padding: 0 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.15s ease;
    }

    .quiz-submit-btn:hover {
      background: #1d4ed8;
      box-shadow: 0 0 12px #2563eb;
    }

    /* 시작 모달 입력 폼 */
    .start-input {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      background: #020617;
      border: 2px solid #38bdf8;
      border-radius: 6px;
      color: #fff;
      margin: 18px 0;
      font-weight: bold;
    }

    .start-btn {
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: 2px solid #60a5fa;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      box-shadow: 0 0 15px rgba(37, 99, 235, 0.5);
    }

    .start-btn:hover {
      background: #1d4ed8;
    }

    /* 리더보드 테이블 */
    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 12px;
    }

    .leaderboard-table th, .leaderboard-table td {
      border: 1px solid #334155;
      padding: 8px;
      text-align: center;
    }

    .leaderboard-table th {
      background: #1e293b;
      color: #38bdf8;
    }

    .leaderboard-table td {
      background: #020617;
    }

    /* 미니 게임 인터랙션 전용 CSS */
    .wire-port {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 3px solid #fff;
      cursor: pointer;
      display: inline-block;
      transition: transform 0.2s;
    }
    .wire-port:hover { transform: scale(1.2); }
    .wire-red { background: #ef4444; }
    .wire-blue { background: #3b82f6; }
    .wire-yellow { background: #eab308; }

    .stain-spot {
      width: 45px;
      height: 45px;
      background: rgba(180, 83, 9, 0.85);
      border-radius: 50%;
      position: absolute;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      border: 2px dashed #facc15;
      box-shadow: 0 0 10px #facc15;
    }
    .stain-spot:hover { transform: scale(1.1); }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- 시작 모달 -->
    <div id="start-modal" class="modal-overlay">
      <div class="modal-card">
        <h2 style="font-size: 21px; color:#38bdf8; text-align:center; margin-bottom:12px; text-shadow:0 0 10px #38bdf8;">🚀 S1FA PJT 방탈출 (맥거핀 낚시 주의!)</h2>
        <p style="font-size: 13px; line-height: 1.5; color:#cbd5e1; text-align:center;">
          진짜 단서와 <b>플레이어를 낚는 가짜 맥거핀 사물</b>이 섞여 있습니다!<br>
          물건을 직접 드래그하고 눌러보며 진짜 신입사원 퀴즈를 찾아내세요.<br>
          <span style="color:#ef4444;">[경고]</span> 오답 제출 시 <b>-2,000점</b>이 감점됩니다!
        </p>
        <input type="text" id="nickname-input" class="start-input" placeholder="파트명 / 이름 (예: EFA1 / 홍길동)..." maxlength="20">
        <button id="start-btn" class="start-btn">게임 시작하기 ➔</button>
      </div>
    </div>

    <!-- 상단 내비게이션 바 -->
    <div id="top-nav">
      <div id="room-title">S1FA PJT : 1관 EFA1 파트</div>
      <div id="user-stats">점수: 0점</div>
      <div class="nav-btn-group">
        <button id="prev-btn" class="nav-btn">◄ 이전</button>
        <button id="next-btn" class="nav-btn">다음 ►</button>
        <button id="reset-btn" class="nav-btn" style="border-color:#ef4444; color:#f87171;">🔄 초기화</button>
      </div>
    </div>

    <!-- 메인 픽셀 화면 -->
    <div id="screen">
      <!-- 배경 SVG 렌더링 -->
      <svg id="bg-svg" class="pixel-render" viewBox="0 0 320 200" preserveAspectRatio="none"></svg>

      <!-- NPC: 파트장님/PL님 -->
      <div class="pixel-object" id="boss-npc" style="cursor:pointer;">
        <svg id="boss-svg" width="60" height="80" viewBox="0 0 30 40" class="pixel-render"></svg>
        <div id="boss-tag" class="door-tag">김주헌 파트장님</div>
      </div>

      <!-- Player: 신입사원 -->
      <div class="pixel-object" id="player-npc" style="pointer-events:none;">
        <svg width="60" height="80" viewBox="0 0 30 40" class="pixel-render">
          <rect x="7" y="3" width="16" height="7" fill="#0f172a"/>
          <rect x="7" y="9" width="16" height="11" fill="#fde047"/>
          <rect x="10" y="12" width="3" height="3" fill="#0f172a"/>
          <rect x="17" y="12" width="3" height="3" fill="#0f172a"/>
          <path d="M 12,17 Q 15,19 18,17" stroke="#0f172a" fill="none" stroke-width="1"/>
          <rect x="6" y="20" width="18" height="12" fill="#2563eb"/>
          <path d="M 6,24 L 24,24 M 6,28 L 24,28 M 12,20 L 12,32 M 18,20 L 18,32" stroke="#1d4ed8" stroke-width="1"/>
          <rect x="8" y="32" width="5" height="7" fill="#1e3a8a"/>
          <rect x="17" y="32" width="5" height="7" fill="#1e3a8a"/>
          <rect x="7" y="37" width="6" height="3" fill="#ffffff"/>
          <rect x="17" y="37" width="6" height="3" fill="#ffffff"/>
        </svg>
        <div id="player-tag" class="door-tag">신입사원</div>
      </div>

      <!-- 동적 상호작용 레이어 (진짜 + 맥거핀 낚시 오브젝트) -->
      <div id="interactive-layer"></div>

      <!-- 출입문 -->
      <div class="pixel-object" id="door-obj" style="opacity:0.5;">
        <span style="font-size:32px;">🚪</span>
        <div class="door-tag" id="door-label">🔒 다음 방</div>
      </div>
    </div>

    <!-- 하단 대사창 -->
    <div id="dialogue-box">
      <div id="dialogue-text">대사가 출력됩니다.</div>
      <div id="next-arrow"></div>
    </div>

    <!-- 미니 인터랙션 모달 (2관 케이블 / 3관 얼룩) -->
    <div id="minigame-modal" class="modal-overlay" style="display:none;">
      <div class="modal-card">
        <button id="minigame-close-btn" class="modal-close-btn">✖</button>
        <div class="quiz-title" id="mg-title">🔧 특수 미션</div>
        <div id="mg-body" style="margin-top:15px; text-align:center;"></div>
      </div>
    </div>

    <!-- 퀴즈 모달 -->
    <div id="quiz-modal" class="modal-overlay" style="display:none;">
      <div class="modal-card">
        <button id="quiz-close-btn" class="modal-close-btn">✖</button>
        <div class="quiz-title" id="qz-title">📋 퀴즈</div>
        <div class="quiz-q" id="qz-question">질문</div>
        <div class="quiz-hint" id="qz-hint" style="display:none;">💡 힌트: </div>
        
        <!-- 객관식 영역 -->
        <div id="qz-choices-container" class="quiz-choice-list" style="display:none;"></div>

        <!-- 주관식 영역 -->
        <div id="qz-input-container" class="quiz-input-group" style="display:none;">
          <input type="text" id="qz-input" class="quiz-input" placeholder="정답을 입력하세요..." />
          <button id="qz-submit-btn" class="quiz-submit-btn">제출 ➔</button>
        </div>
      </div>
    </div>

    <!-- 엔딩 및 리더보드 모달 -->
    <div id="ending-modal" class="modal-overlay" style="display:none;">
      <div class="modal-card" style="max-width: 580px; text-align: center;">
        <h2 style="font-size:22px; color:#4ade80; margin-bottom:8px; text-shadow:0 0 10px #22c55e;">🎉 12개 미션 완수! 칼퇴 성공!</h2>
        <p id="final-summary" style="font-size:14px; font-weight:bold; margin-bottom:12px; color:#cbd5e1;"></p>
        
        <h3 style="font-size:14px; text-align:left; margin-top:10px; color:#38bdf8;">🏆 S1FA PJT 랭킹 순위표</h3>
        <div style="max-height: 180px; overflow-y: auto; margin-bottom: 15px;">
          <table class="leaderboard-table">
            <thead>
              <tr>
                <th>순위</th>
                <th>파트 / 이름</th>
                <th>점수</th>
                <th>소요시간</th>
              </tr>
            </thead>
            <tbody id="leaderboard-body"></tbody>
          </table>
        </div>
        <button id="restart-btn" class="start-btn">다시 도전하기 🔄</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================
       글로벌 상태 변수 & 세션 데이터

    let userIp = "default_user";
    let playerNickname = "EFA1 / 신입사원";

    // 미니 게임 상태

    // 관별 3문제 완료 상태

        successMsg: "김주헌 파트장님: 좋아! 비즈니스 이메일 규격을 잘 알고 있군."
      },
      r1_q2: {

    /* ==========================================
       IP 주소 기반 실시간 자동저장 & 로드 시스템
    ========================================== */
    async function fetchUserIp() {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2000);
        const res = await fetch('https://api.ipify.org?format=json', { signal: controller.signal });
        clearTimeout(timeoutId);
        const data = await res.json();
        if (data && data.ip) {
          userIp = data.ip.replace(/[^a-zA-Z0-9]/g, "_");
        }
      } catch (e) {
        userIp = "local_browser_session";
      }
    }

    function saveGameState() {
      const state = {
        userIp,
        playerNickname,
        currentRoom,
        totalScore,
        gameStartTime,
        roomSolved,
        lastUpdated: Date.now()
      };
      localStorage.setItem('s1fa_state_' + userIp, JSON.stringify(state));
      localStorage.setItem('s1fa_latest_session', JSON.stringify(state));
    }

    function loadGameState() {
      let saved = localStorage.getItem('s1fa_state_' + userIp);
      if (!saved) {
        saved = localStorage.getItem('s1fa_latest_session');
      }
      if (saved) {
        try {
          return JSON.parse(saved);
        } catch (e) {
          return null;
        }
      }
      return null;
    }

    function resetGameProgress() {
      if (confirm("정말로 모든 진행 상황을 초기화하고 첫 화면부터 다시 시작하시겠습니까?")) {
        localStorage.removeItem('s1fa_state_' + userIp);
        localStorage.removeItem('s1fa_latest_session');
        location.reload();
      }
    }

    /* ==========================================
       게임 시작 및 복구 제어
    ========================================== */
    function startGame() {
      const input = document.getElementById('nickname-input').value.trim();
      if (!input) {
        alert("소속 파트명과 이름을 입력해 주세요!\n(예: EFA1 / 홍길동)");
        return;
      }
      playerNickname = input;
      gameStartTime = Date.now();

      document.getElementById('player-tag').innerText = playerNickname;
      document.getElementById('start-modal').style.display = 'none';

      saveGameState();
      updateScoreUI();
      renderRoomBackground(1);
      renderInteractiveElements(1);
      setDialogue(roomData[1].welcomeMsg);
    }

    function restoreGame(savedState) {
      playerNickname = savedState.playerNickname || "EFA1 / 신입사원";
      currentRoom = savedState.currentRoom || 1;
      totalScore = savedState.totalScore || 0;
      gameStartTime = savedState.gameStartTime || Date.now();
      roomSolved = savedState.roomSolved || roomSolved;

      document.getElementById('player-tag').innerText = playerNickname;
      document.getElementById('start-modal').style.display = 'none';

      updateScoreUI();
      triggerRoomChange(currentRoom);
      setDialogue(`[진행 상황 복구 완료]\n${playerNickname} 님, 이전 접속 위치(${currentRoom}관)에서 이어서 진행합니다!`);
    }

    /* ==========================================
       점수 계산 및 UI 실시간 렌더링
    ========================================== */
    function calculateQuizScore(timeTakenMs) {
      const timeInSec = timeTakenMs / 1000;
      let score = Math.max(300, Math.round(10000 - (timeInSec * 145)));
      return score;
    }

    function updateScoreUI() {
      document.getElementById('user-stats').innerText = `점수: ${totalScore.toLocaleString()}점 | ${playerNickname}`;
    }

    /* 드래그 엔진 */
    function makeElementDraggable(elem, onMovedCallback) {
      if (!elem) return;
      let isDragging = false;
      let startX, startY, initialLeft, initialTop;

      const onMouseDown = (e) => {
        isDragging = true;
        const event = e.touches ? e.touches[0] : e;
        startX = event.clientX;
        startY = event.clientY;
        initialLeft = elem.offsetLeft;
        initialTop = elem.offsetTop;
        elem.style.transition = 'none';
      };

      const onMouseMove = (e) => {
        if (!isDragging) return;
        const event = e.touches ? e.touches[0] : e;
        const dx = event.clientX - startX;
        const dy = event.clientY - startY;

        elem.style.left = (initialLeft + dx) + 'px';
        elem.style.top = (initialTop + dy) + 'px';

        if (Math.abs(dx) > 40 || Math.abs(dy) > 40) {
          if (onMovedCallback) {
            onMovedCallback();
            onMovedCallback = null;
          }
        }
      };

      const onMouseUp = () => {
        isDragging = false;
      };

      elem.addEventListener('mousedown', onMouseDown);
      elem.addEventListener('touchstart', onMouseDown);

      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('touchmove', onMouseMove);

      window.addEventListener('mouseup', onMouseUp);
      window.addEventListener('touchend', onMouseUp);
    }

    function openQuiz(quizKey) {
      activeQuizKey = quizKey;
      quizStartTime = Date.now();

      const qData = quizzes[quizKey];
      document.getElementById('qz-title').innerText = qData.title;
      document.getElementById('qz-question').innerText = qData.question;
      
      const hintElem = document.getElementById('qz-hint');
      const choicesContainer = document.getElementById('qz-choices-container');
      const inputContainer = document.getElementById('qz-input-container');

      choicesContainer.innerHTML = '';
      document.getElementById('qz-input').value = '';

      if (qData.type === 'subjective') {
        hintElem.style.display = 'inline-block';
        hintElem.innerText = qData.hint;
        choicesContainer.style.display = 'none';
        inputContainer.style.display = 'flex';
        
        setTimeout(() => document.getElementById('qz-input').focus(), 100);
      } else {
        hintElem.style.display = 'none';
        inputContainer.style.display = 'none';
        choicesContainer.style.display = 'flex';

        qData.choices.forEach((choiceText, idx) => {
          const btn = document.createElement('div');
          btn.className = 'quiz-choice-item';
          btn.innerText = choiceText;
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            checkObjectiveAnswer(idx);
          });
          choicesContainer.appendChild(btn);
        });
      }

      document.getElementById('quiz-modal').style.display = 'flex';
    }

    /* 주관식 정답 검사 */
    function checkSubjectiveAnswer() {
      if (!activeQuizKey) return;
      const qData = quizzes[activeQuizKey];
      const input = document.getElementById('qz-input');
      const userAns = input.value.trim().toLowerCase().replace(/\s+/g, '');

      if (!userAns) {
        alert("정답을 입력해 주세요!");
        return;
      }

      const isCorrect = qData.answers.some(ans => ans.toLowerCase().replace(/\s+/g, '') === userAns);

      if (isCorrect) {
        handleQuizSuccess(qData);
      } else {
        handleQuizFailure();
        input.value = '';
        input.focus();
      }
    }

      if (!activeQuizKey) return;
      const qData = quizzes[activeQuizKey];

      if (chosenIdx === qData.answerIdx) {
        handleQuizSuccess(qData);
      } else {
        handleQuizFailure();
      }
    }

    /* 퀴즈 정답 처리 */
    function handleQuizSuccess(qData) {
      const timeTakenMs = Date.now() - quizStartTime;
      const earnedScore = calculateQuizScore(timeTakenMs);
      totalScore += earnedScore;
      updateScoreUI();

      if (activeQuizKey.endsWith('q1')) roomSolved[currentRoom].q1 = true;
      if (activeQuizKey.endsWith('q2')) roomSolved[currentRoom].q2 = true;
      if (activeQuizKey.endsWith('q3')) roomSolved[currentRoom].q3 = true;

      setDialogue(`${qData.successMsg}\n(+${earnedScore.toLocaleString()}점 획득! 현재 총점: ${totalScore.toLocaleString()}점)`);
      
      saveGameState();
      updateDoorStatusUI();
      closeQuizModal();
    }

    /* 퀴즈 오답 처리 (-2,000점 감점) */
    function handleQuizFailure() {
      const penalty = 2000;
      totalScore = Math.max(0, totalScore - penalty);
      updateScoreUI();
      saveGameState();
      alert(`❌ 오답입니다! 2,000점이 감점되었습니다.\n(현재 점수: ${totalScore.toLocaleString()}점) 신중하게 맞춰보세요!`);
    }

    function nextRoom() {
      const currentSolved = roomSolved[currentRoom];
      if (!currentSolved.q1 || !currentSolved.q2 || !currentSolved.q3) {
        alert("현재 관의 3개 미션을 모두 해결해야 다음 방으로 넘어갈 수 있습니다!");
        return;
      }

      if (currentRoom < 4) {
        triggerRoomChange(currentRoom + 1);
      } else {
        showEnding();
      }
    }

    function prevRoom() {
      if (currentRoom > 1) {
        triggerRoomChange(currentRoom - 1);
      }
    }

    function triggerRoomChange(toRoom) {
      currentRoom = toRoom;
      document.getElementById('room-title').innerText = roomData[toRoom].title;
      renderRoomBackground(toRoom);
      renderInteractiveElements(toRoom);
      setDialogue(roomData[toRoom].welcomeMsg);
      saveGameState();
    }

    function showEnding() {
      const totalTimeSec = Math.round((Date.now() - gameStartTime) / 1000);
      const minutes = Math.floor(totalTimeSec / 60);
      const seconds = totalTimeSec % 60;
      const timeStr = `${minutes}분 ${seconds}초`;

      document.getElementById('final-summary').innerHTML = `
        참여자: <b>${playerNickname}</b><br>
        최종 점수: <span style="color:#facc15; font-size:18px;">${totalScore.toLocaleString()}점</span><br>
        총 소요시간: <b>${timeStr}</b>
      `;

      saveScoreRecord(playerNickname, totalScore, timeStr);
      renderLeaderboard();
      document.getElementById('ending-modal').style.display = 'flex';
    }

    function saveScoreRecord(name, score, timeStr) {
      let records = JSON.parse(localStorage.getItem('s1fa_leaderboard') || '[]');
      records.push({ name, score, timeStr, timestamp: Date.now() });
      records.sort((a, b) => b.score - a.score);
      localStorage.setItem('s1fa_leaderboard', JSON.stringify(records));
    }

    function renderLeaderboard() {
      let records = JSON.parse(localStorage.getItem('s1fa_leaderboard') || '[]');
      const tbody = document.getElementById('leaderboard-body');
      tbody.innerHTML = '';

      records.forEach((rec, idx) => {
        const tr = document.createElement('tr');
        if (rec.name === playerNickname && rec.score === totalScore) {
          tr.style.background = '#1e3a8a';
        }
        tr.innerHTML = `
          <td><b>${idx + 1}위</b></td>
          <td>${rec.name}</td>
          <td><b style="color:#facc15;">${rec.score.toLocaleString()}</b></td>
          <td>${rec.timeStr}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    /* ==========================================
       초기화 및 자동 로드 실행
    ========================================== */
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. IP 주소 가져오기
      await fetchUserIp();

      // 2. 버튼 및 이벤트 바인딩
      const startBtn = document.getElementById('start-btn');
      const nicknameInput = document.getElementById('nickname-input');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      const resetBtn = document.getElementById('reset-btn');
      const restartBtn = document.getElementById('restart-btn');
      const qzSubmitBtn = document.getElementById('qz-submit-btn');
      const qzInput = document.getElementById('qz-input');
      const quizCloseBtn = document.getElementById('quiz-close-btn');
      const minigameCloseBtn = document.getElementById('minigame-close-btn');

      if (startBtn) startBtn.addEventListener('click', startGame);
      if (nicknameInput) {
        nicknameInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') startGame();
        });
      }
      if (prevBtn) prevBtn.addEventListener('click', prevRoom);
      if (nextBtn) nextBtn.addEventListener('click', nextRoom);
      if (resetBtn) resetBtn.addEventListener('click', resetGameProgress);
      if (restartBtn) {
        restartBtn.addEventListener('click', () => {
          localStorage.removeItem('s1fa_state_' + userIp);
          localStorage.removeItem('s1fa_latest_session');
          location.reload();
        });
      }
      if (qzSubmitBtn) qzSubmitBtn.addEventListener('click', checkSubjectiveAnswer);
      if (qzInput) {
        qzInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') checkSubjectiveAnswer();
        });
      }
      if (quizCloseBtn) quizCloseBtn.addEventListener('click', closeQuizModal);
      if (minigameCloseBtn) minigameCloseBtn.addEventListener('click', closeMiniGameModal);

      // 모달 바깥 및 ESC 누름 처리
      document.getElementById('quiz-modal').addEventListener('click', (e) => {
        if (e.target.id === 'quiz-modal') closeQuizModal();
      });
      document.getElementById('minigame-modal').addEventListener('click', (e) => {
        if (e.target.id === 'minigame-modal') closeMiniGameModal();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeQuizModal();
          closeMiniGameModal();
        }
      });

      // 3. 개체 클릭 이벤트
      document.getElementById('boss-npc').addEventListener('click', () => {
        setDialogue(roomData[currentRoom].welcomeMsg);
      });

      document.getElementById('door-obj').addEventListener('click', () => {
        nextRoom();
      });

      // 4. IP 세션 자동 복구 체크
      const savedState = loadGameState();
      if (savedState && savedState.playerNickname) {
        restoreGame(savedState);
      }
    });
  </script>
</body>
</html>
