<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#20242e">
<title>S1FA 방탈출 : 분석기술팀 탈출 대작전</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div id="app">

  <!-- ============ 1. 로그인 / 캐릭터 선택 ============ -->
  <section id="login-screen" class="screen">
    <div class="login-box">
      <div class="logo-plate">
        <div class="logo-sub">SAMSUNG · 분석기술팀</div>
        <h1 class="logo-title">S1FA 방탈출</h1>
        <div class="logo-tag">단서를 찾아 4개의 방을 탈출하라!</div>
      </div>

      <div class="panel">
        <div class="panel-label">1. 캐릭터 선택</div>
        <div id="avatar-picker" class="avatar-picker"></div>

        <div class="panel-label">2. 근무지</div>
        <div id="loc-picker" class="chip-row">
          <button class="chip is-on" data-loc="SR3">SR3</button>
          <button class="chip" data-loc="S1L">S1L</button>
        </div>

        <div class="panel-label">3. 이름</div>
        <input id="name-input" class="pk-input" type="text" maxlength="8" placeholder="이름을 입력하세요" autocomplete="off">

        <button id="join-btn" class="pk-btn pk-btn-main">▶ 대기실 입장</button>
        <button id="admin-login-btn" class="pk-btn pk-btn-ghost">👑 관리자 로그인</button>
      </div>

      <p class="login-note">※ 각 방 5분 · 총 4개 방 20분 · 기록은 서버에 저장되어 새로고침해도 이어집니다.</p>
    </div>
  </section>

  <!-- ============ 2. 게임 화면 ============ -->
  <section id="game-screen" class="screen hidden">

    <header id="hud">
      <div class="hud-row hud-row-1">
        <div id="hud-room" class="hud-chip hud-room">대기실</div>
        <div class="hud-spacer"></div>
        <div id="hud-clues" class="hud-chip hud-clues"></div>
        <div id="hud-score" class="hud-chip hud-score">0 P</div>
      </div>
      <div class="hud-row hud-row-2">
        <div id="hud-player" class="hud-chip hud-player">-</div>
        <div class="hud-spacer"></div>
        <div class="hud-chip hud-time">
          <span class="t-label">방</span><span id="hud-room-time" class="t-room">05:00</span>
          <span class="t-div">|</span>
          <span class="t-label">전체</span><span id="hud-total-time" class="t-total">20:00</span>
        </div>
        <button id="btn-board" class="hud-btn" title="순위표">🏆</button>
        <button id="btn-sound" class="hud-btn" title="사운드">🔊</button>
        <button id="btn-admin" class="hud-btn hud-btn-admin hidden" title="관리자 패널">👑</button>
        <button id="btn-logout" class="hud-btn" title="로그아웃">🚪</button>
      </div>
    </header>

    <div id="stage-wrap">
      <div id="stage">
        <canvas id="bg-canvas" width="240" height="160"></canvas>
        <div id="bg-image" class="bg-image hidden"></div>
        <div id="scene-title" class="scene-title"></div>
        <div id="prop-layer" class="layer"></div>
        <div id="actor-layer" class="layer"></div>
        <div id="fx-layer" class="layer"></div>
        <div id="stage-overlay" class="stage-overlay hidden"><div id="stage-overlay-text"></div></div>
      </div>
    </div>

    <div id="dialogue" class="dialogue">
      <div id="dialogue-speaker" class="dialogue-speaker hidden"></div>
      <p id="dialogue-text"></p>
      <span id="dialogue-arrow" class="dialogue-arrow">▼</span>
    </div>

  </section>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
</div>

<audio id="bgm" src="assets/img/battle.mp3" loop preload="none"></audio>

<script src="assets/js/fallback-db.js"></script>
<script src="assets/js/sprites.js"></script>
<script src="assets/js/pixel.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/net.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/puzzles.js"></script>
<script src="assets/js/game.js"></script>
<script src="assets/js/admin.js"></script>
<script src="assets/js/boot.js"></script>
</body>
</html>
