<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>S1FA PJT 방탈출 : 분석기술팀 신입사원의 칼퇴기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0; padding: 0;
      user-select: none;
      font-family: 'Galmuri9', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #fff;
      padding: 10px;
    }

    #game-container {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 4 / 3;
      background-color: #0b0f19;
      border: 3px solid #38bdf8;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 50px rgba(56, 189, 248, 0.25);
    }

    #top-nav {
      height: 10%;
      min-height: 44px;
      background: #1e293b;
      border-bottom: 2px solid #38bdf8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      z-index: 100;
    }

    #room-title { font-size: clamp(11px, 1.8vw, 15px); font-weight: bold; color: #38bdf8; }
    #user-stats { font-size: clamp(10px, 1.4vw, 13px); font-weight: bold; color: #facc15; background: #090d16; padding: 5px 10px; border: 1.5px solid #facc15; border-radius: 6px; }

    .nav-btn-group { display: flex; gap: 6px; }
    .nav-btn { background: #0f172a; color: #fff; border: 1.5px solid #38bdf8; padding: 5px 10px; font-size: 12px; font-weight: bold; cursor: pointer; border-radius: 6px; }
    .nav-btn:hover { background: #38bdf8; color: #0f172a; }

    #screen { 
      width: 100%; height: 68%; 
      position: relative; 
      background-color: #cbd5e1; 
      background-size: cover;
      background-position: bottom center;
      background-repeat: no-repeat;
      overflow: hidden; 
      image-rendering: pixelated;
    }
    
    #interactive-layer { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 40; }

    .interactive-zone {
      position: absolute;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 8px;
      transition: all 0.2s ease-in-out;
      border: 2px solid transparent;
    }
    
    .interactive-zone::before {
      content: '🔍';
      font-size: 24px;
      opacity: 0;
      transition: 0.2s;
      filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.8));
    }
    
    .interactive-zone:hover {
      background-color: rgba(56, 189, 248, 0.25);
      border: 2px dashed #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }
    
    .interactive-zone:hover::before {
      opacity: 1;
      transform: translateY(-5px);
    }

    .draggable-item { cursor: grab; z-index: 60 !important; touch-action: none; }
    .draggable-item:active { cursor: grabbing; }

    .pixel-npc { position: absolute; z-index: 50; display: flex; flex-direction: column; align-items: center; bottom: 8%; }
    #boss-npc { cursor: pointer; right: 22%; }
    #player-npc { pointer-events: none; left: 22%; }

    .door-tag {
      background: rgba(15, 23, 42, 0.95);
      color: #f8fafc;
      font-size: clamp(9px, 1.2vw, 11px);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #38bdf8;
      margin-top: 6px;
      white-space: nowrap;
      font-weight: bold;
    }

    #dialogue-box {
      width: 100%; height: 22%;
      background: #090d16;
      border-top: 2px solid #38bdf8;
      padding: 12px 20px;
      position: relative;
      display: flex; flex-direction: column; justify-content: space-between;
      z-index: 100;
    }
    #dialogue-text { font-size: clamp(11px, 1.8vw, 14px); line-height: 1.6; color: #f1f5f9; font-weight: bold; white-space: pre-line; }

    .modal-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 6, 23, 0.88); backdrop-filter: blur(6px);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 15px; z-index: 1000;
    }
    .modal-card { background: #0f172a; border: 2px solid #38bdf8; border-radius: 12px; width: 100%; max-width: 520px; padding: 22px; color: #fff; position: relative; }
    .modal-close-btn { position: absolute; top: 12px; right: 14px; background: #1e293b; color: #f87171; border: 1px solid #ef4444; border-radius: 6px; width: 28px; height: 28px; cursor: pointer; font-weight: bold; }

    .quiz-title { font-size: 15px; color: #38bdf8; margin-bottom: 10px; font-weight: bold; }
    .quiz-q { font-size: 13px; margin-bottom: 12px; line-height: 1.5; color: #f8fafc; font-weight: bold; }
    .quiz-hint { display: inline-block; background: #1e293b; color: #facc15; font-size: 11px; padding: 4px 8px; border-radius: 4px; border: 1px solid #facc15; margin-bottom: 12px; }
    .quiz-choice-list { display: flex; flex-direction: column; gap: 8px; }
    .quiz-choice-item { background: #1e293b; border: 1.5px solid #334155; padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; color: #f1f5f9; }
    .quiz-choice-item:hover { background: #2563eb; color: #fff; }
    .quiz-input-group { display: flex; gap: 8px; }
    .quiz-input { flex: 1; padding: 10px; font-size: 13px; background: #020617; border: 1.5px solid #38bdf8; border-radius: 6px; color: #fff; font-weight: bold; }
    .quiz-submit-btn { background: #2563eb; color: #fff; border: none; padding: 0 18px; font-size: 13px; font-weight: bold; cursor: pointer; border-radius: 6px; }
    .start-input { width: 100%; padding: 12px; font-size: 13px; background: #020617; border: 1.5px solid #38bdf8; border-radius: 6px; color: #fff; margin: 16px 0; font-weight: bold; }
    .start-btn { width: 100%; background: #2563eb; color: #fff; border: none; padding: 12px; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 6px; }

    .wire-port { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; display: inline-block; }
    .wire-red { background: #ef4444; } .wire-blue { background: #3b82f6; } .wire-yellow { background: #eab308; }
    .stain-spot { width: 44px; height: 44px; background: rgba(180, 83, 9, 0.85); border-radius: 50%; position: absolute; cursor: pointer; display: flex; justify-content: center; align-items: center; border: 2px dashed #facc15; }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="start-modal" class="modal-overlay">
      <div class="modal-card">
        <h2 style="font-size: 18px; color:#38bdf8; text-align:center; margin-bottom:12px;">🔬 분석기술팀 신입사원의 칼퇴기</h2>
        <p style="font-size: 12px; line-height: 1.6; color:#cbd5e1; text-align:center;">
          배경 이미지 속 숨겨진 단서를 탐색하여 미션을 완수하세요!<br>
          <span style="color:#ef4444;">[경고]</span> 오답 제출 시 <b>-2,000점</b> 감점!
        </p>
        <input type="text" id="nickname-input" class="start-input" placeholder="소속 / 이름 (예: EFA1 / 홍길동)..." maxlength="20">
        <button id="start-btn" class="start-btn">사무실 입장하기 ➔</button>
      </div>
    </div>

    <div id="top-nav">
      <div id="room-title">S1FA PJT : 1관 분석기술팀 EFA1 파트</div>
      <div id="user-stats">점수: 0점</div>
      <div class="nav-btn-group">
        <button id="prev-btn" class="nav-btn">◄ 이전관</button>
        <button id="next-btn" class="nav-btn">다음관 ►</button>
      </div>
    </div>

    <div id="screen">
      <!-- 👨‍💼 남성 파트장 캐릭터 (앞머리를 풍성하게 채워 이마 가림) -->
      <div class="pixel-npc" id="boss-npc">

          <path d="M14,24 C14,40 18,50 20,50 L44,50 C46,50 50,40 50,24 Z" fill="#1e293b"/>
          <rect x="16" y="24" width="32" height="26" rx="10" fill="#fde0c6" stroke="#000" stroke-width="2"/>
          <path d="M14,28 Q 32,38 50,28 L 48,16 Q 32,8 16,16 Z" fill="#0f172a" stroke="#000" stroke-width="1.5"/>
          <path d="M14,28 L22,34 L28,29 L36,35 L44,29 L50,28" fill="#0f172a" stroke="#000" stroke-width="1.5"/>
          <rect x="22" y="34" width="6" height="8" rx="2" fill="#000"/>
          <rect x="23" y="35" width="2" height="3" fill="#fff"/>
          <rect x="36" y="34" width="6" height="8" rx="2" fill="#000"/>
          <rect x="37" y="35" width="2" height="3" fill="#fff"/>
          <rect x="31" y="44" width="2" height="1" fill="#c08060"/>
          <path d="M 28,47 Q 32,49 36,47" stroke="#000" stroke-width="1.5" fill="none"/>
          <path d="M22,50 L42,50 L44,68 L20,68 Z" fill="#2563eb" stroke="#000" stroke-width="2"/>
          <line x1="22" y1="56" x2="42" y2="56" stroke="#1e3a8a" stroke-width="1"/>
          <line x1="22" y1="62" x2="44" y2="62" stroke="#1e3a8a" stroke-width="1"/>
          <line x1="28" y1="50" x2="28" y2="68" stroke="#1e3a8a" stroke-width="1"/>
          <line x1="36" y1="50" x2="36" y2="68" stroke="#1e3a8a" stroke-width="1"/>
          <path d="M20,50 L12,65 L16,68 L22,52 Z" fill="#2563eb" stroke="#000" stroke-width="1.5"/>
          <path d="M44,50 L52,65 L48,68 L42,52 Z" fill="#2563eb" stroke="#000" stroke-width="1.5"/>
          <circle cx="14" cy="68" r="3" fill="#fde0c6" stroke="#000" stroke-width="1"/>
          <circle cx="50" cy="68" r="3" fill="#fde0c6" stroke="#000" stroke-width="1"/>
          <rect x="22" y="68" width="8" height="18" fill="#1e3a8a" stroke="#000" stroke-width="2"/>
          <rect x="34" y="68" width="8" height="18" fill="#1e3a8a" stroke="#000" stroke-width="2"/>
          <rect x="20" y="86" width="12" height="6" fill="#fff" stroke="#000" stroke-width="1.5" rx="3"/>
          <rect x="32" y="86" width="12" height="6" fill="#fff" stroke="#000" stroke-width="1.5" rx="3"/>
        </svg>
        <div id="boss-tag" class="door-tag">김주헌 파트장님</div>
      </div>

      <!-- 👩‍💼 여성 신입 캐릭터 (앞머리 꽉 채움) -->
      <div class="pixel-npc" id="player-npc">
        <svg width="80" height="110" viewBox="0 0 64 96">
          <path d="M12,24 C8,45 14,52 20,54 L44,54 C50,52 56,45 52,24 Z" fill="#4a2e1b"/>
          <rect x="16" y="24" width="32" height="26" rx="10" fill="#fde0c6" stroke="#000" stroke-width="2"/>

          <path d="M12,28 L20,33 L26,29 L34,34 L42,29 L52,28" fill="#5c3a21" stroke="#000" stroke-width="1.5"/>
          <path d="M16,24 C16,36 12,42 18,46 C18,36 20,30 16,24 Z" fill="#5c3a21"/>
          <path d="M48,24 C48,36 52,42 46,46 C46,36 44,30 48,24 Z" fill="#5c3a21"/>
          <rect x="20" y="33" width="8" height="10" rx="3" fill="#000"/>
          <rect x="21" y="34" width="3" height="4" fill="#fff"/>
          <rect x="36" y="33" width="8" height="10" rx="3" fill="#000"/>
          <rect x="37" y="34" width="3" height="4" fill="#fff"/>
          <rect x="31" y="43" width="2" height="1" fill="#c08060"/>
          <path d="M 28,46 Q 32,48 36,46" stroke="#000" stroke-width="1.5" fill="none"/>
          <path d="M22,50 L42,50 L44,64 L20,64 Z" fill="#fff" stroke="#000" stroke-width="2"/>
          <polygon points="31,50 33,50 34,60 32,62 30,60" fill="#1e293b"/>
          <path d="M20,50 L14,60 L18,63 L22,52 Z" fill="#fde0c6" stroke="#000" stroke-width="1.5"/>
          <path d="M44,50 L50,60 L46,63 L42,52 Z" fill="#fde0c6" stroke="#000" stroke-width="1.5"/>
          <path d="M20,50 L16,56 L19,58 L22,50 Z" fill="#fff" stroke="#000" stroke-width="1.5"/>
          <path d="M44,50 L48,56 L45,58 L42,50 Z" fill="#fff" stroke="#000" stroke-width="1.5"/>
          <circle cx="16" cy="63" r="3" fill="#fde0c6" stroke="#000" stroke-width="1"/>
          <circle cx="48" cy="63" r="3" fill="#fde0c6" stroke="#000" stroke-width="1"/>
          <path d="M18,64 L46,64 L48,74 L16,74 Z" fill="#1e293b" stroke="#000" stroke-width="2"/>
          <rect x="22" y="74" width="6" height="12" fill="#fde0c6" stroke="#000" stroke-width="2"/>
          <rect x="36" y="74" width="6" height="12" fill="#fde0c6" stroke="#000" stroke-width="2"/>
          <rect x="22" y="80" width="6" height="6" fill="#fff" stroke="#000" stroke-width="1.5"/>
          <rect x="36" y="80" width="6" height="6" fill="#fff" stroke="#000" stroke-width="1.5"/>
          <rect x="20" y="86" width="10" height="6" fill="#1e293b" stroke="#000" stroke-width="1.5" rx="2"/>
          <rect x="34" y="86" width="10" height="6" fill="#1e293b" stroke="#000" stroke-width="1.5" rx="2"/>
        </svg>
        <div id="player-tag" class="door-tag">신입사원</div>
      </div>

      <div id="interactive-layer"></div>

      <!-- 다음 방 문 -->
      <div class="pixel-npc" id="door-obj" style="bottom: 8%; right: 4%;">
        <svg width="55" height="75" viewBox="0 0 55 75">
          <rect x="2" y="2" width="51" height="71" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" rx="4"/>
          <circle cx="42" cy="40" r="4" fill="#facc15"/>
        </svg>
        <div class="door-tag" id="door-label">🔒 다음 방</div>
      </div>
    </div>

    <div id="dialogue-box">
      <div id="dialogue-text">대사가 출력됩니다.</div>
    </div>

    <!-- 미니게임 / 퀴즈 모달 -->
    <div id="minigame-modal" class="modal-overlay" style="display:none;">
      <div class="modal-card">
        <button id="minigame-close-btn" class="modal-close-btn">✖</button>
        <div class="quiz-title" id="mg-title">🔧 특수 미션</div>
        <div id="mg-body" style="margin-top:10px; text-align:center;"></div>
      </div>
    </div>

    <div id="quiz-modal" class="modal-overlay" style="display:none;">
      <div class="modal-card">
        <button id="quiz-close-btn" class="modal-close-btn">✖</button>
        <div class="quiz-title" id="qz-title">📋 퀴즈</div>
        <div class="quiz-q" id="qz-question">질문</div>
        <div class="quiz-hint" id="qz-hint" style="display:none;">💡 힌트: </div>
        <div id="qz-choices-container" class="quiz-choice-list" style="display:none;"></div>
        <div id="qz-input-container" class="quiz-input-group" style="display:none;">
          <input type="text" id="qz-input" class="quiz-input" placeholder="정답을 입력하세요..." />
          <button id="qz-submit-btn" class="quiz-submit-btn">제출 ➔</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const questionBank = {
      1: {
        subjective: [
          { id: "r1_s1", title: "📝 1관: EFA1 이메일 규격", question: "김주헌 파트장님이 요청하신 이메일 제목 맨 앞 필수 대괄호 태그명은?", hint: "💡 힌트: 대괄호 안 프로젝트명 (예: S1FA PJT)", answers: ["S1FA PJT", "S1FAPJT"], successMsg: "김주헌 파트장님: 이메일 규격 숙지 확인!" },
          { id: "r1_s2", title: "📝 1관: 수납함 밑 비밀 메모", question: "수납함 밑에서 찾은 비밀 메모! EFA1 장비 신뢰성 테스트 목표 수치는?", hint: "💡 힌트: 백분율 수치 (예: 100% 또는 100)", answers: ["100%", "100", "99%"], successMsg: "김주헌 파트장님: 목표치 확인 완료!" }
        ],
        objective: [
          { id: "r1_o1", title: "☎️ 1관: 부재중 전화 응대", question: "파트장님 부재중일 때 외부 전화 응대로 올바른 것은?", choices: ["1. 담배 피우러 가셨는데요?", "2. 자리에 안 계시니 나중에 거세요.", "3. 잠시 자리를 비우셨습니다. 메모 남겨드릴까요?", "4. 몰라요."], answerIdx: 2, successMsg: "김주헌 파트장님: 완벽한 비즈니스 응대!" },
          { id: "r1_o2", title: "💻 1관: 이석 시 PC 보안", question: "퇴근전 이석 시 올바른 보안 조치는?", choices: ["1. 모니터만 끈다", "2. 화면 잠금(Win+L)을 누른다", "3. 메모장에 비번 노출", "4. 그냥 간다"], answerIdx: 1, successMsg: "김주헌 파트장님: 철저한 보안 통과!" }

          { id: "r2_s2", title: "🔌 2관: 서버 장애 복구", question: "케이블 연결 성공! 원인 분석을 위해 확보해야 하는 2글자 데이터는?", hint: "💡 힌트: ㄹㄱ 또는 log", answers: ["로그", "log", "LOG"], successMsg: "김진석 파트장님: 시스템 로그 확보 완료!" }

        objective: [

          { id: "r3_s1", title: "📝 3관: UX 검증", question: "사용자 직관성을 최우선하는 기획 개념의 2글자 영문 약어는?", hint: "💡 힌트: 사용자 경험 (영문 2글자)", answers: ["UX", "ux"], successMsg: "윤지혜 파트장님: UX 편의성이 최고죠!" },

        ],
        objective: [
          { id: "r3_o1", title: "🔬 3관: 정밀 시편 취급", question: "VSEM 분석용 정밀 시편 취급 수칙으로 올바른 것은?", choices: ["1. 맨손으로 만진다", "2. 전용 핀셋과 제어 장갑을 착용한다", "3. 서류 더미에 둔다", "4. 물로 씻는다"], answerIdx: 1, successMsg: "윤지혜 파트장님: 장비 수칙 통과!" }
        ]
      },
      4: {
        subjective: [
          { id: "r4_s1", title: "📝 4관: 최종 출하 점검", question: "프로젝트 최종 출하 전 데이터 백업과 함께 점검해야 하는 핵심 2글자 단어는?", hint: "💡 힌트: ㅂㅇ", answers: ["보안", "테스트"], successMsg: "손승준 PL님: 최종 점검 완료!" },
          { id: "r4_s2", title: "🔐 4관: 캔틴 금고 문서", question: "프로젝트 최종 승인자 권한을 가진 2글자 직책 영문 약어는?", hint: "💡 힌트: 프로젝트 리더", answers: ["PL", "pl"], successMsg: "손승준 PL님: 최종 승인권자 확인!" }
        ],
        objective: [
          { id: "r4_o1", title: "🚀 4관: 신입사원의 자세", question: "프로젝트 성공을 위해 가장 필요한 역량은?", choices: ["1. 독단적 처리", "2. 적극적 질문과 소통", "3. 눈치 야근", "4. 지각"], answerIdx: 1, successMsg: "손승준 PL님: 훌륭한 마음가짐입니다!" }
        ]
      }
    };

    let playerNickname = "EFA1 / 신입사원";
    let currentRoom = 1;
    let totalScore = 0;
    let activeQuizObj = null;
    let currentSlotKey = null;

    let roomSolved = { 1: { q1: false, q2: false, q3: false }, 2: { q1: false, q2: false, q3: false }, 3: { q1: false, q2: false, q3: false }, 4: { q1: false, q2: false, q3: false } };
    let assignedQuizzes = { 1: {}, 2: {}, 3: {}, 4: {} };

    /* 💡 1관 배경 파일명을 webp 형식으로 정확히 수정 완료 */
    const roomBgImages = {
      1: "./24618_2.webp",
      2: "./24645.webp",
      3: "./24646.jpg",
      4: "./24647.png"
    };

    const roomData = {
      1: { title: "S1FA PJT : 1관 분석기술팀 EFA1 파트", bossName: "김주헌 파트장님", welcomeMsg: "오피스 데스크와 수납함을 정돈해 두었네. 배경 화면 속 단서를 클릭해보게." },
      2: { title: "S1FA PJT : 2관 분석기술팀 EFA2 파트", bossName: "김진석 파트장님", welcomeMsg: "책상 위 타공판의 케이블을 복구하고 데스크를 점검하세요." },
      3: { title: "S1FA PJT : 3관 분석기술팀 PFA/VSEM 파트", bossName: "윤지혜 파트장님", welcomeMsg: "실험대 위 모니터를 확인하고 미션을 해결하세요." },
      4: { title: "S1FA PJT : 4관 분석기술팀 PL실", bossName: "손승준 PL님", welcomeMsg: "캔틴룸 테이블 쪽 단서를 찾아 비밀 금고를 여세요!" }
    };

    function generateQuizzes() {
      for (let r = 1; r <= 4; r++) {
        const bank = questionBank[r];
        assignedQuizzes[r] = {
          q1: bank.subjective[0],
          q2: bank.subjective[1] || bank.objective[0],
          q3: bank.objective[1] || bank.objective[0]
        };
      }
    }

    function renderRoomBackground(r) {
      const screenElem = document.getElementById('screen');
      screenElem.style.backgroundImage = `url('${roomBgImages[r]}')`;
      document.getElementById('boss-tag').innerText = roomData[r].bossName;
    }

    function renderInteractiveElements(r) {
      const layer = document.getElementById('interactive-layer');
      layer.innerHTML = '';

      if (r === 1) {
        layer.innerHTML = `
          <div id="elem-m1" class="interactive-zone" style="bottom: 50%; left: 30%; width: 120px; height: 90px;" title="모니터 화면 확인"></div>
          <div id="elem-secret-memo" class="interactive-zone" style="bottom: 40%; left: 52%; width: 60px; height: 60px; z-index:42;" title="숨겨진 메모"></div>
          <div id="elem-p1" class="interactive-zone" style="bottom: 45%; left: 68%; width: 70px; height: 50px;" title="업무 전화기"></div>
        `;
        document.getElementById('elem-m1').addEventListener('click', () => openQuizObj(assignedQuizzes[1].q1, 'q1'));
        document.getElementById('elem-secret-memo').addEventListener('click', () => openQuizObj(assignedQuizzes[1].q2, 'q2'));
        document.getElementById('elem-p1').addEventListener('click', () => openQuizObj(assignedQuizzes[1].q3, 'q3'));

      } else if (r === 2) {
        layer.innerHTML = `
          <div id="elem-m2" class="interactive-zone" style="bottom: 50%; left: 35%; width: 100px; height: 80px;" title="와이드 모니터"></div>
          <div id="elem-cable" class="interactive-zone" style="bottom: 45%; left: 50%; width: 70px; height: 50px;" title="단선 케이블 복구"></div>
          <div id="elem-p2" class="interactive-zone" style="bottom: 45%; left: 25%; width: 80px; height: 60px;" title="전화기"></div>
        `;
        document.getElementById('elem-m2').addEventListener('click', () => openQuizObj(assignedQuizzes[2].q1, 'q1'));
        document.getElementById('elem-cable').addEventListener('click', () => openWireMiniGame('q2'));
        document.getElementById('elem-p2').addEventListener('click', () => openQuizObj(assignedQuizzes[2].q3, 'q3'));

      } else if (r === 3) {
        layer.innerHTML = `
          <div id="elem-stain-mon" class="interactive-zone" style="bottom: 50%; left: 32%; width: 110px; height: 80px;" title="분석 모니터"></div>
          <div id="elem-m3" class="interactive-zone" style="bottom: 45%; left: 55%; width: 80px; height: 100px;" title="분석 장비"></div>
          <div id="elem-p3" class="interactive-zone" style="bottom: 45%; left: 20%; width: 70px; height: 50px;" title="전화기"></div>
        `;
        document.getElementById('elem-stain-mon').addEventListener('click', () => openStainMiniGame('q1'));
        document.getElementById('elem-m3').addEventListener('click', () => openQuizObj(assignedQuizzes[3].q2, 'q2'));
        document.getElementById('elem-p3').addEventListener('click', () => openQuizObj(assignedQuizzes[3].q3, 'q3'));

      } else if (r === 4) {
        layer.innerHTML = `
          <div id="elem-m4" class="interactive-zone" style="bottom: 52%; left: 35%; width: 100px; height: 70px;" title="수납장 단서"></div>
          <div id="elem-secret-safe" class="interactive-zone" style="bottom: 40%; left: 52%; width: 70px; height: 70px; z-index:42;" title="비밀 금고"></div>
          <div id="elem-p4" class="interactive-zone" style="bottom: 45%; left: 65%; width: 80px; height: 60px;" title="전화기"></div>
        `;
        document.getElementById('elem-m4').addEventListener('click', () => openQuizObj(assignedQuizzes[4].q1, 'q1'));
        document.getElementById('elem-secret-safe').addEventListener('click', () => openQuizObj(assignedQuizzes[4].q2, 'q2'));
        document.getElementById('elem-p4').addEventListener('click', () => openQuizObj(assignedQuizzes[4].q3, 'q3'));
      }

      updateDoorStatusUI();
    }

    function updateDoorStatusUI() {
      const door = document.getElementById('door-obj');
      const doorLabel = document.getElementById('door-label');
      const solved = roomSolved[currentRoom];

      if (solved.q1 && solved.q2 && solved.q3) {
        door.style.opacity = '1';
        doorLabel.innerText = currentRoom === 4 ? "🚪 최종 탈출!" : `🚪 ${currentRoom + 1}관 이동!`;
        doorLabel.style.background = '#22c55e';
      } else {
        door.style.opacity = '0.6';
        doorLabel.innerText = "🔒 다음 방";
        doorLabel.style.background = 'transparent';
      }
    }

    function openWireMiniGame(slotKey) {
      const mgTitle = document.getElementById('mg-title'), mgBody = document.getElementById('mg-body');
      mgTitle.innerText = "🔌 2관 미션: 케이블 선 연결";
      mgBody.innerHTML = `
        <p style="font-size:12px; color:#cbd5e1; margin-bottom:12px;">같은 색 단자를 클릭해 연결하세요!</p>
        <div style="display:flex; justify-content:space-around; align-items:center; background:#020617; padding:15px; border:2px solid #38bdf8; border-radius:8px;">
          <div class="wire-port wire-red" data-color="red"></div>
          <div class="wire-port wire-blue" data-color="blue"></div>
          <div style="font-size:12px; color:#facc15;">선택 대기...</div>
          <div class="wire-port wire-blue" data-color="blue"></div>
          <div class="wire-port wire-red" data-color="red"></div>
        </div>
      `;
      document.getElementById('minigame-modal').style.display = 'flex';

      let sel = null, count = 0;
      mgBody.querySelectorAll('.wire-port').forEach(p => {
        p.addEventListener('click', () => {
          const c = p.getAttribute('data-color');
          if (!sel) { sel = { c, elem: p }; p.style.transform = 'scale(1.2)'; }
          else {
            if (sel.elem !== p && sel.c === c) {
              p.style.opacity = '0.3'; sel.elem.style.opacity = '0.3';
              count++; sel = null;
              if (count >= 2) {
                setTimeout(() => {
                  document.getElementById('minigame-modal').style.display = 'none';
                  openQuizObj(assignedQuizzes[2][slotKey], slotKey);
                }, 300);
              }
            } else { sel.elem.style.transform = 'scale(1)'; sel = null; }
          }
        });
      });
    }

    function openStainMiniGame(slotKey) {
      const mgTitle = document.getElementById('mg-title'), mgBody = document.getElementById('mg-body');
      mgTitle.innerText = "🔍 3관 미션: 모니터 얼룩 닦기";
      mgBody.innerHTML = `
        <p style="font-size:12px; color:#cbd5e1; margin-bottom:12px;">화면 얼룩을 클릭해 정밀 단위를 확인하세요!</p>
        <div style="position:relative; width:100%; height:140px; background:#1e1b4b; border:2px solid #38bdf8; border-radius:8px; display:flex; justify-content:center; align-items:center;">
          <div style="font-size:13px; color:#38bdf8;">[ VSEM 정밀 단위 : nm ]</div>
          <div class="stain-spot" style="top:20px; left:50px;">🧹</div>
          <div class="stain-spot" style="top:70px; left:220px;">🧹</div>
        </div>
      `;
      document.getElementById('minigame-modal').style.display = 'flex';

      let count = 0;
      mgBody.querySelectorAll('.stain-spot').forEach(s => {
        s.addEventListener('click', () => {
          s.style.display = 'none'; count++;
          if (count >= 2) {
            setTimeout(() => {
              document.getElementById('minigame-modal').style.display = 'none';
              openQuizObj(assignedQuizzes[3][slotKey], slotKey);
            }, 300);
          }
        });
      });
    }

    function openQuizObj(qData, slotKey) {
      activeQuizObj = qData; currentSlotKey = slotKey;
      document.getElementById('qz-title').innerText = qData.title;
      document.getElementById('qz-question').innerText = qData.question;

      const hintElem = document.getElementById('qz-hint');
      const choicesContainer = document.getElementById('qz-choices-container');
      const inputContainer = document.getElementById('qz-input-container');

      choicesContainer.innerHTML = ''; document.getElementById('qz-input').value = '';

      if (qData.answers) {
        hintElem.style.display = 'inline-block'; hintElem.innerText = qData.hint;
        choicesContainer.style.display = 'none'; inputContainer.style.display = 'flex';
      } else {
        hintElem.style.display = 'none'; inputContainer.style.display = 'none';
        choicesContainer.style.display = 'flex';
        qData.choices.forEach((c, idx) => {
          const btn = document.createElement('div');
          btn.className = 'quiz-choice-item'; btn.innerText = c;
          btn.addEventListener('click', () => checkAnswer(idx));
          choicesContainer.appendChild(btn);
        });
      }
      document.getElementById('quiz-modal').style.display = 'flex';
    }

    function checkAnswer(chosenIdx) {
      if (chosenIdx === activeQuizObj.answerIdx) handleSuccess();
      else handleFail();
    }

    function checkSubjective() {
      const val = document.getElementById('qz-input').value.trim().toLowerCase().replace(/\s+/g, '');
      const ok = activeQuizObj.answers.some(a => a.toLowerCase().replace(/\s+/g, '') === val);
      if (ok) handleSuccess();
      else handleFail();
    }

    function handleSuccess() {
      totalScore += 1000;
      updateScoreUI();
      if (currentSlotKey) roomSolved[currentRoom][currentSlotKey] = true;
      setDialogue(`${activeQuizObj.successMsg}\n(+1,000점 획득! 현재 총점: ${totalScore}점)`);
      updateDoorStatusUI();
      document.getElementById('quiz-modal').style.display = 'none';
    }

    function handleFail() {
      totalScore = Math.max(0, totalScore - 2000);
      updateScoreUI();
      alert(`❌ 오답입니다! -2,000점 감점되었습니다. (현재 점수: ${totalScore}점)`);
    }

    function updateScoreUI() {
      document.getElementById('user-stats').innerText = `점수: ${totalScore}점 | ${playerNickname}`;
    }

    function setDialogue(txt) { document.getElementById('dialogue-text').innerText = txt; }

    function triggerRoomChange(toRoom) {
      currentRoom = toRoom;
      document.getElementById('room-title').innerText = roomData[toRoom].title;
      renderRoomBackground(toRoom);
      renderInteractiveElements(toRoom);
      setDialogue(roomData[toRoom].welcomeMsg);
    }

    document.addEventListener('DOMContentLoaded', () => {
      generateQuizzes();
      document.getElementById('start-btn').addEventListener('click', () => {
        const name = document.getElementById('nickname-input').value.trim();
        if (!name) return alert("이름을 입력하세요!");
        playerNickname = name;
        document.getElementById('start-modal').style.display = 'none';
        updateScoreUI();
        triggerRoomChange(1);
      });

      document.getElementById('prev-btn').addEventListener('click', () => { if (currentRoom > 1) triggerRoomChange(currentRoom - 1); });
      document.getElementById('next-btn').addEventListener('click', () => {
        const solved = roomSolved[currentRoom];
        if (!solved.q1 || !solved.q2 || !solved.q3) return alert("현재 방의 3개 미션을 모두 완료해야 이동할 수 있습니다!");
        if (currentRoom < 4) triggerRoomChange(currentRoom + 1);
        else alert(`🎉 모든 미션을 완수했습니다! 최종 점수: ${totalScore}점`);
      });

      document.getElementById('qz-submit-btn').addEventListener('click', checkSubjective);
      document.getElementById('quiz-close-btn').addEventListener('click', () => document.getElementById('quiz-modal').style.display = 'none');
      document.getElementById('minigame-close-btn').addEventListener('click', () => document.getElementById('minigame-modal').style.display = 'none');
    });
  </script>
</body>
</html>
