<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>S1FA PJT 방탈출 : 분석기술팀 신입사원의 칼퇴기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Galmuri9', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #fff;
      padding: 10px;
    }

    #game-container {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 4 / 3;
      background-color: #0b0f19;
      border: 3px solid #38bdf8;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 50px rgba(56, 189, 248, 0.25), inset 0 0 30px rgba(0,0,0,0.8);
    }

    /* 상단 내비게이션 바 */
    #top-nav {
      height: 10%;
      min-height: 44px;
      background: #1e293b;
      border-bottom: 2px solid #38bdf8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      z-index: 100;
    }

    #room-title {
      font-size: clamp(11px, 1.8vw, 15px);
      font-weight: bold;
      color: #38bdf8;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    #user-stats {
      font-size: clamp(10px, 1.4vw, 13px);
      font-weight: bold;
      color: #facc15;
      background: #090d16;
      padding: 5px 10px;
      border: 1.5px solid #facc15;
      border-radius: 6px;
      box-shadow: 0 0 8px rgba(250, 204, 21, 0.2);
    }

    .nav-btn-group { display: flex; gap: 6px; }

    .nav-btn {
      background: #0f172a;
      color: #fff;
      border: 1.5px solid #38bdf8;
      padding: 5px 10px;
      font-size: clamp(10px, 1.4vw, 12px);
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .nav-btn:hover { background: #38bdf8; color: #0f172a; }

    /* 메인 렌더링 화면 */
    #screen {
      width: 100%;
      height: 68%;
      position: relative;
      background-color: #020617;
      overflow: hidden;
    }

    #bg-svg {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
    }

    #interactive-layer {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
      z-index: 40;
    }

    .art-item {
      position: absolute;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .art-item:hover {
      transform: translateY(-4px) scale(1.04);
      filter: drop-shadow(0px 8px 12px rgba(56, 189, 248, 0.6));
    }

    .draggable-item {
      cursor: grab;
      z-index: 60 !important;
      touch-action: none;
    }

    .draggable-item:active { cursor: grabbing; }

    .pixel-npc {
      position: absolute;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #boss-npc { cursor: pointer; }
    #player-npc { pointer-events: none; }

    .door-tag {
      background: rgba(15, 23, 42, 0.95);
      color: #f8fafc;
      font-size: clamp(9px, 1.2vw, 11px);
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid #38bdf8;
      margin-top: 4px;
      white-space: nowrap;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    /* 하단 대사창 */
    #dialogue-box {
      width: 100%;
      height: 22%;
      background: #090d16;
      border-top: 2px solid #38bdf8;
      padding: 12px 20px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      z-index: 100;
    }

    #dialogue-text {
      font-size: clamp(11px, 1.8vw, 14px);
      line-height: 1.6;
      color: #f1f5f9;
      white-space: pre-line;
      font-weight: bold;
    }

    /* 모달 레이아웃 */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 6, 23, 0.88);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 15px;
      z-index: 1000;
    }

    .modal-card {
      background: #0f172a;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      padding: 22px;
      color: #fff;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .modal-close-btn {
      position: absolute;
      top: 12px; right: 14px;
      background: #1e293b;
      color: #f87171;
      border: 1px solid #ef4444;
      border-radius: 6px;
      width: 28px; height: 28px;
      font-size: 14px; font-weight: bold;
      cursor: pointer;
    }

    .quiz-title { font-size: clamp(13px, 2vw, 15px); color: #38bdf8; margin-bottom: 10px; font-weight: bold; }
    .quiz-q { font-size: clamp(11px, 1.7vw, 13px); margin-bottom: 12px; line-height: 1.5; color: #f8fafc; font-weight: bold; }
    .quiz-hint { display: inline-block; background: #1e293b; color: #facc15; font-size: 11px; padding: 4px 8px; border-radius: 4px; border: 1px solid #facc15; margin-bottom: 12px; }
    .quiz-choice-list { display: flex; flex-direction: column; gap: 8px; }
    .quiz-choice-item { background: #1e293b; border: 1.5px solid #334155; padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; color: #f1f5f9; transition: all 0.15s; }
    .quiz-choice-item:hover { background: #2563eb; border-color: #60a5fa; color: #fff; }
    .quiz-input-group { display: flex; gap: 8px; }
    .quiz-input { flex: 1; padding: 10px; font-size: 13px; background: #020617; border: 1.5px solid #38bdf8; border-radius: 6px; color: #fff; font-weight: bold; }
    .quiz-submit-btn { background: #2563eb; color: #fff; border: none; padding: 0 18px; font-size: 13px; font-weight: bold; cursor: pointer; border-radius: 6px; }
    .start-input { width: 100%; padding: 12px; font-size: 13px; background: #020617; border: 1.5px solid #38bdf8; border-radius: 6px; color: #fff; margin: 16px 0; font-weight: bold; }
    .start-btn { width: 100%; background: #2563eb; color: #fff; border: none; padding: 12px; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 6px; }

    .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11px; }
    .leaderboard-table th, .leaderboard-table td { border: 1px solid #334155; padding: 6px; text-align: center; }
    .leaderboard-table th { background: #1e293b; color: #38bdf8; }
    .leaderboard-table td { background: #020617; }

    .wire-port { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; display: inline-block; box-shadow: 0 0 8px rgba(255,255,255,0.3); }
    .wire-red { background: #ef4444; } .wire-blue { background: #3b82f6; } .wire-yellow { background: #eab308; }
    .stain-spot { width: 44px; height: 44px; background: rgba(180, 83, 9, 0.85); border-radius: 50%; position: absolute; cursor: pointer; display: flex; justify-content: center; align-items: center; border: 2px dashed #facc15; }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- 시작 모달 -->
    <div id="start-modal" class="modal-overlay">
      <div class="modal-card">
        <h2 style="font-size: 18px; color:#38bdf8; text-align:center; margin-bottom:12px;">🔬 분석기술팀 신입사원의 칼퇴기</h2>
        <p style="font-size: 12px; line-height: 1.6; color:#cbd5e1; text-align:center;">
          각 파트의 고급 분석 장비와 서류 단서를 탐색하여 4개관 미션을 완수하세요!<br>
          <span style="color:#ef4444;">[경고]</span> 오답 제출 시 <b>-2,000점</b>이 차감됩니다!
        </p>
        <input type="text" id="nickname-input" class="start-input" placeholder="소속 파트명 / 이름 (예: EFA1 / 홍길동)..." maxlength="20">
        <button id="start-btn" class="start-btn">사무실 입장하기 ➔</button>
      </div>
    </div>

    <!-- 상단 내비게이션 바 -->
    <div id="top-nav">
      <div id="room-title">S1FA PJT : 1관 분석기술팀 EFA1 파트</div>
      <div id="user-stats">점수: 0점</div>
      <div class="nav-btn-group">
        <button id="prev-btn" class="nav-btn">◄ 이전관</button>
        <button id="next-btn" class="nav-btn">다음관 ►</button>
        <button id="reset-btn" class="nav-btn" style="border-color:#ef4444; color:#f87171;">🔄 초기화</button>
      </div>
    </div>

    <!-- 메인 아트 화면 -->
    <div id="screen">
      <svg id="bg-svg" viewBox="0 0 800 500" preserveAspectRatio="none"></svg>

      <!-- NPC & Player -->
      <div class="pixel-npc" id="boss-npc" style="top: 35%; left: 74%;">
        <svg id="boss-svg" width="60" height="90" viewBox="0 0 60 90"></svg>
        <div id="boss-tag" class="door-tag">김주헌 파트장님</div>
      </div>

      <div class="pixel-npc" id="player-npc" style="top: 35%; left: 14%;">
        <svg width="60" height="90" viewBox="0 0 60 90">
          <circle cx="30" cy="22" r="14" fill="#fde047"/>
          <path d="M 18,12 Q 30,2 42,12 Q 42,22 18,12" fill="#0f172a"/>
          <rect x="22" y="22" width="4" height="4" fill="#0f172a"/><rect x="34" y="22" width="4" height="4" fill="#0f172a"/>
          <path d="M 25,30 Q 30,34 35,30" stroke="#0f172a" stroke-width="2" fill="none"/>
          <path d="M 12,38 L 48,38 L 42,75 L 18,75 Z" fill="#2563eb"/>
          <polygon points="27,38 33,38 31,58 29,58" fill="#ffffff"/>
          <rect x="20" y="75" width="8" height="12" fill="#1e3a8a"/>
          <rect x="32" y="75" width="8" height="12" fill="#1e3a8a"/>
        </svg>
        <div id="player-tag" class="door-tag">신입사원</div>
      </div>

      <!-- 동적 인터랙티브 사물 레이어 -->
      <div id="interactive-layer"></div>

      <!-- 출입문 -->
      <div class="pixel-npc" id="door-obj" style="top: 6%; right: 3%; opacity: 0.6;">
        <svg width="50" height="70" viewBox="0 0 50 70">
          <rect x="2" y="2" width="46" height="66" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="4"/>
          <circle cx="40" cy="38" r="3" fill="#facc15"/>
          <line x1="12" y1="15" x2="38" y2="15" stroke="#334155" stroke-width="2"/>
        </svg>
        <div class="door-tag" id="door-label">🔒 다음 방</div>
      </div>
    </div>

    <!-- 하단 대사창 -->
    <div id="dialogue-box">
      <div id="dialogue-text">대사가 출력됩니다.</div>
    </div>

    <!-- 미니게임 모달 -->
    <div id="minigame-modal" class="modal-overlay" style="display:none;">
      <div class="modal-card">
        <button id="minigame-close-btn" class="modal-close-btn">✖</button>
        <div class="quiz-title" id="mg-title">🔧 특수 미션</div>
        <div id="mg-body" style="margin-top:10px; text-align:center;"></div>
      </div>
    </div>

    <!-- 퀴즈 모달 -->
    <div id="quiz-modal" class="modal-overlay" style="display:none;">
      <div class="modal-card">
        <button id="quiz-close-btn" class="modal-close-btn">✖</button>
        <div class="quiz-title" id="qz-title">📋 퀴즈</div>
        <div class="quiz-q" id="qz-question">질문</div>
        <div class="quiz-hint" id="qz-hint" style="display:none;">💡 힌트: </div>
        
        <div id="qz-choices-container" class="quiz-choice-list" style="display:none;"></div>

        <div id="qz-input-container" class="quiz-input-group" style="display:none;">
          <input type="text" id="qz-input" class="quiz-input" placeholder="정답을 입력하세요..." />
          <button id="qz-submit-btn" class="quiz-submit-btn">제출 ➔</button>
        </div>
      </div>
    </div>

    <!-- 엔딩 모달 -->
    <div id="ending-modal" class="modal-overlay" style="display:none;">
      <div class="modal-card" style="text-align: center;">
        <h2 style="font-size:18px; color:#4ade80; margin-bottom:8px;">🎉 12개 미션 완수! 칼퇴 성공!</h2>
        <p id="final-summary" style="font-size:12px; font-weight:bold; margin-bottom:12px; color:#cbd5e1;"></p>
        
        <h3 style="font-size:13px; text-align:left; margin-top:10px; color:#38bdf8;">🏆 분석기술팀 랭킹 순위표</h3>
        <div style="max-height: 160px; overflow-y: auto; margin-bottom: 14px;">
          <table class="leaderboard-table">
            <thead>
              <tr>
                <th>순위</th>
                <th>파트 / 이름</th>
                <th>점수</th>
                <th>소요시간</th>
              </tr>
            </thead>
            <tbody id="leaderboard-body"></tbody>
          </table>
        </div>
        <button id="restart-btn" class="start-btn">다시 도전하기 🔄</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================
       [문제은행 데이터 베이스]
    ========================================== */
    const questionBank = {
      1: {

          {
            id: "r1_s1",

            hint: "💡 힌트: 백분율 수치 (예: 100% 또는 100)",
            answers: ["100%", "100", "99%", "99"],
            successMsg: "김주헌 파트장님: 비밀 메모의 핵심 목표치를 정확히 입력했군!"

        ],
        objective: [
          {

    function generateAssignedQuizzes() {
      for (let room = 1; room <= 4; room++) {
        const bank = questionBank[room];
        const randomSubj = bank.subjective[Math.floor(Math.random() * bank.subjective.length)];
        const shuffledObj = [...bank.objective].sort(() => 0.5 - Math.random());
        assignedQuizzes[room] = { q1: randomSubj, q2: shuffledObj[0], q3: shuffledObj[1] };
      }
    }

    async function fetchUserIp() {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2000);
        const res = await fetch('https://api.ipify.org?format=json', { signal: controller.signal });
        clearTimeout(timeoutId);
        const data = await res.json();
        if (data && data.ip) userIp = data.ip.replace(/[^a-zA-Z0-9]/g, "_");
      } catch (e) {
        userIp = "local_browser_session";
      }
    }

    function saveGameState() {
      const state = { userIp, playerNickname, currentRoom, totalScore, gameStartTime, roomSolved, assignedQuizzes, lastUpdated: Date.now() };
      localStorage.setItem('s1fa_state_' + userIp, JSON.stringify(state));
      localStorage.setItem('s1fa_latest_session', JSON.stringify(state));
    }

    function loadGameState() {
      let saved = localStorage.getItem('s1fa_state_' + userIp) || localStorage.getItem('s1fa_latest_session');
      if (saved) { try { return JSON.parse(saved); } catch (e) { return null; } }
      return null;
    }

    function resetGameProgress() {
      if (confirm("정말로 모든 진행 상황을 초기화하고 새로운 문제지를 받아 다시 시작하시겠습니까?")) {
        localStorage.removeItem('s1fa_state_' + userIp);
        localStorage.removeItem('s1fa_latest_session');
        location.reload();
      }
    }

    function startGame() {
      const input = document.getElementById('nickname-input').value.trim();
      if (!input) { alert("소속 파트명과 이름을 입력해 주세요!\n(예: EFA1 / 홍길동)"); return; }
      playerNickname = input;
      gameStartTime = Date.now();
      generateAssignedQuizzes();

      document.getElementById('player-tag').innerText = playerNickname;
      document.getElementById('start-modal').style.display = 'none';

      saveGameState();
      updateScoreUI();
      renderRoomBackground(1);
      renderInteractiveElements(1);
      setDialogue(roomData[1].welcomeMsg);
    }

    function restoreGame(savedState) {
      playerNickname = savedState.playerNickname || "EFA1 / 신입사원";
      currentRoom = savedState.currentRoom || 1;
      totalScore = savedState.totalScore || 0;
      gameStartTime = savedState.gameStartTime || Date.now();
      roomSolved = savedState.roomSolved || roomSolved;
      assignedQuizzes = savedState.assignedQuizzes || assignedQuizzes;

      document.getElementById('player-tag').innerText = playerNickname;
      document.getElementById('start-modal').style.display = 'none';

      updateScoreUI();
      triggerRoomChange(currentRoom);
      setDialogue(`[진행 상황 복구 완료]\n${playerNickname} 님, 이전 접속 위치(${currentRoom}관)에서 이어서 진행합니다!`);
    }

    function calculateQuizScore(timeTakenMs) {
      const timeInSec = timeTakenMs / 1000;
      return Math.max(300, Math.round(10000 - (timeInSec * 145)));
    }

    function makeElementDraggable(elem, onMovedCallback) {
      if (!elem) return;
      let isDragging = false, startX, startY, initialLeft, initialTop;

      const onMouseDown = (e) => {
        isDragging = true;
        const event = e.touches ? e.touches[0] : e;
        startX = event.clientX; startY = event.clientY;
        initialLeft = elem.offsetLeft; initialTop = elem.offsetTop;
      };

      const onMouseMove = (e) => {
        if (!isDragging) return;
        const event = e.touches ? e.touches[0] : e;
        const dx = event.clientX - startX;
        const dy = event.clientY - startY;
        elem.style.left = (initialLeft + dx) + 'px';
        elem.style.top = (initialTop + dy) + 'px';

        if (Math.abs(dx) > 25 || Math.abs(dy) > 25) {
          if (onMovedCallback) { onMovedCallback(); onMovedCallback = null; }
        }
      };

      const onMouseUp = () => { isDragging = false; };

      elem.addEventListener('mousedown', onMouseDown);
      elem.addEventListener('touchstart', onMouseDown);
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('touchmove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
      window.addEventListener('touchend', onMouseUp);
    }

      }
    }

    function openWireMiniGame(slotKey) {
      wireSelectedPort = null; wireConnectedCount = 0;
      const mgTitle = document.getElementById('mg-title');
      const mgBody = document.getElementById('mg-body');
      mgTitle.innerText = "🔌 2관 미션: 서버 전용 케이블 선 연결하기";

          <span style="color:#facc15;">(경고: 서버와 무관한 일반 LAN선 함정이 있습니다)</span>

          <div style="display:flex; flex-direction:column; gap:14px;">

            <div class="wire-port wire-red" data-color="red" data-id="right-red"></div>
            <div class="wire-port wire-yellow" data-color="yellow" data-id="right-yellow"></div>
          </div>
        </div>
      `;

      document.getElementById('minigame-modal').style.display = 'flex';

      const ports = mgBody.querySelectorAll('.wire-port');
      ports.forEach(port => {
        port.addEventListener('click', () => {
          const color = port.getAttribute('data-color');
          const id = port.getAttribute('data-id');

          if (color === 'yellow') {
            alert("⚠️ 노란색 케이블은 서버 복구와 상관없는 일반 LAN선입니다!");
            if (wireSelectedPort) wireSelectedPort.elem.style.transform = "scale(1)";
            wireSelectedPort = null;
            document.getElementById('wire-status-text').innerText = "케이블 선택 대기...";
            return;
          }

          if (!wireSelectedPort) {
            wireSelectedPort = { color, id, elem: port };
            port.style.transform = "scale(1.2)";
            document.getElementById('wire-status-text').innerText = `${color === 'red' ? '빨간색' : '파란색'} 연결 대기 중...`;
          } else {
            if (wireSelectedPort.id === id) return;

            if (wireSelectedPort.color === color) {
              port.style.opacity = "0.3";
              wireSelectedPort.elem.style.opacity = "0.3";
              wireConnectedCount++;
              wireSelectedPort = null;
              document.getElementById('wire-status-text').innerText = "⚡ 서버 케이블 연결 성공!";

              if (wireConnectedCount >= 2) {
                setTimeout(() => {
                  closeMiniGameModal();
                  openQuizObj(assignedQuizzes[2][slotKey], slotKey);

            } else {

              wireSelectedPort = null;
              document.getElementById('wire-status-text').innerText = "케이블 선택 대기...";
            }
          }
        });
      });
    }

      const mgTitle = document.getElementById('mg-title');
      const mgBody = document.getElementById('mg-body');
      mgTitle.innerText = "🔍 3관 미션: 모니터 얼룩 닦아내기";

      mgBody.innerHTML = `
        <p style="font-size:12px; color:#cbd5e1; margin-bottom:12px;">
          화면을 가리고 있는 얼룩들을 클릭해 깨끗이 닦아내세요!
        </p>
        <div style="position:relative; width:100%; height:160px; background:#1e1b4b; border:2px solid #38bdf8; border-radius:8px; display:flex; justify-content:center; align-items:center;">
          <div style="font-size:13px; font-weight:bold; color:#38bdf8; text-align:center;">
            [ VSEM 정밀 측정 결과 ]<br>
            <span style="font-size:10px; color:#fde047;">(진짜 얼룩 뒤에 단위 단서가 숨어 있습니다)</span>
          </div>
          <div class="stain-spot" data-real="true" style="top:20px; left:40px;">🧹</div>
          <div class="stain-spot" data-real="true" style="top:90px; left:200px;">🧹</div>
          <div class="stain-spot" data-real="false" style="top:35px; left:350px; background:rgba(225, 29, 72, 0.85);">🐈</div>
        </div>
      `;

      document.getElementById('minigame-modal').style.display = 'flex';

      const spots = mgBody.querySelectorAll('.stain-spot');
      spots.forEach(spot => {
        spot.addEventListener('click', () => {
          const isReal = spot.getAttribute('data-real') === 'true';
          spot.style.display = 'none';

          if (!isReal) {
            alert("🐈 이것은 윤지혜 파트장님이 붙여둔 귀여운 고양이 스티커였습니다!");
          } else {
            stainCleanedCount++;
            if (stainCleanedCount >= 2) {
              setTimeout(() => {
                closeMiniGameModal();
                openQuizObj(assignedQuizzes[3][slotKey], slotKey);
              }, 300);
            }
          }
        });
      });
    }

    function closeMiniGameModal() { document.getElementById('minigame-modal').style.display = 'none'; }

    function openQuizObj(qData, slotKey) {
      activeQuizObj = qData; currentSlotKey = slotKey; quizStartTime = Date.now();

      document.getElementById('qz-title').innerText = qData.title;
      document.getElementById('qz-question').innerText = qData.question;
      
      const hintElem = document.getElementById('qz-hint');
      const choicesContainer = document.getElementById('qz-choices-container');
      const inputContainer = document.getElementById('qz-input-container');

      choicesContainer.innerHTML = '';
      document.getElementById('qz-input').value = '';

      if (qData.answers) {
        hintElem.style.display = 'inline-block';
        hintElem.innerText = qData.hint;
        choicesContainer.style.display = 'none';
        inputContainer.style.display = 'flex';
        setTimeout(() => document.getElementById('qz-input').focus(), 100);
      } else {
        hintElem.style.display = 'none';
        inputContainer.style.display = 'none';
        choicesContainer.style.display = 'flex';

        qData.choices.forEach((choiceText, idx) => {
          const btn = document.createElement('div');
          btn.className = 'quiz-choice-item';
          btn.innerText = choiceText;
          btn.addEventListener('click', (e) => { e.stopPropagation(); checkObjectiveAnswer(idx); });
          choicesContainer.appendChild(btn);
        });
      }

      document.getElementById('quiz-modal').style.display = 'flex';
    }

    function closeQuizModal() {
      document.getElementById('quiz-modal').style.display = 'none';
      activeQuizObj = null; currentSlotKey = null;
    }

    function checkSubjectiveAnswer() {
      if (!activeQuizObj) return;
      const input = document.getElementById('qz-input');
      const userAns = input.value.trim().toLowerCase().replace(/\s+/g, '');
      if (!userAns) { alert("정답을 입력해 주세요!"); return; }

      const isCorrect = activeQuizObj.answers.some(ans => ans.toLowerCase().replace(/\s+/g, '') === userAns);
      if (isCorrect) handleQuizSuccess(activeQuizObj);
      else { handleQuizFailure(); input.value = ''; input.focus(); }
    }

    function checkObjectiveAnswer(chosenIdx) {
      if (!activeQuizObj) return;
      if (chosenIdx === activeQuizObj.answerIdx) handleQuizSuccess(activeQuizObj);
      else handleQuizFailure();
    }

    function handleQuizSuccess(qData) {
      const timeTakenMs = Date.now() - quizStartTime;
      const earnedScore = calculateQuizScore(timeTakenMs);
      totalScore += earnedScore;
      updateScoreUI();

      if (currentSlotKey) roomSolved[currentRoom][currentSlotKey] = true;
      setDialogue(`${qData.successMsg}\n(+${earnedScore.toLocaleString()}점 획득! 현재 총점: ${totalScore.toLocaleString()}점)`);
      
      saveGameState();
      updateDoorStatusUI();
      closeQuizModal();
    }

    function handleQuizFailure() {
      const penalty = 2000;
      totalScore = Math.max(0, totalScore - penalty);
      updateScoreUI();
      saveGameState();
      alert(`❌ 오답입니다! 2,000점이 감점되었습니다.\n(현재 점수: ${totalScore.toLocaleString()}점) 신중하게 맞춰보세요!`);
    }

    function nextRoom() {
      const currentSolved = roomSolved[currentRoom];
      if (!currentSolved.q1 || !currentSolved.q2 || !currentSolved.q3) {
        alert("현재 관의 3개 미션을 모두 해결해야 다음 방으로 넘어갈 수 있습니다!");
        return;
      }
      if (currentRoom < 4) triggerRoomChange(currentRoom + 1);
      else showEnding();
    }

    function prevRoom() { if (currentRoom > 1) triggerRoomChange(currentRoom - 1); }

    function triggerRoomChange(toRoom) {
      currentRoom = toRoom;
      document.getElementById('room-title').innerText = roomData[toRoom].title;
      renderRoomBackground(toRoom);
      renderInteractiveElements(toRoom);
      setDialogue(roomData[toRoom].welcomeMsg);
      saveGameState();
    }

    function showEnding() {
      const totalTimeSec = Math.round((Date.now() - gameStartTime) / 1000);
      const minutes = Math.floor(totalTimeSec / 60);
      const seconds = totalTimeSec % 60;
      const timeStr = `${minutes}분 ${seconds}초`;

      document.getElementById('final-summary').innerHTML = `
        참여자: <b>${playerNickname}</b><br>
        최종 점수: <span style="color:#facc15; font-size:16px;">${totalScore.toLocaleString()}점</span><br>
        총 소요시간: <b>${timeStr}</b>
      `;

      saveScoreRecord(playerNickname, totalScore, timeStr);
      renderLeaderboard();
      document.getElementById('ending-modal').style.display = 'flex';
    }

    function saveScoreRecord(name, score, timeStr) {
      let records = JSON.parse(localStorage.getItem('s1fa_leaderboard') || '[]');
      records.push({ name, score, timeStr, timestamp: Date.now() });
      records.sort((a, b) => b.score - a.score);
      localStorage.setItem('s1fa_leaderboard', JSON.stringify(records));
    }

    function renderLeaderboard() {
      let records = JSON.parse(localStorage.getItem('s1fa_leaderboard') || '[]');
      const tbody = document.getElementById('leaderboard-body');
      tbody.innerHTML = '';

      records.forEach((rec, idx) => {
        const tr = document.createElement('tr');
        if (rec.name === playerNickname && rec.score === totalScore) tr.style.background = '#1e3a8a';
        tr.innerHTML = `
          <td><b>${idx + 1}위</b></td>
          <td>${rec.name}</td>
          <td><b style="color:#facc15;">${rec.score.toLocaleString()}</b></td>
          <td>${rec.timeStr}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    /* 초기화 및 바인딩 */
    document.addEventListener('DOMContentLoaded', async () => {
      await fetchUserIp();

      const startBtn = document.getElementById('start-btn');
      const nicknameInput = document.getElementById('nickname-input');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      const resetBtn = document.getElementById('reset-btn');
      const restartBtn = document.getElementById('restart-btn');
      const qzSubmitBtn = document.getElementById('qz-submit-btn');
      const qzInput = document.getElementById('qz-input');
      const quizCloseBtn = document.getElementById('quiz-close-btn');
      const minigameCloseBtn = document.getElementById('minigame-close-btn');

      if (startBtn) startBtn.addEventListener('click', startGame);
      if (nicknameInput) nicknameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') startGame(); });
      if (prevBtn) prevBtn.addEventListener('click', prevRoom);
      if (nextBtn) nextBtn.addEventListener('click', nextRoom);
      if (resetBtn) resetBtn.addEventListener('click', resetGameProgress);
      if (restartBtn) restartBtn.addEventListener('click', () => {
        localStorage.removeItem('s1fa_state_' + userIp);
        localStorage.removeItem('s1fa_latest_session');
        location.reload();
      });
      if (qzSubmitBtn) qzSubmitBtn.addEventListener('click', checkSubjectiveAnswer);
      if (qzInput) qzInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') checkSubjectiveAnswer(); });
      if (quizCloseBtn) quizCloseBtn.addEventListener('click', closeQuizModal);
      if (minigameCloseBtn) minigameCloseBtn.addEventListener('click', closeMiniGameModal);

      document.getElementById('quiz-modal').addEventListener('click', (e) => { if (e.target.id === 'quiz-modal') closeQuizModal(); });
      document.getElementById('minigame-modal').addEventListener('click', (e) => { if (e.target.id === 'minigame-modal') closeMiniGameModal(); });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { closeQuizModal(); closeMiniGameModal(); }
      });

      document.getElementById('boss-npc').addEventListener('click', () => {
        setDialogue(roomData[currentRoom].welcomeMsg);
      });

      document.getElementById('door-obj').addEventListener('click', () => { nextRoom(); });

      const savedState = loadGameState();
      if (savedState && savedState.playerNickname) restoreGame(savedState);
    });
  </script>
</body>
</html>
