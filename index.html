<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>칼퇴 픽셀 로드 : 신입사원의 탈출기</title>
  <!-- 갈무리 픽셀 폰트 로드 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Galmuri9', monospace;
    }

    body {
      background-color: #1a1a24;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #fff;
    }

    /* 게임 메인 프레임 */
    #game-container {
      width: 640px;
      height: 480px;
      background-color: #2b2b36;
      border: 6px solid #4a4a5a;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    /* 상단 오피스 화면 */
    #screen {
      width: 100%;
      height: 320px;
      position: relative;
      background-size: cover;
      background-position: center;
    }

    .office-bg-1 {
      background: #3a3d52;
      background-image: 
        radial-gradient(#4a4d66 15%, transparent 16%),
        radial-gradient(#4a4d66 15%, transparent 16%);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
    }

    .office-bg-2 {
      background: #4d3a52;
      background-image: 
        radial-gradient(#664a66 15%, transparent 16%),
        radial-gradient(#664a66 15%, transparent 16%);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
    }

    /* 룸 타이틀 배지 */
    #room-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #fff;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 14px;
      color: #ffd700;
      z-index: 10;
    }

    /* 픽셀 오브젝트 (클릭 영역 최상위 설정) */
    .pixel-object {
      position: absolute;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.1s;
      z-index: 20;
    }

    .pixel-object:hover {
      transform: scale(1.15);
    }

    .pixel-object:active {
      transform: scale(0.95);
    }

    .pixel-sprite {
      font-size: 42px;
      filter: drop-shadow(2px 4px 0px rgba(0,0,0,0.5));
    }

    .obj-label {
      background: #000;
      color: #fff;
      font-size: 11px;
      padding: 3px 6px;
      border-radius: 4px;
      margin-top: 2px;
      border: 1px solid #aaa;
      white-space: nowrap;
    }

    /* 오브젝트 좌표 */
    #boss-npc { top: 50px; left: 270px; }
    #memo-obj { top: 160px; left: 80px; }
    #phone-obj { top: 160px; right: 80px; }
    #door-obj { top: 20px; right: 30px; }

    /* 하단 포켓몬스타일 대사창 */
    #dialogue-box {
      width: 100%;
      height: 160px;
      background: #f8f8f8;
      border-top: 6px solid #2b2b36;
      padding: 16px 20px;
      position: relative;
      color: #222;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
    }

    #dialogue-frame {
      position: absolute;
      top: 6px; left: 6px; right: 6px; bottom: 6px;
      border: 4px solid #383838;
      border-radius: 6px;
      pointer-events: none;
    }

    #speaker-name {
      font-size: 14px;
      color: #d32f2f;
      font-weight: bold;
      margin-bottom: 4px;
    }

    #dialogue-text {
      font-size: 15px;
      line-height: 1.4;
      color: #111;
      height: 55px;
      white-space: pre-line;
    }

    /* 선택지 버튼 */
    #options-container {
      display: flex;
      gap: 10px;
      z-index: 30;
    }

    .opt-btn {
      flex: 1;
      background: #fff;
      border: 2px solid #333;
      padding: 8px;
      font-size: 13px;
      cursor: pointer;
      border-radius: 4px;
      box-shadow: 2px 2px 0px #333;
      text-align: center;
      color: #222;
    }

    .opt-btn:hover {
      background: #ffe082;
    }

    /* 퀴즈 모달 팝업 */
    #quiz-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }

    .quiz-card {
      background: #f8f8f8;
      border: 4px solid #000;
      border-radius: 8px;
      width: 100%;
      max-width: 500px;
      padding: 20px;
      color: #111;
    }

    .quiz-title {
      font-size: 16px;
      color: #1976d2;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .quiz-q {
      font-size: 14px;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .quiz-choice {
      background: #fff;
      border: 2px solid #555;
      padding: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      font-size: 13px;
      border-radius: 4px;
    }

    .quiz-choice:hover {
      background: #e3f2fd;
      border-color: #1976d2;
    }

    /* 화면 암전 트랜지션 레이어 */
    #overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #000;
      opacity: 0;
      display: none;
      z-index: 200;
      pointer-events: none;
      transition: opacity 0.4s;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="overlay"></div>

    <div id="room-badge">📍 1관: 영업부 사무실</div>

    <div id="screen" class="office-bg-1">
      <!-- 직접 onclick을 부여하여 이벤트 바인딩 보장 -->
      <div class="pixel-object" id="boss-npc" ON-CLICK="clickBoss()">
        <div class="pixel-sprite">👨‍💼</div>
        <div class="obj-label">김부장님</div>
      </div>

      <div class="pixel-object" id="memo-obj" ON-CLICK="clickMemo()">
        <div class="pixel-sprite">📝</div>
        <div class="obj-label">책상 메모 [퀴즈1]</div>
      </div>

      <div class="pixel-object" id="phone-obj" ON-CLICK="clickPhone()">
        <div class="pixel-sprite">☎️</div>
        <div class="obj-label">사무실 전화 [퀴즈2]</div>
      </div>

      <div class="pixel-object" id="door-obj" ON-CLICK="clickDoor()" style="opacity: 0.5;">
        <div class="pixel-sprite">🚪</div>
        <div class="obj-label" id="door-label">🔒 다음 사무실</div>
      </div>
    </div>

    <!-- 하단 대사창 -->
    <div id="dialogue-box">
      <div id="dialogue-frame"></div>
      <div>
        <div id="speaker-name">신입사원 (나)</div>
        <div id="dialogue-text">오늘도 무사히 칼퇴할 수 있을까...? 책상 메모와 전화기를 조사해 보자.</div>
      </div>
      <div id="options-container"></div>
    </div>

    <!-- 퀴즈 모달 -->
    <div id="quiz-modal">
      <div class="quiz-card">
        <div class="quiz-title" id="qz-title">📋 사무실 퀴즈</div>
        <div class="quiz-q" id="qz-question">질문 내용</div>
        <div id="qz-choices"></div>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================
       안전한 효과음 비프음 재생 함수
    ========================================== */
    let audioCtx = null;
    function playBeep(freq = 440, duration = 0.08, type = 'square') {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        // 브라우저 차단 시 소리만 끄고 게임 로직은 계속 실행
      }
    }

    function playSuccess() {
      playBeep(523, 0.1);
      setTimeout(() => playBeep(659, 0.1), 100);
      setTimeout(() => playBeep(783, 0.2), 200);
    }

    function playWrong() {
      playBeep(220, 0.15, 'sawtooth');
      setTimeout(() => playBeep(180, 0.2, 'sawtooth'), 150);
    }

    /* ==========================================
       게임 데이터 및 상태 관리
    ========================================== */
    let currentRoom = 1;
    let room1Solved = { memo: false, phone: false };
    let room2Solved = { memo: false, phone: false };

    const quizzes = {
      r1_memo: {
        title: "📝 책상 위 이메일 양식 퀴즈",
        question: "김부장님이 거래처 이메일 제목 양식을 물어보셨다. 가장 올바른 제목은?",
        choices: [
          "안녕하세요 부장님 메일 드립니다",
          "[ABC상사] 2026년 3분기 프로젝트 정기보고서 제출건",
          "급함!!! 확인 부탁드립니다!!",
          "제출합니다."
        ],
        answer: 1,
        successMsg: "정답이다! 비즈니스 이메일 작성법을 완벽히 해결했다."
      },
      r1_phone: {
        title: "☎️ 외부 전화 응대 퀴즈",
        question: "부장님이 부재중일 때 외부 거래처 전화를 받았다. 가장 적절한 응대는?",
        choices: [
          "부장님 지금 담배 피우러 나가셨는데요?",
          "지금 자리에 안 계셔서 나중에 다시 걸어주세요.",
          "현재 잠시 자리를 비우셨습니다. 메모나 연락처를 남겨드릴까요?",
          "모르겠습니다. 다른 분한테 전화해보세요."
        ],
        answer: 2,
        successMsg: "깔끔한 전화 응대! 부장님의 신뢰도가 상승했다."
      },
      r2_memo: {
        title: "📊 보고서 결재 퀴즈",
        question: "임원실 보고서 작성 중이다. 상사 보고 시 '두괄식 작성'의 올바른 의미는?",
        choices: [
          "결론과 핵심 요약을 맨 앞에 먼저 작성한다.",
          "보고서 배경과 과정을 10페이지 이상 길게 작성한다.",
          "결론은 맨 마지막장에만 적는다.",
          "구두로만 대충 설명한다."
        ],
        answer: 0,
        successMsg: "완벽하다! 이사님이 만족스러운 표정으로 결재 도장을 찍으셨다."
      },
      r2_phone: {
        title: "🔐 퇴근 보안 점검 퀴즈",
        question: "사무실 퇴근 전 확인해야 할 '보안 가이드' 중 틀린 것은?",
        choices: [
          "중요 서류는 캐비닛에 넣고 잠근다.",
          "PC 화면을 잠그거나 전원을 끈다.",
          "마지막 퇴근자는 창문과 문을 잠근다.",
          "퇴근 전 메인 서버 전원 코드를 뽑아둔다."
        ],
        answer: 3,
        successMsg: "보안 점검 완료! 이제 야근 없이 무사히 출입문이 열린다!"
      }
    };

    /* ==========================================
       UI 및 대사 제어 함수
    ========================================== */
    function setDialogue(speaker, text, options = []) {
      playBeep(600, 0.05);
      document.getElementById('speaker-name').innerText = speaker;
      document.getElementById('dialogue-text').innerText = text;
      
      const optContainer = document.getElementById('options-container');
      optContainer.innerHTML = '';
      
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt.label;
        btn.ON-CLICK = (e) => {
          e.stopPropagation();
          playBeep(800, 0.05);
          opt.action();
        };
        optContainer.appendChild(btn);
      });
    }

    function checkDoorStatus() {
      const door = document.getElementById('door-obj');
      const doorLabel = document.getElementById('door-label');
      
      let isUnlocked = false;
      if (currentRoom === 1 && room1Solved.memo && room1Solved.phone) isUnlocked = true;
      if (currentRoom === 2 && room2Solved.memo && room2Solved.phone) isUnlocked = true;

      if (isUnlocked) {
        door.style.opacity = '1';
        doorLabel.innerText = currentRoom === 1 ? "🚪 2관 이동 가능!" : "🚪 퇴근문 열림!";
        doorLabel.style.background = '#4caf50';
      }
    }

    /* ==========================================
       글로벌 클릭 이벤트 핸들러
    ========================================== */
    window.clickBoss = function() {
      if (currentRoom === 1) {
        setDialogue("김부장님", "어이 신입~ 오늘 칼퇴하고 싶나?\n책상의 이메일 메모랑 전화 응대 퀴즈부터 완료하게나!");
      } else {
        setDialogue("박이사님", "오~ 여기까지 왔군! 결재 서류와 퇴근 보안 점검을 마치면 보내주지!");
      }
    };

    window.clickMemo = function() {
      const key = currentRoom === 1 ? 'r1_memo' : 'r2_memo';
      const isSolved = currentRoom === 1 ? room1Solved.memo : room2Solved.memo;

      if (isSolved) {
        setDialogue("신입사원 (나)", "이 퀴즈는 이미 풀어냈다!");
        return;
      }
      openQuiz(key);
    };

    window.clickPhone = function() {
      const key = currentRoom === 1 ? 'r1_phone' : 'r2_phone';
      const isSolved = currentRoom === 1 ? room1Solved.phone : room2Solved.phone;

      if (isSolved) {
        setDialogue("신입사원 (나)", "전화기 관련 문제는 해결 완료했다!");
        return;
      }
      openQuiz(key);
    };

    window.clickDoor = function() {
      if (currentRoom === 1) {
        if (room1Solved.memo && room1Solved.phone) {
          triggerRoomChange(2);
        } else {
          setDialogue("경고", "사무실의 2가지 문제(메모, 전화기)를 모두 풀어야 다음 방으로 갈 수 있습니다!");
          playWrong();
        }
      } else {
        if (room2Solved.memo && room2Solved.phone) {
          showEnding();
        } else {
          setDialogue("경고", "모든 보안 및 결재 퀴즈를 마쳐야 정문 열쇠를 얻을 수 있습니다!");
          playWrong();
        }
      }
    };

    /* ==========================================
       퀴즈 창 제어
    ========================================== */
    function openQuiz(quizKey) {
      const qData = quizzes[quizKey];
      document.getElementById('qz-title').innerText = qData.title;
      document.getElementById('qz-question').innerText = qData.question;
      
      const choicesDiv = document.getElementById('qz-choices');
      choicesDiv.innerHTML = '';

      qData.choices.forEach((choice, idx) => {
        const div = document.createElement('div');
        div.className = 'quiz-choice';
        div.innerText = `${idx + 1}. ${choice}`;
        div.ON-CLICK = (e) => {
          e.stopPropagation();
          submitAnswer(quizKey, idx);
        };
        choicesDiv.appendChild(div);
      });

      document.getElementById('quiz-modal').style.display = 'flex';
    }

    function submitAnswer(quizKey, chosenIdx) {
      const qData = quizzes[quizKey];
      document.getElementById('quiz-modal').style.display = 'none';

      if (chosenIdx === qData.answer) {
        playSuccess();
        setDialogue("정답 성공!", qData.successMsg);

        if (quizKey === 'r1_memo') room1Solved.memo = true;
        if (quizKey === 'r1_phone') room1Solved.phone = true;
        if (quizKey === 'r2_memo') room2Solved.memo = true;
        if (quizKey === 'r2_phone') room2Solved.phone = true;

        checkDoorStatus();
      } else {
        playWrong();
        setDialogue("오답!", "틀렸다... 부장님의 따가운 시선이 느껴진다. 다시 시도해보자.", [
          { label: "다시 도전하기", action: () => openQuiz(quizKey) }
        ]);
      }
    }

    /* ==========================================
       방 이동 및 엔딩
    ========================================== */
    function triggerRoomChange(toRoom) {
      const overlay = document.getElementById('overlay');
      overlay.style.display = 'block';
      setTimeout(() => { overlay.style.opacity = '1'; }, 10);

      setTimeout(() => {
        currentRoom = toRoom;
        const screen = document.getElementById('screen');
        const badge = document.getElementById('room-badge');
        
        if (toRoom === 2) {
          screen.className = 'office-bg-2';
          badge.innerText = "📍 2관: 임원실 (최종관문)";
          document.getElementById('boss-npc').querySelector('.obj-label').innerText = "박이사님";
          document.getElementById('boss-npc').querySelector('.pixel-sprite').innerText = "👨‍🦳";
          document.getElementById('door-label').innerText = "🔒 최종 퇴근문";
          document.getElementById('door-obj').style.opacity = "0.5";
          
          setDialogue("시스템", "2관 [임원실]에 진입했다! 박이사님의 서류와 전화기를 조사하라.");
        }

        overlay.style.opacity = '0';
        setTimeout(() => { overlay.style.display = 'none'; }, 400);
      }, 500);
    }

    function showEnding() {
      playSuccess();
      const screen = document.getElementById('screen');
      screen.innerHTML = `
        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:#ffd700; text-align:center;">
          <div style="font-size:60px; margin-bottom:10px;">🎉</div>
          <h2 style="font-size:22px;">칼퇴 성공! 탈출 완료!</h2>
          <p style="color:#fff; font-size:14px; margin-top:10px;">당신은 무사히 야근을 피하고 칼퇴근에 성공했습니다!</p>
        </div>
      `;
      setDialogue("엔딩", "축하합니다! 포켓몬 스타일 픽셀 방탈출을 모두 클리어하셨습니다!", [
        { label: "처음부터 다시하기", action: () => location.reload() }
      ]);
    }
  </script>
</body>
</html>
