<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>S1FA PJT 방탈출 : 분석기술팀 신입사원의 칼퇴기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0; padding: 0;
      user-select: none;
      font-family: 'Galmuri9', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #fff;
      padding: 10px;
    }

    #game-container {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 4 / 3;
      background-color: #0b0f19;
      border: 3px solid #38bdf8;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 50px rgba(56, 189, 248, 0.25);
    }

    #top-nav {
      height: 10%;
      min-height: 44px;
      background: #1e293b;
      border-bottom: 2px solid #38bdf8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      z-index: 100;
    }

    #room-title { font-size: clamp(11px, 1.8vw, 15px); font-weight: bold; color: #38bdf8; }
    #user-stats { font-size: clamp(10px, 1.4vw, 13px); font-weight: bold; color: #facc15; background: #090d16; padding: 5px 10px; border: 1.5px solid #facc15; border-radius: 6px; }

    .nav-btn-group { display: flex; gap: 6px; }
    .nav-btn { background: #0f172a; color: #fff; border: 1.5px solid #38bdf8; padding: 5px 10px; font-size: 12px; font-weight: bold; cursor: pointer; border-radius: 6px; }
    .nav-btn:hover { background: #38bdf8; color: #0f172a; }

    #screen { width: 100%; height: 68%; position: relative; background-color: #020617; overflow: hidden; }
    #bg-svg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    #interactive-layer { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 40; }

    .art-item {
      position: absolute;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
      display: flex; justify-content: center; align-items: center;
    }
    .art-item:hover { transform: translateY(-3px) scale(1.03); filter: drop-shadow(0px 6px 10px rgba(56, 189, 248, 0.7)); }
    .draggable-item { cursor: grab; z-index: 60 !important; touch-action: none; }
    .draggable-item:active { cursor: grabbing; }

    .pixel-npc { position: absolute; z-index: 50; display: flex; flex-direction: column; align-items: center; }
    #boss-npc { cursor: pointer; }
    #player-npc { pointer-events: none; }

    .door-tag {
      background: rgba(15, 23, 42, 0.95);
      color: #f8fafc;
      font-size: clamp(9px, 1.2vw, 11px);
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid #38bdf8;
      margin-top: 4px;
      white-space: nowrap;
    }

    #dialogue-box {
      width: 100%; height: 22%;
      background: #090d16;
      border-top: 2px solid #38bdf8;
      padding: 12px 20px;
      position: relative;
      display: flex; flex-direction: column; justify-content: space-between;
      z-index: 100;
    }
    #dialogue-text { font-size: clamp(11px, 1.8vw, 14px); line-height: 1.6; color: #f1f5f9; font-weight: bold; white-space: pre-line; }

    .modal-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 6, 23, 0.88); backdrop-filter: blur(6px);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 15px; z-index: 1000;
    }
    .modal-card { background: #0f172a; border: 2px solid #38bdf8; border-radius: 12px; width: 100%; max-width: 520px; padding: 22px; color: #fff; position: relative; }
    .modal-close-btn { position: absolute; top: 12px; right: 14px; background: #1e293b; color: #f87171; border: 1px solid #ef4444; border-radius: 6px; width: 28px; height: 28px; cursor: pointer; font-weight: bold; }

    .quiz-title { font-size: 15px; color: #38bdf8; margin-bottom: 10px; font-weight: bold; }
    .quiz-q { font-size: 13px; margin-bottom: 12px; line-height: 1.5; color: #f8fafc; font-weight: bold; }
    .quiz-hint { display: inline-block; background: #1e293b; color: #facc15; font-size: 11px; padding: 4px 8px; border-radius: 4px; border: 1px solid #facc15; margin-bottom: 12px; }
    .quiz-choice-list { display: flex; flex-direction: column; gap: 8px; }
    .quiz-choice-item { background: #1e293b; border: 1.5px solid #334155; padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; color: #f1f5f9; }
    .quiz-choice-item:hover { background: #2563eb; color: #fff; }
    .quiz-input-group { display: flex; gap: 8px; }
    .quiz-input { flex: 1; padding: 10px; font-size: 13px; background: #020617; border: 1.5px solid #38bdf8; border-radius: 6px; color: #fff; font-weight: bold; }
    .quiz-submit-btn { background: #2563eb; color: #fff; border: none; padding: 0 18px; font-size: 13px; font-weight: bold; cursor: pointer; border-radius: 6px; }
    .start-input { width: 100%; padding: 12px; font-size: 13px; background: #020617; border: 1.5px solid #38bdf8; border-radius: 6px; color: #fff; margin: 16px 0; font-weight: bold; }
    .start-btn { width: 100%; background: #2563eb; color: #fff; border: none; padding: 12px; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 6px; }

    .wire-port { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; display: inline-block; }
    .wire-red { background: #ef4444; } .wire-blue { background: #3b82f6; } .wire-yellow { background: #eab308; }
    .stain-spot { width: 44px; height: 44px; background: rgba(180, 83, 9, 0.85); border-radius: 50%; position: absolute; cursor: pointer; display: flex; justify-content: center; align-items: center; border: 2px dashed #facc15; }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="start-modal" class="modal-overlay">
      <div class="modal-card">
        <h2 style="font-size: 18px; color:#38bdf8; text-align:center; margin-bottom:12px;">🔬 분석기술팀 신입사원의 칼퇴기</h2>
        <p style="font-size: 12px; line-height: 1.6; color:#cbd5e1; text-align:center;">
          실제 사무실/분석실 환경을 탐색하여 단서를 찾고 탈출하세요!<br>
          <span style="color:#ef4444;">[경고]</span> 오답 제출 시 <b>-2,000점</b> 감점!
        </p>
        <input type="text" id="nickname-input" class="start-input" placeholder="소속 파트명 / 이름 (예: EFA1 / 홍길동)..." maxlength="20">
        <button id="start-btn" class="start-btn">사무실 입장하기 ➔</button>
      </div>
    </div>

    <div id="top-nav">
      <div id="room-title">S1FA PJT : 1관 분석기술팀 EFA1 파트</div>
      <div id="user-stats">점수: 0점</div>
      <div class="nav-btn-group">
        <button id="prev-btn" class="nav-btn">◄ 이전관</button>
        <button id="next-btn" class="nav-btn">다음관 ►</button>
        <button id="reset-btn" class="nav-btn" style="border-color:#ef4444; color:#f87171;">🔄 초기화</button>
      </div>
    </div>

    <div id="screen">
      <svg id="bg-svg" viewBox="0 0 800 500" preserveAspectRatio="none"></svg>

      <!-- 파트장님 NPC (우측 고정) -->
      <div class="pixel-npc" id="boss-npc" style="top: 28%; left: 76%;">
        <svg id="boss-svg" width="75" height="105" viewBox="0 0 75 105"></svg>
        <div id="boss-tag" class="door-tag">김주헌 파트장님</div>
      </div>

      <!-- 플레이어 (좌측 고정) -->
      <div class="pixel-npc" id="player-npc" style="top: 32%; left: 6%;">
        <svg width="65" height="95" viewBox="0 0 65 95">
          <ellipse cx="32" cy="18" rx="14" ry="12" fill="#0f172a"/>
          <circle cx="32" cy="24" r="13" fill="#fde047"/>
          <path d="M 18,18 Q 32,8 46,18" stroke="#0f172a" stroke-width="5" fill="none"/>
          <circle cx="26" cy="23" r="2" fill="#0f172a"/>
          <circle cx="38" cy="23" r="2" fill="#0f172a"/>
          <path d="M 27,31 Q 32,35 37,31" stroke="#0f172a" stroke-width="2" fill="none"/>
          <path d="M 12,40 L 52,40 L 46,80 L 18,80 Z" fill="#2563eb"/>
        </svg>
        <div id="player-tag" class="door-tag">신입사원</div>
      </div>

      <div id="interactive-layer"></div>

      <div class="pixel-npc" id="door-obj" style="top: 6%; right: 2%; opacity: 0.6;">
        <svg width="50" height="70" viewBox="0 0 50 70">
          <rect x="2" y="2" width="46" height="66" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="4"/>
          <circle cx="40" cy="38" r="3" fill="#facc15"/>
        </svg>
        <div class="door-tag" id="door-label">🔒 다음 방</div>
      </div>
    </div>

    <div id="dialogue-box">
      <div id="dialogue-text">대사가 출력됩니다.</div>
    </div>

    <!-- 미니게임 모달 -->
    <div id="minigame-modal" class="modal-overlay" style="display:none;">
      <div class="modal-card">
        <button id="minigame-close-btn" class="modal-close-btn">✖</button>
        <div class="quiz-title" id="mg-title">🔧 특수 미션</div>
        <div id="mg-body" style="margin-top:10px; text-align:center;"></div>
      </div>
    </div>

    <!-- 퀴즈 모달 -->
    <div id="quiz-modal" class="modal-overlay" style="display:none;">
      <div class="modal-card">
        <button id="quiz-close-btn" class="modal-close-btn">✖</button>
        <div class="quiz-title" id="qz-title">📋 퀴즈</div>
        <div class="quiz-q" id="qz-question">질문</div>
        <div class="quiz-hint" id="qz-hint" style="display:none;">💡 힌트: </div>
        <div id="qz-choices-container" class="quiz-choice-list" style="display:none;"></div>
        <div id="qz-input-container" class="quiz-input-group" style="display:none;">
          <input type="text" id="qz-input" class="quiz-input" placeholder="정답을 입력하세요..." />
          <button id="qz-submit-btn" class="quiz-submit-btn">제출 ➔</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const questionBank = {
      1: {
        subjective: [
          { id: "r1_s1", title: "📝 1관: EFA1 이메일 규격", question: "김주헌 파트장님이 요청하신 이메일 제목 맨 앞 필수 대괄호 태그명은?", hint: "💡 힌트: 대괄호 안 프로젝트명 (예: S1FA PJT)", answers: ["S1FA PJT", "S1FAPJT"], successMsg: "김주헌 파트장님: 이메일 규격 숙지 확인!" },
          { id: "r1_s2", title: "📝 1관: 서류함 밑 비밀 메모", question: "수납함 밑에서 찾은 비밀 메모! EFA1 장비 신뢰성 테스트 목표 수치는?", hint: "💡 힌트: 백분율 수치 (예: 100% 또는 100)", answers: ["100%", "100", "99%"], successMsg: "김주헌 파트장님: 목표치 확인 완료!" }
        ],
        objective: [
          { id: "r1_o1", title: "☎️ 1관: 부재중 전화 응대", question: "파트장님 부재중일 때 외부 전화 응대로 올바른 것은?", choices: ["1. 담배 피우러 가셨는데요?", "2. 자리에 안 계시니 나중에 거세요.", "3. 잠시 자리를 비우셨습니다. 메모 남겨드릴까요?", "4. 몰라요."], answerIdx: 2, successMsg: "김주헌 파트장님: 완벽한 비즈니스 응대!" },
          { id: "r1_o2", title: "💻 1관: 이석 시 PC 보안", question: "퇴근전 이석 시 올바른 보안 조치는?", choices: ["1. 모니터만 끈다", "2. 화면 잠금(Win+L)을 누른다", "3. 메모장에 비번 노출", "4. 그냥 간다"], answerIdx: 1, successMsg: "김주헌 파트장님: 철저한 보안 통과!" }
        ]
      },
      2: {
        subjective: [
          { id: "r2_s1", title: "📝 2관: 보고서 작성법", question: "결론과 핵심 요약을 맨 앞에 먼저 작성하는 3글자 보고 방식은?", hint: "💡 힌트: ㄷㄱㅅ 작성법", answers: ["두괄식", "두괄식 작성"], successMsg: "김진석 파트장님: 두괄식 보고 가독성 굿!" },
          { id: "r2_s2", title: "🔌 2관: 서버 장애 복구", question: "케이블 연결 성공! 원인 분석을 위해 확보해야 하는 2글자 데이터는?", hint: "💡 힌트: ㄹㄱ 또는 log", answers: ["로그", "log", "LOG"], successMsg: "김진석 파트장님: 시스템 로그 확보 완료!" }
        ],
        objective: [
          { id: "r2_o1", title: "⚙️ 2관: 형상 관리 수칙", question: "소스 코드 수정 후 메인 서버 반영 전 필수 조치는?", choices: ["1. 바로 메인에 올린다", "2. 로컬 테스트 및 영향을 검증한다", "3. 주석 삭제", "4. 퇴근 1분전 반영"], answerIdx: 1, successMsg: "김진석 파트장님: 안정적인 형상 관리 통과!" }
        ]
      },
      3: {
        subjective: [
          { id: "r3_s1", title: "📝 3관: UX 검증", question: "사용자 직관성을 최우선하는 기획 개념의 2글자 영문 약어는?", hint: "💡 힌트: 사용자 경험 (영문 2글자)", answers: ["UX", "ux"], successMsg: "윤지혜 파트장님: UX 편의성이 최고죠!" },
          { id: "r3_s2", title: "🔍 3관: 모니터 단서", question: "VSEM 전자현미경의 정밀 측정 단위 나노미터의 영문 약어는?", hint: "💡 힌트: 예) nm", answers: ["nm", "NM"], successMsg: "윤지혜 파트장님: 정밀 나노 단위 확인 완료!" }
        ],
        objective: [
          { id: "r3_o1", title: "🔬 3관: 정밀 시편 취급", question: "VSEM 분석용 정밀 시편 취급 수칙으로 올바른 것은?", choices: ["1. 맨손으로 만진다", "2. 전용 핀셋과 제어 장갑을 착용한다", "3. 서류 더미에 둔다", "4. 물로 씻는다"], answerIdx: 1, successMsg: "윤지혜 파트장님: 장비 수칙 통과!" }
        ]
      },
      4: {
        subjective: [
          { id: "r4_s1", title: "📝 4관: 최종 출하 점검", question: "프로젝트 최종 출하 전 데이터 백업과 함께 점검해야 하는 핵심 2글자 단어는?", hint: "💡 힌트: ㅂㅇ", answers: ["보안", "테스트"], successMsg: "손승준 PL님: 최종 점검 완료!" },
          { id: "r4_s2", title: "🔐 4관: 캔틴 금고 문서", question: "프로젝트 최종 승인자 권한을 가진 2글자 직책 영문 약어는?", hint: "💡 힌트: 프로젝트 리더", answers: ["PL", "pl"], successMsg: "손승준 PL님: 최종 승인권자 확인!" }
        ],
        objective: [
          { id: "r4_o1", title: "🚀 4관: 신입사원의 자세", question: "프로젝트 성공을 위해 가장 필요한 역량은?", choices: ["1. 독단적 처리", "2. 적극적 질문과 소통", "3. 눈치 야근", "4. 지각"], answerIdx: 1, successMsg: "손승준 PL님: 훌륭한 마음가짐입니다!" }
        ]
      }
    };

    let playerNickname = "EFA1 / 신입사원";
    let currentRoom = 1;
    let totalScore = 0;
    let gameStartTime = 0;
    let activeQuizObj = null;
    let currentSlotKey = null;

    let roomSolved = {
      1: { q1: false, q2: false, q3: false },
      2: { q1: false, q2: false, q3: false },
      3: { q1: false, q2: false, q3: false },
      4: { q1: false, q2: false, q3: false }
    };

    let assignedQuizzes = { 1: {}, 2: {}, 3: {}, 4: {} };

    const roomData = {
      1: { title: "S1FA PJT : 1관 분석기술팀 EFA1 파트 (오픈천장 오피스)", bossName: "김주헌 파트장님", welcomeMsg: "김주헌 파트장님: 오픈형 사무실에 오신 것을 환영하네! 서류함을 치워 단서를 찾게." },
      2: { title: "S1FA PJT : 2관 분석기술팀 EFA2 파트 (화이트 미니멀 오피스)", bossName: "김진석 파트장님", welcomeMsg: "김진석 파트장님: EFA2 개발 파트입니다. 타공판의 단선 케이블을 복구하세요." },
      3: { title: "S1FA PJT : 3관 분석기술팀 PFA/VSEM 파트 (정밀 분석실)", bossName: "윤지혜 파트장님", welcomeMsg: "윤지혜 파트장님: PFA/VSEM 분석실입니다. 모니터를 들여다보고 얼룩을 닦아보세요." },
      4: { title: "S1FA PJT : 4관 분석기술팀 PL실 (모던 캔틴룸)", bossName: "손승준 PL님", welcomeMsg: "손승준 PL님: 캔틴룸입니다. 테이블 뒤 정수기 쪽 단서를 찾아 비밀 금고를 여세요!" }
    };

    function generateQuizzes() {
      for (let r = 1; r <= 4; r++) {
        const bank = questionBank[r];
        assignedQuizzes[r] = {
          q1: bank.subjective[0],
          q2: bank.subjective[1] || bank.objective[0],
          q3: bank.objective[1] || bank.objective[0]
        };
      }
    }

    function renderRoomBackground(r) {
      const svg = document.getElementById('bg-svg');
      if (r === 1) {
        // 이미지 1: 노출 천장 배관 & 사각 조명 & 서류함
        svg.innerHTML = `
          <rect width="800" height="320" fill="#26282b"/>
          <path d="M 50,20 L 750,20 M 50,40 L 750,40 M 100,0 L 100,60 M 300,0 L 300,60 M 500,0 L 500,60 M 700,0 L 700,60" stroke="#525861" stroke-width="6"/>
          <!-- 천장 사각 천장등 -->
          <rect x="120" y="50" width="560" height="40" fill="none" stroke="#f8fafc" stroke-width="4"/>
          <!-- 바닥 -->
          <rect y="320" width="800" height="180" fill="#474e57"/>

    function makeElementDraggable(elem, onMoved) {
      if (!elem) return;
      let isDragging = false, startX, startY, initLeft, initTop;

      const down = (e) => {
        isDragging = true;
        const evt = e.touches ? e.touches[0] : e;
        startX = evt.clientX; startY = evt.clientY;
        initLeft = elem.offsetLeft; initTop = elem.offsetTop;
      };

      const move = (e) => {
        if (!isDragging) return;
        const evt = e.touches ? e.touches[0] : e;
        const dx = evt.clientX - startX, dy = evt.clientY - startY;
        elem.style.left = (initLeft + dx) + 'px';
        elem.style.top = (initTop + dy) + 'px';
        if (Math.abs(dx) > 20 || Math.abs(dy) > 20) { if (onMoved) { onMoved(); onMoved = null; } }
      };

      const up = () => { isDragging = false; };
      elem.addEventListener('mousedown', down); elem.addEventListener('touchstart', down);
      window.addEventListener('mousemove', move); window.addEventListener('touchmove', move);
      window.addEventListener('mouseup', up); window.addEventListener('touchend', up);
    }

      } else {

      }

    function openQuizObj(qData, slotKey) {
      activeQuizObj = qData; currentSlotKey = slotKey;
      document.getElementById('qz-title').innerText = qData.title;
      document.getElementById('qz-question').innerText = qData.question;

      const hintElem = document.getElementById('qz-hint');
      const choicesContainer = document.getElementById('qz-choices-container');
      const inputContainer = document.getElementById('qz-input-container');

      choicesContainer.innerHTML = ''; document.getElementById('qz-input').value = '';

      if (qData.answers) {
        hintElem.style.display = 'inline-block'; hintElem.innerText = qData.hint;
        choicesContainer.style.display = 'none'; inputContainer.style.display = 'flex';
      } else {
        hintElem.style.display = 'none'; inputContainer.style.display = 'none';
        choicesContainer.style.display = 'flex';
        qData.choices.forEach((c, idx) => {
          const btn = document.createElement('div');
          btn.className = 'quiz-choice-item'; btn.innerText = c;
          btn.addEventListener('click', () => checkAnswer(idx));
          choicesContainer.appendChild(btn);
        });
      }
      document.getElementById('quiz-modal').style.display = 'flex';
    }

    function checkAnswer(chosenIdx) {
      if (chosenIdx === activeQuizObj.answerIdx) handleSuccess();
      else handleFail();
    }

    function checkSubjective() {
      const val = document.getElementById('qz-input').value.trim().toLowerCase().replace(/\s+/g, '');
      const ok = activeQuizObj.answers.some(a => a.toLowerCase().replace(/\s+/g, '') === val);
      if (ok) handleSuccess();
      else handleFail();
    }

    function handleSuccess() {
      totalScore += 1000;
      updateScoreUI();
      if (currentSlotKey) roomSolved[currentRoom][currentSlotKey] = true;
      setDialogue(`${activeQuizObj.successMsg}\n(+1,000점 획득! 현재 총점: ${totalScore}점)`);
      updateDoorStatusUI();
      document.getElementById('quiz-modal').style.display = 'none';
    }

    function handleFail() {
      totalScore = Math.max(0, totalScore - 2000);
      updateScoreUI();
      alert(`❌ 오답입니다! -2,000점 감점되었습니다. (현재 점수: ${totalScore}점)`);
    }

    function updateScoreUI() {
      document.getElementById('user-stats').innerText = `점수: ${totalScore}점 | ${playerNickname}`;
    }

    function setDialogue(txt) { document.getElementById('dialogue-text').innerText = txt; }

    function triggerRoomChange(toRoom) {
      currentRoom = toRoom;
      document.getElementById('room-title').innerText = roomData[toRoom].title;
      renderRoomBackground(toRoom);
      renderInteractiveElements(toRoom);
      setDialogue(roomData[toRoom].welcomeMsg);
    }

    document.addEventListener('DOMContentLoaded', () => {
      generateQuizzes();
      document.getElementById('start-btn').addEventListener('click', () => {
        const name = document.getElementById('nickname-input').value.trim();
        if (!name) return alert("이름을 입력하세요!");
        playerNickname = name;
        document.getElementById('start-modal').style.display = 'none';
        updateScoreUI();
        triggerRoomChange(1);
      });

      document.getElementById('prev-btn').addEventListener('click', () => { if (currentRoom > 1) triggerRoomChange(currentRoom - 1); });
      document.getElementById('next-btn').addEventListener('click', () => {
        const solved = roomSolved[currentRoom];
        if (!solved.q1 || !solved.q2 || !solved.q3) return alert("현재 방의 3개 미션을 모두 완료해야 이동할 수 있습니다!");
        if (currentRoom < 4) triggerRoomChange(currentRoom + 1);
        else alert(`🎉 모든 미션을 완수했습니다! 최종 점수: ${totalScore}점`);
      });

      document.getElementById('qz-submit-btn').addEventListener('click', checkSubjective);
      document.getElementById('quiz-close-btn').addEventListener('click', () => document.getElementById('quiz-modal').style.display = 'none');
      document.getElementById('minigame-close-btn').addEventListener('click', () => document.getElementById('minigame-modal').style.display = 'none');
    });
  </script>
</body>
</html>
