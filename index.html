<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#20242e">
<title>S1FA 방탈출 : 분석기술팀 탈출 대작전</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<!-- 캐릭터 PNG 를 스크립트보다 먼저 받기 시작한다 (없으면 그냥 무시된다) -->
<link rel="preload" as="image" href="assets/img/char/p1.png">
<link rel="preload" as="image" href="assets/img/char/p2.png">
<link rel="preload" as="image" href="assets/img/char/p3.png">
<link rel="preload" as="image" href="assets/img/char/p4.png">
<link rel="preload" as="image" href="assets/img/char/boss1.png">
<link rel="preload" as="image" href="assets/img/char/boss2.png">
<link rel="preload" as="image" href="assets/img/char/boss3.png">
<link rel="preload" as="image" href="assets/img/char/boss4.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
html{background:#141821}
/* 첫 프레임부터 화면을 덮는 가림막.
   준비가 끝나기 전의 로그인 화면·대기실·기본 캐릭터가 스쳐 보이지 않게 한다.
   style.css 를 기다리면 늦으므로 여기에 직접 적는다. */
#boot-cover{
  position:fixed;inset:0;z-index:3000;background:#141821;
  background-image:
    radial-gradient(circle at 20% 10%, #2b3550 0%, transparent 55%),
    radial-gradient(circle at 80% 90%, #23304a 0%, transparent 55%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  color:#9fb4d4;font-family:system-ui,-apple-system,sans-serif;
  transition:opacity .28s ease;
}
#boot-cover.is-gone{opacity:0;pointer-events:none}
#boot-cover .bc-title{
  font-size:26px;font-weight:800;color:#fff;letter-spacing:2px;
  text-shadow:0 3px 0 rgba(0,0,0,.5);
}
#boot-cover .bc-msg{font-size:12px;letter-spacing:1px}
#boot-cover .bc-bar{
  width:180px;height:10px;border:3px solid #1d2029;border-radius:6px;
  background:#20242e;overflow:hidden;
}
#boot-cover .bc-bar i{
  display:block;height:100%;width:40%;background:#e8b83b;
  animation:bcSlide 1.1s ease-in-out infinite;
}
@keyframes bcSlide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){#boot-cover .bc-bar i{animation:none;width:100%}}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div id="boot-cover">
  <div class="bc-title">S1FA 방탈출</div>
  <div class="bc-bar"><i></i></div>
  <div class="bc-msg">불러오는 중...</div>
</div>

<div id="app">

  <!-- ============ 1. 로그인 / 캐릭터 선택 ============ -->
  <section id="login-screen" class="screen">
    <div class="login-box">
      <div class="logo-plate">
        <div class="logo-sub">SAMSUNG · 분석기술팀</div>
        <h1 class="logo-title">S1FA 방탈출</h1>
        <div class="logo-tag">단서를 찾아 4개의 방을 탈출하라!</div>
      </div>

      <div class="panel">
        <div class="panel-label">1. 캐릭터 선택</div>
        <div id="avatar-picker" class="avatar-picker"></div>

        <div class="panel-label">2. 근무지</div>
        <div id="loc-picker" class="chip-row">
          <button class="chip is-on" data-loc="SR3">SR3</button>
          <button class="chip" data-loc="S1L">S1L</button>
        </div>

        <div class="panel-label">3. 이름</div>
        <input id="name-input" class="pk-input" type="text" maxlength="8" placeholder="이름을 입력하세요" autocomplete="off">

        <button id="join-btn" class="pk-btn pk-btn-main">▶ 대기실 입장</button>
        <button id="admin-login-btn" class="pk-btn pk-btn-ghost">👑 관리자 로그인</button>
      </div>

      <p class="login-note">※ 각 방 5분 · 총 4개 방 20분 · 기록은 서버에 저장되어 새로고침해도 이어집니다.</p>
    </div>
  </section>

  <!-- ============ 2. 게임 화면 ============ -->
  <section id="game-screen" class="screen hidden">

    <header id="hud">
      <div class="hud-zone hud-zone-a">
        <div id="hud-room" class="hud-chip hud-room"><span class="rm-full">대기실</span><span class="rm-short">대기실</span></div>
        <div id="hud-player" class="hud-chip hud-player">-</div>
        <div class="hud-stat">
          <div id="hud-clues" class="hud-chip hud-clues"></div>
          <div id="hud-score" class="hud-chip hud-score">0 P</div>
        </div>
      </div>
      <div class="hud-zone hud-zone-b">
        <div class="hud-chip hud-time">
          <span class="t-label">방</span><span id="hud-room-time" class="t-room">05:00</span>
          <span class="t-div">|</span>
          <span class="t-label">전체</span><span id="hud-total-time" class="t-total">20:00</span>
        </div>
        <div class="hud-btns">
          <button id="btn-chat" class="hud-btn hud-btn-chat" title="채팅" aria-label="채팅" data-n="0">💬</button>
          <button id="btn-board" class="hud-btn" title="순위표" aria-label="순위표">🏆</button>
          <button id="btn-sound" class="hud-btn" title="사운드" aria-label="사운드">🔊</button>
          <button id="btn-admin" class="hud-btn hud-btn-admin hidden" title="관리자 패널" aria-label="관리자 패널">👑</button>
          <button id="btn-logout" class="hud-btn" title="로그아웃" aria-label="로그아웃">🚪</button>
        </div>
      </div>
    </header>

    <div id="stage-wrap">
      <div id="stage">
        <canvas id="bg-canvas" width="240" height="160"></canvas>
        <div id="bg-image" class="bg-image hidden"></div>
        <div id="scene-title" class="scene-title"></div>
        <div id="prop-layer" class="layer"></div>
        <div id="actor-layer" class="layer"></div>
        <div id="fx-layer" class="layer"></div>
        <div id="stage-overlay" class="stage-overlay hidden"><div id="stage-overlay-text"></div></div>
      </div>
    </div>

    <div id="dialogue" class="dialogue">
      <div id="dialogue-speaker" class="dialogue-speaker hidden"></div>
      <p id="dialogue-text"></p>
      <span id="dialogue-arrow" class="dialogue-arrow">▼</span>
    </div>

  </section>

</div>

<!-- 창·알림·연출은 #app 밖에 둔다 — 어떤 경우에도 화면 기준으로 가운데 뜨도록 -->
<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="fx-root"></div>

<audio id="bgm" src="assets/img/battle.mp3" loop preload="none"></audio>

<script src="assets/js/fallback-db.js"></script>
<script src="assets/js/sprites.js"></script>
<script src="assets/js/pixel.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/net.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/docs.js"></script>
<script src="assets/js/quizkit.js"></script>
<script src="assets/js/puzzles.js"></script>
<script src="assets/js/chat.js"></script>
<script src="assets/js/game.js"></script>
<script src="assets/js/admin.js"></script>
<script src="assets/js/boot.js"></script>
</body>
</html>
